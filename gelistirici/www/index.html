<style>
/* =====================================================================
   GÖRSEL KİMLİK — "Seçim gecesi stüdyosu"
   Lacivert stüdyo zemini · oy pusulası kâğıdı · tercih mührü moru (oyuncunun eylemi)
   · canlı kırmızısı (sandık açık, son dakika) · renkleri partiler taşır.
   Başlık ve rakamlar: Kurul Display (dar grotesk, seçim yayını grafikleri)
   Metin: telefonun kendi yazı tipi.
   ===================================================================== */
:root{
  --bg:#0E1530; --bg2:#0A1026; --panel:#151E3D; --panel2:#1D2850; --panel3:#283563;
  --line:rgba(164,184,255,.10); --line2:rgba(164,184,255,.19);
  --txt:#EEF1F8; --txt2:#C9D1E6; --mut:#98A4C4; --faint:#6E7A9C;
  --ink:#7B61FF; --ink2:#A895FF; --inkbg:rgba(123,97,255,.16);
  --al:#F0454B; --al2:#FF7479; --albg:rgba(240,69,75,.15);
  --good:#34C98A; --warn:#F2B33D;
  --paper:#F4F6FB; --paperInk:#1B2140; --paperLine:#D5DAE8;
  /* eski adlar (satır içi stillerde geçenler) yeni kimliğe bağlanır */
  --acc:var(--ink); --acc2:var(--al2); --gold:var(--ink2); --gold2:var(--ink2);
  --disp:"Kurul Display","Arial Narrow","Roboto Condensed",sans-serif;
  --r:14px; --rBtn:11px;
  --safeT:env(safe-area-inset-top,0px); --safeB:max(env(safe-area-inset-bottom,0px),12px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overscroll-behavior:none}
body{color:var(--txt);font-family:-apple-system,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overflow:hidden}
input,select,textarea{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ink2);outline-offset:2px;border-radius:6px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---- Üst çubuk ve alt sekmeler ---- */
.ust{padding:calc(var(--safeT) + 10px) 14px 10px 16px;display:flex;align-items:center;gap:8px;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.ust h1{font-family:var(--disp);font-size:25px;font-weight:700;letter-spacing:.1px;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ust .geri{width:36px;height:36px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:22px;line-height:1;flex:none}
.ust .ikon{position:relative;width:36px;height:36px;border-radius:10px;background:var(--panel);display:grid;place-items:center;flex:none}
.ust .ikon svg{width:20px;height:20px}
.ust .ikon.portre-ikon{background:none;padding:0;overflow:visible}
.ust .ikon.portre-ikon .portre{width:36px;height:36px}
.ust .para-cip{width:auto;padding:0 10px;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--txt);white-space:nowrap;letter-spacing:.2px}
.icerik{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--safeB) + 84px)}
.icerik.tam{padding-bottom:calc(var(--safeB) + 24px)}
.sekmeler{position:absolute;left:0;right:0;bottom:0;display:flex;padding:0 4px var(--safeB);background:var(--bg2);border-top:1px solid var(--line);z-index:6;touch-action:pan-y}
.sekmeler button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 5px;font-size:11px;font-weight:600;color:var(--faint)}
.sekmeler button svg{width:22px;height:22px}
.sekmeler button.aktif{color:var(--txt)}
.sekmeler button.aktif::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.sekmeler button.aktif svg{color:var(--ink2)}
.sayi{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--al);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.sekmeler .sayi{top:3px;right:calc(50% - 22px);border-color:var(--bg2)}
.sekmeler .nokta{position:absolute;top:7px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--al);border:2px solid var(--bg2)}

/* ---- Bölümler (kart) ---- */
.kart{background:var(--panel);border-radius:var(--r);padding:15px 15px 14px;margin-bottom:12px}
.kart h2{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.15;color:var(--txt);margin-bottom:8px;letter-spacing:.1px;text-transform:none}
.kart h3{font-family:var(--disp);font-size:22px;font-weight:700;line-height:1.15;margin-bottom:4px}
.kart.duz{background:none;padding:4px 0 0}
.kart.cizgili{border-left:4px solid var(--parti,var(--ink));border-radius:4px var(--r) var(--r) 4px}
.alt{color:var(--mut);font-size:13.5px}
.kucuk{font-size:12.5px;color:var(--faint)}
.bolum-bas{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 2px 8px}
.bolum-bas h2{font-family:var(--disp);font-size:22px;font-weight:700}
.bolum-bas a,.bolum-bas button{font-size:13px;font-weight:700;color:var(--ink2)}

/* ---- Düğmeler ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:var(--rBtn);font-weight:700;font-size:15px;background:var(--ink);color:#fff;margin-top:10px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ikinci{background:var(--panel2);color:var(--txt)}
.btn.altin{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1.5px rgba(168,149,255,.55)}
.btn.altin:active{background:var(--inkbg)}
.btn.tehlike{background:transparent;color:var(--al2);box-shadow:inset 0 0 0 1.5px rgba(240,69,75,.45)}
.btn.canli{background:var(--al)}
.btn:disabled{opacity:.42;pointer-events:none}
.btn.yarim{width:auto;flex:1}
.btn svg{width:19px;height:19px;flex:none}
#hReklam,#hMagaza{flex-direction:column;gap:2px;line-height:1.25}
.satir{display:flex;gap:8px}
.alan{margin-top:10px}
.alan label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px;font-weight:600}
.alan input,.alan select{width:100%;padding:13px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);outline:none;font-size:16px}
.alan input:focus,.alan select:focus,textarea:focus{border-color:var(--ink2)}

/* ---- Satırlar, etiketler ---- */
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--mut)}.kv .v{font-weight:600;text-align:right}
.rozet{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--txt2);white-space:nowrap}
.rozet.kirmizi{background:var(--albg);color:var(--al2)}
.rozet.kirmizi::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--al);animation:nabiz 1.6s ease-in-out infinite}
.rozet.yesil{background:rgba(52,201,138,.14);color:var(--good)}
.rozet.altin{background:var(--inkbg);color:var(--ink2)}
.rozet.sari{background:rgba(242,179,61,.14);color:var(--warn)}
@keyframes nabiz{50%{opacity:.25}}
.parti{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.parti .nok{width:10px;height:10px;border-radius:2px;flex:none}
.liste-satir{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.liste-satir:last-child{border-bottom:0}
.liste-satir .orta{flex:1;min-width:0}
.liste-satir .orta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amb{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;flex:none}
.amb svg{width:22px;height:22px}

/* ---- Seçim olay kartları ---- */
.olay{border-radius:var(--r);padding:15px;margin-bottom:12px;background:var(--panel);border-left:4px solid var(--panel3)}
.olay.oy{border-left-color:var(--al);background:linear-gradient(90deg,rgba(240,69,75,.10),var(--panel) 55%)}
.olay.basvuru{border-left-color:var(--ink)}
.olay .baslik{display:flex;align-items:center;justify-content:space-between;gap:8px}
.olay .baslik b{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.15}
.sayac{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:700;font-size:34px;letter-spacing:.3px;margin-top:4px;line-height:1.05}
.takvim-satir{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.takvim-satir:last-child{border-bottom:0}
.takvim-satir .gun{width:46px;text-align:center;flex:none;border-radius:8px;padding:4px 0;background:var(--bg)}
.takvim-satir .gun b{display:block;font-family:var(--disp);font-size:22px;line-height:1.05}
.takvim-satir .gun span{font-size:11px;color:var(--mut)}
.bar{height:8px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}

/* ---- Oy pusulası (kâğıt) ve tercih mührü ---- */
.pusula-kagit{background:var(--paper);color:var(--paperInk);border-radius:6px;padding:6px 14px 4px;margin-top:10px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.pusula-kagit .pusula-bas{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 10px;border-bottom:2px solid var(--paperInk)}
.pusula-kagit .pusula-bas b{font-family:var(--disp);font-size:19px}
.pusula-kagit .pusula-bas span{font-size:12px;color:#5b6486}
.pusula-secenek{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--paperLine);cursor:pointer;position:relative}
.pusula-secenek:last-child{border-bottom:0}
.pusula-kagit .pusula-secenek b{color:var(--paperInk)}
.pusula-kagit .kucuk,.pusula-kagit .vaat{color:#5b6486}
.pusula-kagit .amb{background:#fff!important;box-shadow:inset 0 0 0 1.5px var(--paperLine)}
.pusula-kagit .daire{display:none}
.pusula-secenek .daire,.pusula-secenek .muhur-yeri{width:52px;height:52px;border-radius:50%;border:1.5px dashed #b8bfd4;flex:none;display:grid;place-items:center;margin-left:auto}
.pusula-secenek.secili .daire,.pusula-secenek.secili .muhur-yeri{border-color:transparent}
.pusula-secenek.secili .muhur-yeri::after,.pusula-secenek.secili .daire::after{content:"TERCİH";width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.5px;color:var(--ink);border:3px double var(--ink);transform:rotate(-16deg);animation:mhr .32s cubic-bezier(.2,1.5,.4,1);background:rgba(123,97,255,.06)}
@keyframes mhr{from{transform:rotate(-16deg) scale(1.9);opacity:0}to{transform:rotate(-16deg) scale(1);opacity:1}}
.mühür{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,16,38,.72);animation:sol .15s}
.mühür div{width:168px;height:168px;border-radius:50%;border:6px double var(--ink2);color:var(--ink2);display:grid;place-items:center;text-align:center;font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.05;transform:rotate(-14deg);animation:bas .45s cubic-bezier(.2,1.6,.4,1);background:rgba(123,97,255,.12)}
.mühür small{font-size:13px;letter-spacing:.4px;display:block;margin-top:4px}
@keyframes bas{from{transform:rotate(-14deg) scale(2.4);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.ref-pusula{display:flex;gap:16px;justify-content:center;margin:14px 0;padding:18px 10px;background:var(--paper);border-radius:6px}
.ref-daire{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:24px;border:3px solid #c3c9da;transition:transform .12s,box-shadow .12s}
.ref-daire.evet{background:#fff;color:var(--paperInk)}.ref-daire.hayir{background:#5d3a25;color:#fff;border-color:#4a2c1a}
.ref-daire.secili{box-shadow:0 0 0 4px var(--ink);transform:scale(1.04)}
.ref-sonuc{height:14px;border-radius:4px;background:var(--al);overflow:hidden;margin-top:6px}.ref-sonuc i{display:block;height:100%;background:var(--good)}.ref-sonuc.ince{height:6px}
.d-halkoylamasinda{background:var(--albg);color:var(--al2)}

/* ---- Seçim gecesi: sonuç gösterisi ---- */
.sonuc-sahne{background:var(--bg2);border-radius:var(--r);padding:16px 15px;margin-bottom:12px}
.sonuc-sahne .baslik-satir{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sonuc-sahne h2{font-family:var(--disp);font-size:24px;font-weight:700}
.dagilim{display:flex;height:16px;border-radius:3px;overflow:hidden;margin:12px 0 6px;background:var(--panel3)}
.dagilim i{display:block;height:100%;animation:dol .9s cubic-bezier(.3,.7,.2,1) both}
.sonuc-satir{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.sonuc-satir:last-child{border-bottom:0}
.sonuc-satir .yuzde{font-family:var(--disp);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sonuc-satir .cubuk{grid-column:1/-1;height:6px;border-radius:2px;background:var(--panel3);overflow:hidden}
.sonuc-satir .cubuk i{display:block;height:100%;animation:dol 1.1s cubic-bezier(.3,.7,.2,1) both}
.sonuc-satir.kazanan .yuzde{color:#fff}
.kazanan-bant{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--panel2);margin-bottom:10px;animation:sol .5s .9s both}
@keyframes dol{from{width:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

/* ---- Harita, segment, modal, bildirim ---- */
.harita svg path{transition:fill-opacity .2s}
.harita svg path:active{fill-opacity:.6}
.lejant{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12.5px}
.segment{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.segment button{flex:1;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mut)}
.segment button.aktif{background:var(--panel2);color:var(--txt)}
.modal-arka{position:fixed;inset:0;background:rgba(6,10,26,.66);z-index:20;display:flex;align-items:flex-end;animation:sol .2s}
.modal{width:100%;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:8px 16px calc(var(--safeB) + 16px);animation:yuk .25s cubic-bezier(.2,.9,.3,1)}
.modal h3{font-family:var(--disp);font-size:23px!important;font-weight:700!important;line-height:1.15}
.modal .tutamak{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 12px}
@keyframes yuk{from{transform:translateY(100%)}to{transform:none}}
@keyframes sol{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--safeB) + 90px);background:var(--panel3);padding:12px 14px;border-radius:10px;z-index:40;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:sol .2s;border-left:4px solid var(--good)}
.toast.hata{border-left-color:var(--al);background:#3a1d2a}

/* ---- Karşılama ---- */
.karsila{flex:1;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safeT) + 24px) 22px calc(var(--safeB) + 24px);overflow-y:auto}
.karsila h1{font-family:var(--disp);font-size:44px;font-weight:700;line-height:.98;letter-spacing:-.2px}
.karsila p.giris{color:var(--mut);margin:12px 0 22px;font-size:15.5px;max-width:34ch}
.logo{width:64px;height:64px;border-radius:50%;border:4px double var(--ink2);color:var(--ink2);display:grid;place-items:center;margin-bottom:18px;transform:rotate(-12deg)}
.logo svg{width:30px;height:30px}
.hemisikl{width:100%;max-width:360px;margin:0 auto 16px;display:block}
.hemisikl circle{animation:koltuk .4s both;transform-box:fill-box;transform-origin:center}
@keyframes koltuk{from{opacity:0;transform:scale(.3)}}
.hata-metin{color:var(--al2);font-size:13.5px;margin-top:10px;min-height:1px}
.onay{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--txt2)}
.onay input{width:20px;height:20px;accent-color:var(--ink);flex:none;margin-top:1px}
a.bag{color:var(--ink2);text-decoration:none;font-weight:600}

/* ---- Seçiciler ---- */
.renkler{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.renkler button{aspect-ratio:1;border-radius:8px;border:3px solid transparent}
.renkler button.secili{border-color:#fff}
.amblemler{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.amblemler button{aspect-ratio:1;border-radius:8px;background:var(--bg);display:grid;place-items:center;border:2px solid transparent}
.amblemler button svg{width:22px;height:22px}
.amblemler button.secili{border-color:var(--ink2)}
.bos{color:var(--mut);text-align:center;padding:18px 8px;font-size:14px}
.ara{position:sticky;top:-14px;background:var(--bg);padding:4px 0 8px;z-index:2}
.metin p{margin-bottom:10px;color:var(--txt2);font-size:14.5px;line-height:1.55;user-select:text}
.metin h4{margin:16px 0 6px;font-family:var(--disp);font-size:19px}
.yukleniyor{display:grid;place-items:center;padding:40px;color:var(--mut)}
.yukleniyor::before{content:"";width:28px;height:28px;border-radius:50%;border:3px solid var(--panel3);border-top-color:var(--ink2);animation:don .8s linear infinite;margin-bottom:10px}
@keyframes don{to{transform:rotate(360deg)}}
.cb-kart{display:flex;align-items:center;gap:12px}
.cb-kart .amb{width:48px;height:48px;border-radius:10px}
.tablo{width:100%;border-collapse:collapse;font-size:13.5px}
.tablo td,.tablo th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.tablo th{color:var(--mut);font-weight:600;font-size:12.5px}
.tablo td.s,.tablo th.s{text-align:right;font-variant-numeric:tabular-nums}

/* ---- Sohbet ---- */
.sohbet{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.akis{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px}
.balon-satir{display:flex;gap:8px;align-items:flex-end;max-width:88%}

.yazbar{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(var(--safeB) + 2px);border-top:1px solid var(--line);background:var(--bg2)}

.yazbar button{width:42px;height:42px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}

details.vekil-bakanlik{border-top:1px solid var(--line);padding:8px 0}

.kanal .kik{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:21px;flex:none}
.yayin{border-left:4px solid var(--ink);padding:12px 12px 10px;background:var(--panel);border-radius:4px 12px 12px 4px;margin-bottom:10px}
.yayin.yeni{background:linear-gradient(90deg,var(--inkbg),var(--panel) 60%)}
.yayin .ust2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.yayin .unv{font-size:12.5px;color:var(--ink2);font-weight:700}
.yayin p{margin-top:6px;font-size:15px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.kisisel{display:flex;gap:10px;padding:11px 12px;background:var(--panel);border-radius:10px;margin-bottom:8px;font-size:14px}
.kisisel.yeni{box-shadow:inset 3px 0 0 var(--al)}
textarea.alanmetin{width:100%;min-height:120px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);outline:none;font:inherit;font-size:16px;color:var(--txt);resize:vertical}
.secenek{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--panel2);margin-top:8px;border:2px solid transparent;cursor:pointer}
.secenek.secili{border-color:var(--ink2)}
.secenek.pasif{opacity:.45;pointer-events:none}

/* ---- Devlet göstergeleri, kanunlar ---- */
.gosterge{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.gosterge>div{background:var(--panel);padding:10px 10px 9px;display:flex;flex-direction:column}
.gosterge .ad{min-height:2.5em;line-height:1.25;font-size:12px;color:var(--mut);font-weight:600}
.gosterge .deger{font-family:var(--disp);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.05}
.gosterge .fark{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.iyi{color:var(--good)}.kotu{color:var(--al2)}
.durum{display:inline-flex;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:800;white-space:nowrap}
.d-gorusmede{background:rgba(90,160,255,.15);color:#8CC2FF}.d-oylamada{background:var(--albg);color:var(--al2)}
.d-cb_onayinda,.d-israr{background:var(--inkbg);color:var(--ink2)}.d-yururlukte{background:rgba(52,201,138,.14);color:var(--good)}
.d-ret,.d-dustu,.d-kaduk,.d-geri_cekildi{background:var(--panel2);color:var(--mut)}
.oybtn{display:flex;gap:8px;margin-top:10px}.oybtn button{flex:1;padding:12px 6px;border-radius:10px;font-weight:800;background:var(--panel2);border:2px solid transparent}
.oybtn button.sec-kabul{border-color:var(--good);color:var(--good)}.oybtn button.sec-ret{border-color:var(--al);color:var(--al2)}.oybtn button.sec-cekimser{border-color:var(--mut)}
.zaman-cizgi{display:flex;gap:4px;margin-top:10px}.zaman-cizgi div{flex:1;height:5px;border-radius:2px;background:var(--panel3)}.zaman-cizgi div.ok{background:var(--good)}.zaman-cizgi div.simdi{background:var(--ink2)}
.gazete-bas{text-align:center;font-family:Georgia,'Times New Roman',serif;border-bottom:3px double var(--line2);padding-bottom:10px;margin-bottom:12px}
.gazete-bas h2{font-size:27px;font-weight:700;letter-spacing:.3px;color:var(--txt);text-transform:none;margin:0;font-family:Georgia,'Times New Roman',serif}
.gazete-kayit{padding:12px 0;border-bottom:1px solid var(--line)}
.gazete-kayit .gb{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:700;margin-top:4px}
.gazete-kayit p{font-size:14px;color:var(--txt2);margin-top:4px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.payinput{display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:center;padding:4px 0}
.payinput input{padding:9px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);font-size:16px;text-align:right;width:100%}
.vaat{font-size:13px;color:var(--txt2);font-style:italic;margin-top:3px;white-space:normal}
.rozetler{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.anahtar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.anahtar:last-child{border-bottom:0}
.anahtar input{width:46px;height:28px;appearance:none;-webkit-appearance:none;background:var(--panel3);border-radius:14px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.anahtar input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.anahtar input:checked{background:var(--ink)}.anahtar input:checked::after{left:21px}
.para{font-family:var(--disp);font-size:40px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums;line-height:1}
.eylemler{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.eylem{background:var(--panel);border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .08s}
.eylem:active{transform:scale(.96)}
.eylem b{font-size:14.5px}
.eylem .kucuk{line-height:1.3}
.eylem:disabled{opacity:.4}
.cip{display:inline-flex;padding:3px 7px;border-radius:5px;font-size:12px;font-weight:700;background:rgba(52,201,138,.13);color:var(--good);margin:3px 4px 0 0;white-space:nowrap}
.cip.notr{background:var(--panel3);color:var(--txt2)}
details.acilir summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--txt2);margin-top:10px}
details.acilir ul{margin:6px 0 0 18px;font-size:13px;color:var(--mut)}
.taahhut{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:12px;font-weight:700;background:var(--inkbg);color:var(--ink2);margin:3px 4px 0 0}
.taahhut.ok{background:rgba(52,201,138,.14);color:var(--good)}.taahhut.yok{background:var(--panel2);color:var(--mut)}
.hareket{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hareket:last-child{border-bottom:0}.hareket .t{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- Gündem: kayan haber şeridi, takvim şeridi, bugün listesi ---- */
.serit{display:flex;align-items:center;gap:10px;margin:-14px -16px 14px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
.serit .etiket{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--al2)}
.serit .etiket::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--al);animation:nabiz 1.6s ease-in-out infinite}
.serit .kaydir{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 92%,transparent)}
.serit .kaydir span{display:inline-block;padding-left:100%;animation:kay var(--sure,60s) linear infinite;font-size:13px;color:var(--txt2)}
.serit .kaydir span i{font-style:normal;color:var(--faint);margin:0 14px}
@keyframes kay{to{transform:translateX(-100%)}}
.sahne{padding:2px 2px 4px;margin-bottom:6px}
.sahne .ne{font-size:13.5px;color:var(--mut)}
.sahne .olay-adi{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1.02;margin-top:2px}
.sahne .geri-sayim{font-family:var(--disp);font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-top:6px;letter-spacing:.5px}
.ay-serit{position:relative;margin:16px 0 4px}
.ay-serit .gunler{display:grid;grid-template-columns:repeat(var(--gun,30),1fr);gap:2px;height:22px}
.ay-serit .gunler i{border-radius:2px;background:var(--panel)}
.ay-serit .gunler i.bel{background:#2E7D64}.ay-serit .gunler i.kur{background:#8A6A1F}.ay-serit .gunler i.gen{background:#5D47D6}
.ay-serit .gunler i.sec{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.ay-serit .gunler i.gecti{opacity:.35}
.ay-serit .imlec{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;border-radius:1px}
.ay-serit .imlec::after{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:#fff}
.ay-lejant{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.ay-lejant span{display:inline-flex;align-items:center;gap:5px}.ay-lejant i{width:10px;height:10px;border-radius:2px;display:inline-block}
.meclis-serit{display:flex;height:10px;border-radius:2px;overflow:hidden;margin:12px 0 4px;gap:1px}
.meclis-serit i{display:block;height:100%}
.yapilacak{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.yapilacak:last-child{border-bottom:0}
.yapilacak .yik{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--panel2);color:var(--txt2)}
.yapilacak .yik svg{width:20px;height:20px}
.yapilacak.acil .yik{background:var(--al);color:#fff}
.yapilacak.eylem-mor .yik{background:var(--ink);color:#fff}
.yapilacak .orta{flex:1;min-width:0}
.yapilacak .orta b{display:block;font-size:15.5px}
.yapilacak .ok{color:var(--faint);font-size:20px}
.adimlar{display:flex;gap:4px;margin:10px 0 4px}
.adimlar i{flex:1;height:5px;border-radius:2px;background:var(--panel3)}
.adimlar i.tamam{background:var(--good)}
.adim{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14.5px}
.adim .kutu{width:22px;height:22px;border-radius:6px;border:2px solid var(--panel3);flex:none;display:grid;place-items:center}
.adim.tamam{color:var(--mut)}.adim.tamam .kutu{background:var(--good);border-color:var(--good)}
.adim.tamam .kutu::after{content:"";width:10px;height:5px;border:2.5px solid #0E1530;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.adim.tamam span{text-decoration:line-through;text-decoration-color:var(--faint)}
.adim button{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink2)}
.miting{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.miting:last-child{border-bottom:0}
.miting .zaman{width:54px;flex:none;text-align:center}
.miting .zaman b{display:block;font-family:var(--disp);font-size:21px;line-height:1}
.miting .zaman span{font-size:11.5px;color:var(--mut)}
.miting.canli .zaman b{color:var(--al2)}
.giris-satir{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.giris-satir:last-child{border-bottom:0}
.giris-satir .yik{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--ink2)}
.giris-satir .yik svg{width:19px;height:19px}
.giris-satir .orta{flex:1;min-width:0}.giris-satir .orta b{display:block}
.giris-satir .ok{color:var(--faint);font-size:20px}

/* ---- Portre ---- */
.portre{display:block;border-radius:50%;overflow:hidden;flex:none}
.portre-buyuk{width:84px;height:84px}
.portre-secici{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.portre-secici button{aspect-ratio:1;border-radius:8px;background:var(--bg);border:2px solid transparent;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut)}
.portre-secici button.secili{border-color:var(--ink2);color:var(--txt)}
.portre-secici button span{width:70%;height:70%;border-radius:50%;display:block}

/* ---- Parti pusulası ---- */
.pusula-alan{position:relative;aspect-ratio:1;max-width:340px;margin:6px auto 0;background:var(--bg);border-radius:10px;overflow:hidden}
.pusula-alan svg{display:block;width:100%;height:100%}
.test-soru{padding:12px 0;border-bottom:1px solid var(--line)}
.test-soru p{font-size:15px;margin-bottom:8px}
.test-olcek{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.test-olcek button{padding:9px 0;border-radius:8px;background:var(--bg);font-size:12px;font-weight:700;color:var(--mut)}
.test-olcek button.secili{background:var(--ink);color:#fff}

/* ---- Basın ve otomatik gazete ---- */
.basin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.basin-grid .kart{margin:0}.basin-manset{text-align:center;border-top:3px solid var(--txt);border-bottom:3px double var(--line2)}
.kart.basin-manset h1,.kart.basin-gazete h2,.kart.basin-yazi h2{font-family:Georgia,'Times New Roman',serif;overflow-wrap:anywhere;line-height:1.2;text-transform:none;letter-spacing:normal;color:var(--txt)}
.kart.basin-manset h1{font-size:clamp(28px,7vw,42px);margin:12px 0}.kart.basin-yazi h2{font-size:27px;margin:12px 0}.kart.basin-gazete h2{font-size:25px;margin:14px 0}
.basin-metin{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;margin:18px 0;font-size:16px;color:var(--txt);opacity:1;-webkit-text-fill-color:var(--txt)}
.kart.basin-yazi{background:var(--panel);color:var(--txt);opacity:1}
#gazYayinlar .basin-metin{background:var(--bg);padding:14px;border-radius:8px;user-select:text;-webkit-user-select:text}
#basinForm #gazMetin{display:block;box-sizing:border-box;width:100%;min-height:260px;padding:14px;font-family:inherit;font-size:16px;line-height:1.6;color:var(--txt)!important;-webkit-text-fill-color:var(--txt);
  caret-color:#fff;background:var(--bg)!important;border:1px solid var(--line2);border-radius:10px;outline:none;opacity:1;resize:vertical;user-select:text;-webkit-user-select:text}
#basinForm #gazMetin:focus{border-color:var(--ink2);box-shadow:0 0 0 2px var(--inkbg)}
#gazSayac{font-variant-numeric:tabular-nums;font-weight:700;color:var(--txt2);display:block;margin-top:6px;text-align:right}
.basin-son,.basin-yazar{border-top:1px solid var(--line2);margin-top:14px;padding-top:14px;overflow-wrap:anywhere}
.basin-propaganda,.basin-kilit{padding:12px;background:var(--bg);border-left:3px solid var(--ink2);margin:12px 0;line-height:1.6;border-radius:0 8px 8px 0}
#basinListe,#gazYonetim,#gazYayinlar{overflow-wrap:anywhere}#basinForm textarea{width:100%;resize:vertical}#gazHedefAlan[hidden]{display:none}
.tg-kapak{background:var(--paper);color:var(--paperInk);padding:22px 18px 18px;border-radius:6px;text-align:center;margin-bottom:12px}
.tg-kapak h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(34px,9.5vw,50px);letter-spacing:-.5px;line-height:1.02;font-weight:700;margin:8px 0;color:var(--paperInk);word-break:normal;border-top:3px solid var(--paperInk);border-bottom:3px double var(--paperInk);padding:10px 0}
.tg-kapak h1 span{color:var(--al)}.tg-saat{font-size:12px;font-weight:700;color:#5b6486}
.tg-slogan{font-size:14px;color:#5b6486;font-family:Georgia,serif;font-style:italic}
.tg-baslik-alt{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;border-top:1px solid var(--paperLine);margin-top:12px;padding-top:8px;font-size:12px;color:#5b6486}
.tg-tanitim{background:var(--panel);border-radius:10px;padding:14px;margin:10px 0}
.tg-tanitim span{font-size:13px;font-weight:800;color:var(--ink2)}
.tg-tanitim p{font-size:13px;line-height:1.65;color:var(--txt2);margin:8px 0 0}
.tg-secimler{display:flex;gap:8px;overflow-x:auto;padding:10px 0 15px;scrollbar-width:thin}
.tg-filtre{flex:none;background:var(--panel);color:var(--txt2);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700}
.tg-filtre.secili{color:#fff;background:var(--ink)}
.tg-manset{position:relative;border-radius:var(--r);padding:20px 17px;background:var(--panel);margin-bottom:16px;color:var(--txt);cursor:pointer;border-top:4px solid var(--al)}
.tg-ust{display:inline-block;background:var(--al);color:#fff;border-radius:4px;padding:4px 8px;font-size:12px;font-weight:800;margin-bottom:10px}
.tg-kategori,.tg-gorev{font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:6px;display:block}
.tg-manset h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(24px,6.8vw,32px);line-height:1.16;font-weight:700;margin:6px 0 12px;color:#fff}
.tg-manset p{color:var(--txt2);line-height:1.6;font-size:14.5px;margin:0 0 14px}
.tg-meta{font-size:12px;color:var(--faint);line-height:1.5}
.tg-bolum-bas{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--txt)}
.tg-bolum-bas h2{font-family:var(--disp);font-size:22px;margin:0}
.tg-bolum-bas span{font-size:12px;color:var(--mut)}
.tg-liste{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:1px;background:var(--line)}
.tg-haber{padding:16px 2px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.tg-haber h3{font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.28;margin:4px 0;color:var(--txt)}
.tg-haber p{font-size:13.5px;line-height:1.55;color:var(--txt2);margin:0 0 5px;flex:1}
.tg-oku{border:0;background:none;color:var(--ink2);text-align:left;padding:8px 0 0;font-weight:800;font-size:13.5px;cursor:pointer}
.tg-detay{background:var(--panel);border-radius:var(--r);padding:20px 16px;margin:10px 0;color:var(--txt)}
.tg-detay h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(26px,7vw,34px);line-height:1.18;font-weight:700;margin:10px 0}
.tg-ozet{font-size:16px;font-weight:600;line-height:1.55;margin:18px 0;padding:12px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.tg-tam{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.8;color:var(--txt);-webkit-text-fill-color:var(--txt);opacity:1}
.tg-dipnot{font-size:12px;line-height:1.6;color:var(--mut);margin-top:22px;padding-top:14px;border-top:1px solid var(--line2)}
.tg-kart-kisa{border-top:4px solid var(--al)!important}
.tg-kart-kisa h2{color:var(--txt)}

<script>
"use strict";

const HATA_CEVIRI = [
  [/invalid login credentials/i, "E-posta veya şifre hatalı."],
  [/user already registered/i, "Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene."],
  [/email not confirmed/i, "E-posta adresin henüz doğrulanmadı."],
  [/token has expired or is invalid/i, "Kod hatalı ya da süresi dolmuş."],
  [/password should be at least/i, "Şifre en az 8 karakter olmalı."],
  [/unable to validate email|invalid email/i, "Geçerli bir e-posta adresi gir."],
  [/rate limit|too many|security purposes/i, "Çok sık deneme yapıldı. Biraz bekleyip tekrar dene."],
  [/failed to fetch|network|load failed/i, "İnternet bağlantısı kurulamadı."],
  [/JWT expired/i, "Oturumun süresi doldu, tekrar giriş yap."]
];
function hataCevir(m){
  m = String(m || "Bilinmeyen hata");
  for (const [re, tr] of HATA_CEVIRI) if (re.test(m)) return tr;
  return m;
}
function gercekApi(){
  if (!window.supabase) return null;
  const sb = window.supabase.createClient(AYAR.SUPABASE_URL, AYAR.SUPABASE_ANON, { auth: { persistSession: true, autoRefreshToken: true } });
  const k = async (pr) => { const { data, error } = await pr; if (error) throw new Error(hataCevir(error.message)); return data; };
  return {
    rpc: (fn, args) => k(sb.rpc(fn, args || {})),
    async oturum(){ const { data } = await sb.auth.getSession(); return data.session ? { email: data.session.user.email } : null; },
    async kayit(email, sifre){ const d = await k(sb.auth.signUp({ email, password: sifre })); return { onayGerekli: !d.session }; },
    async kodDogrula(email, kod, tur){ await k(sb.auth.verifyOtp({ email, token: kod, type: tur })); },
    async kodTekrar(email){ await k(sb.auth.resend({ type: "signup", email })); },
    async giris(email, sifre){ await k(sb.auth.signInWithPassword({ email, password: sifre })); },
    async sifreSifirla(email){ await k(sb.auth.resetPasswordForEmail(email)); },
    async sifreGuncelle(sifre){ await k(sb.auth.updateUser({ password: sifre })); },
    async cikis(){ await sb.auth.signOut(); }
  };
}

function trParca(ts){
  const d = new Date(ts);
  const p = Object.fromEntries(new Intl.DateTimeFormat("tr-TR", { timeZone: TZ, year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23" })
    .formatToParts(d).map(x => [x.type, x.value]));
  return { g: +p.day, a: +p.month, y: +p.year, s: p.hour, d: p.minute, hg: p.weekday };
}
const tarih = (ts) => { const p = trParca(ts); return `${p.g} ${AYLAR[p.a - 1]}`; };

function kalan(ms){
  if (ms <= 0) return "şimdi";
  const s = Math.floor(ms / 1000), g = Math.floor(s / 86400), sa = Math.floor(s % 86400 / 3600), dk = Math.floor(s % 3600 / 60), sn = s % 60;
  const iki = (n) => String(n).padStart(2, "0");
  return g > 0 ? `${g} gün ${iki(sa)}:${iki(dk)}:${iki(sn)}` : `${iki(sa)}:${iki(dk)}:${iki(sn)}`;
}

function toast(m, hata){
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast" + (hata ? " hata" : ""); t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), hata ? 4200 : 2600);
}
async function islem(fn, basari){
  try { const r = await fn(); if (basari) toast(basari); return r; }

}

    <p class="giris">E-posta adresini yaz, sana şifre yenileme kodu gönderelim.</p>
    <div class="alan"><label>E-posta</label><input id="eposta" type="email" inputmode="email"></div>
    <div class="hata-metin" id="hata"></div>
    <button class="btn" id="gonder">Kod gönder</button><button class="btn ikinci" onclick="girisEkrani()">Geri</button></div>`;
  $("#gonder").onclick = async () => {
    const em = $("#eposta").value.trim();

async function profilOlusturEkrani(){
  let harita = [];
  try { harita = await API.rpc("harita"); } catch (_) {}
  const hm = Object.fromEntries(harita.map(x => [x.id, x]));
  const mvOf = i => (hm[i.id] && +hm[i.id].mv) || i.mv;   // bu dönemin sandalye sayısı (Meclis oyuncu sayısına göre ölçeklenir)
  const oranBul = i => hm[i.id] && Number.isFinite(+hm[i.id].oyuncu) ? +hm[i.id].oyuncu / mvOf(i) : Infinity;
  const firsat = i => oranBul(i) === Infinity ? "Veri alınamadı" : oranBul(i) < 1 ? "Yüksek fırsat" : oranBul(i) < 4 ? "Dengeli" : "Yüksek rekabet";
  const iller = [...VERI.iller].sort((a, b) => oranBul(a) - oranBul(b) || a.ad.localeCompare(b.ad, "tr"));
  $("#app").innerHTML = `<div class="karsila" style="justify-content:flex-start">
    <h1 style="font-size:26px">Siyasete ilk adım</h1>
    <p class="giris">Oyundaki adını ve siyaset yapacağın ili seç. İlini sonradan değiştirebilirsin (30 günde bir, seçim dönemleri dışında).</p>
    <div class="alan"><label>Kullanıcı adı (3-20 karakter, değiştirilemez)</label><input id="kad" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="alan"><label>İlin</label><select id="il"><option value="">İl seç…</option>${iller.map(i => {
      const h = hm[i.id];
      return `<option value="${i.id}">${e(i.ad)} — ${mvOf(i)} MV · ${h ? e(h.oyuncu) : "?"} oyuncu · ${firsat(i)}</option>`;
    }).join("")}</select></div>
    <p class="kucuk">Fırsat illeri önce gösterilir. MV başına 1'den az oyuncu: yüksek fırsat; 1–4 arası: dengeli; 4 ve üzeri: yüksek rekabet. Bu oran seçilme garantisi değildir.</p>
    <div class="kart" id="ilbilgi" style="margin-top:12px;display:none" aria-live="polite"></div>
    <div class="hata-metin" id="hata"></div>
    <button class="btn" id="tamam">Oyuna başla</button>
    <button class="btn ikinci" onclick="cikisYap()">Çıkış</button></div>`;
  $("#il").onchange = () => {
    const id = +$("#il").value, kutu = $("#ilbilgi");
    if (!id) { kutu.style.display = "none"; return; }
    const i = VERI.iller.find(x => x.id === id), h = hm[id];
    const oran = oranBul(i);
    kutu.style.display = "block";
    kutu.innerHTML = `<b>${e(i.ad)}</b><div class="alt">${mvOf(i)} milletvekili · ${h ? e(h.oyuncu) + " oyuncu · " + fmt(oran, 2) + " oyuncu / MV" : "Oyuncu sayısı alınamadı; daha sonra tekrar deneyebilirsin."}</div>
      <div style="margin-top:8px"><span class="rozet ${!h ? "" : oran < 1 ? "yesil" : oran < 4 ? "sari" : "kirmizi"}">${firsat(i)}</span></div>`;
  };
  $("#tamam").onclick = async () => {
    const kad = $("#kad").value.trim(), il = +$("#il").value, h = $("#hata"); h.textContent = "";
    if (!il) return h.textContent = "Bir il seç.";
    $("#tamam").disabled = true;
    try { await oturumKaydet(); await API.rpc("profil_olustur", { p_kad: kad, p_il: il }); await basla(); }
    catch (err) { h.textContent = hataCevir(err.message); const b = $("#tamam"); if (b) b.disabled = false; }
  };
}

function siradakiAn(s){
  const t = simdi();
  const anlar = [["basvuru_bas","Başvuru açılıyor"],["basvuru_bit","Başvuru kapanıyor"],["oy_bas","Sandık açılıyor"],["oy_bit","Sandık kapanıyor"],["sonuc_at","Sonuçlar açıklanıyor"],["goreve_bas","Göreve başlama"]];
  for (const [k, ad] of anlar) if (s[k] && new Date(s[k]).getTime() > t) return { ad, an: new Date(s[k]).getTime() };
  return null;
}
function secimTakvimAdi(s){
  const tur = TUR[s.tur] || { ad: s.tur };
  const hedef = s.hedef_il_ad ? " · " + e(s.hedef_il_ad)
    : s.hedef_parti ? " · " + e(s.hedef_parti.kisa || s.hedef_parti.ad || "") : "";
  return (s.ara ? '<span class="rozet kirmizi" style="margin-right:5px">Olağanüstü</span>' : "") + e(tur.ad) + hedef;
}
function olayKarti(s){
  const p = D.durum.profil, tur = TUR[s.tur];
  const sa = siradakiAn(s);
  let cls = "", etiket = "", aksiyon = "";
  if (s.asama === "basvuru" && tur.aday) {
    cls = "basvuru"; etiket = `<span class="rozet altin">Başvuru açık</span>`;
    const partiIci = !p.parti ? "Parti içi adaylık için parti üyeliği gerekir. Bağımsız aday olabilirsin." : null;
    if (s.bagimsiz_adayim) {
      aksiyon = `<span class="rozet yesil">✓ Bağımsız adaylığın alındı</span><button class="btn ikinci" onclick="bagimsizAdayCek(${s.id})">Bağımsız adaylıktan çekil</button>`;
    } else {
    aksiyon = s.adayim
      ? `<div class="satir"><span class="rozet yesil" style="margin-top:12px">✓ Başvurun alındı</span></div><button class="btn altin" onclick="ekranAc(bildirimEkrani)">${IKON.megafon} Propaganda yap</button><button class="btn ikinci" onclick="vaatModal(${s.id})">Seçim bildirgeni yaz</button><button class="btn ikinci" onclick="adaylikCek(${s.id})">Başvuruyu geri çek</button>`
      : partiIci ? `<p class="alt" style="margin-top:10px">${partiIci}</p>${['mv_on','bel_on','cb_on'].includes(s.tur) ? `<button class="btn altin" onclick="bagimsizAdayOl(${s.id},'${s.tur}',${s.bagimsiz_ucret || 0})">${{mv_on:'Bağımsız milletvekili adayı ol',bel_on:'Bağımsız belediye başkanı adayı ol',cb_on:'Bağımsız Cumhurbaşkanı adayı ol'}[s.tur]}</button>` : ''}` : `<button class="btn altin" onclick="adayOl('${s.tur}')">${tur.aday}</button>`;
    }
  } else if (s.asama === "basvuru" && s.tur === "cb") {
    return "";  // GB'nin kararı ayrı kartta
  } else if (s.asama === "oy") {
    cls = "oy"; etiket = `<span class="rozet kirmizi">Sandık açık</span>`;
    aksiyon = (s.adayim ? `<button class="btn ikinci" onclick="vaatModal(${s.id})">Seçim bildirgeni düzenle</button>` : "") + (s.oy_verdim ? `<span class="rozet yesil" style="margin-top:12px">✓ Oyunu kullandın</span>`
      : s.oy_engeli ? `<p class="alt" style="margin-top:10px">${e(s.oy_engeli)}</p>`
      : `<button class="btn" onclick="ekranAc(()=>secimEkrani(${s.id}))">${IKON.sandik.replace("<svg", '<svg width="20" height="20"')} Oy ver</button>`);
  } else if (s.asama === "sayim") {
    etiket = `<span class="rozet">Sayım sürüyor</span>`;
  } else if (s.asama === "bitti") {
    etiket = `<span class="rozet">Sonuçlandı</span>`;
    aksiyon = `<button class="btn ikinci" onclick="ekranAc(()=>secimEkrani(${s.id}))">Sonuçları gör</button>`;
  } else return "";
  return `<div class="olay ${cls}"><div class="baslik"><b>${secimTakvimAdi(s)}</b>${etiket}</div>
    ${sa ? `<div class="alt" style="margin-top:6px">${sa.ad}: ${tarihSaat(sa.an)}</div><div class="sayac" data-an="${sa.an}">${kalan(sa.an - simdi())}</div>` : ""}
    ${s.katilim != null ? `<div class="kucuk" style="margin-top:4px">${s.katilim} oy kullanıldı</div>` : ""}
    ${aksiyon}</div>`;
}
function cbKararKarti(){
  const k = D.durum.cb_karar;
  if (!k || !k.acik) return "";
  const yaz = { kendisi: "Kendin adaysın", baskasi: `Aday: ${e(k.aday || "")}`, onsecim: "Üyeler ön seçimle belirleyecek", destek: `${e(k.destek || "")} adayını destekliyorsun` };
  return `<div class="olay basvuru"><div class="baslik"><b>Cumhurbaşkanı adayı kararı</b><span class="rozet altin">Genel başkan</span></div>
    <p class="alt" style="margin-top:6px">Partinin cumhurbaşkanı adayını belirle. Son karar: ${tarihSaat(new Date(k.son).getTime() - 60000)}. Karar vermezsen aday, üyelerin ön seçimiyle belirlenir.</p>
    <div class="sayac" data-an="${new Date(k.son).getTime()}">${kalan(new Date(k.son).getTime() - simdi())}</div>
    ${k.yontem ? `<div style="margin-top:8px"><span class="rozet yesil">✓ ${yaz[k.yontem]}</span></div>` : ""}
    <button class="btn altin" onclick="cbKararModal()">${k.yontem ? "Kararı değiştir" : "Karar ver"}</button></div>`;
}
async function gundemEkrani(){
  if (!D.durum) yukleniyor("Gündem");
  let DUR; try { DUR = await durumYenile(); } catch (err) { iskelet("Gündem", `<div class="bos">${e(hataCevir(err.message))}</div>`); return; }
  const pp = DUR.profil, mvMi = pp.makamlar.some(x => x.tur === "mv"), cbMi = pp.makamlar.some(x => x.tur === "cb");
  // Bütün veriler paralel yüklenir; biri hata verirse ekranın geri kalanı yine çizilir
  const iste = (fn, args, varsay) => API.rpc(fn, args).catch(() => varsay);
  const [ihaleR, haber, reflerR, kanunlar, dv, itt, ia, mitingler, haklar, meclis] = await Promise.all([
    iste("ihaleler", undefined, { acik: [] }), iste("haberler", { p_limit: 15 }, []), iste("referandumlar", { p_limit: 5 }, []),
    mvMi || cbMi ? iste("kanunlar", { p_limit: 40 }, []) : [], mvMi ? iste("meclis_baskanlik", undefined, null) : null,
    pp.gb && pp.parti ? iste("ittifak_bilgi", { p_parti: pp.parti.id }, null) : null,
    iste("ilk_adimlar", undefined, null), iste("mitingler", undefined, []), iste("miting_haklarim", undefined, []),
    D._meclisOn && simdi() - D._meclisOn.t < 300e3 ? D._meclisOn.v : iste("meclis", undefined, null)]);
  if (meclis && !(D._meclisOn && D._meclisOn.v === meclis)) D._meclisOn = { t: simdi(), v: meclis };
  if (D.durum !== DUR && !D.durum) return;      // bu arada çıkış yapıldıysa çizme
  const ihaleler = (ihaleR || {}).acik || [];
  const refler = (reflerR || []).filter(r => r.durum !== "sonuclandi" || simdi() - new Date(r.oy_bit).getTime() < 36 * 3600e3);
  const meclisBekleyen = dv ? dv.secimler.filter(s => s.katilabilir && ((s.durum === "aday" && !s.adaylar.some(a => a.benim)) || (s.durum === "oylama" && s.oylarim.length === 0))) : [];
  const davetler = (itt && itt.gelen_davetler) || [];
  const oylanacak = kanunlar.filter(k => (k.durum === "oylamada" && new Date(k.oy_bas).getTime() <= simdi() || k.durum === "israr") && !k.oy_verdim && mvMi);
  const onaylanacak = kanunlar.filter(k => k.durum === "cb_onayinda" && pp.cb_mi);
  const d = DUR, p = d.profil, cz = p.cuzdan || {};
  const aktif = d.takvim.filter(s => ["basvuru","oy","sayim"].includes(s.asama) || (s.asama === "bitti" && simdi() - new Date(s.sonuc_at).getTime() < 36 * 3600e3));
  const gelecek = d.takvim.filter(s => s.asama === "yakinda");
  const t = simdi();
  const canliMiting = (mitingler || []).find(m => m.benim_ilim && !m.katildim && !m.benim && new Date(m.bas).getTime() <= t && new Date(m.bit).getTime() > t);
  const mitingHakki = (haklar || []).find(h => !h.duzenledi);

  // ---- Bugün yapılacaklar: en acil olan en üstte
  const is = [];
  aktif.filter(s => s.asama === "oy" && !s.oy_verdim && !s.oy_engeli).forEach(s => is.push({ cls: "acil", ikon: IKON.sandik, bas: `Oy ver: ${secimTakvimAdi(s)}`, alt: `Sandık ${saatYaz(s.oy_bit)}'de kapanıyor`, git: `ekranAc(()=>secimEkrani(${s.id}))` }));
  if (p.kredi_uyari) is.push({ cls: "acil", ikon: IKON.uyari, bas: "Kredi borcun gecikmede", alt: e(p.kredi_uyari), git: "ekranAc(bankaEkrani)" });
  if (canliMiting) is.push({ cls: "acil", ikon: IKON.insanlar, bas: `Mitinge katıl: ${e(canliMiting.kad)}`, alt: `${e(canliMiting.il)} meydanı · ${canliMiting.katilim} kişi`, git: `mitingKatil(${canliMiting.id})` });
  if (oylanacak.length) is.push({ cls: "acil", ikon: IKON.meclis, bas: `Meclis'te ${oylanacak.length} teklif oyunu bekliyor`, alt: e(oylanacak[0].baslik), git: `ekranAc(()=>kanunEkrani(${oylanacak[0].id}))` });
  if (onaylanacak.length) is.push({ cls: "eylem-mor", ikon: IKON.kalem, bas: `Onayını bekleyen ${onaylanacak.length} kanun`, alt: e(onaylanacak[0].baslik), git: `ekranAc(()=>kanunEkrani(${onaylanacak[0].id}))` });
  if (cz.dolu || cz.gunun_ilki) is.push({ cls: "eylem-mor", ikon: IKON.kumbara, bas: cz.dolu ? "Kumbaran doldu" : "Bugünkü maaşını topla", alt: cz.birikmis ? tlYaz(cz.birikmis) + " birikti" + (cz.gunun_ilki ? " · seri ve günlük destekler" : "") : "Seri ve günlük destekler", git: "sekmeAc('hayat')" });
  if (mitingHakki) is.push({ cls: "eylem-mor", ikon: IKON.insanlar, bas: "Miting düzenle", alt: `${e(mitingHakki.il)} meydanı · ${tlYaz(mitingHakki.bedel)}`, git: `mitingDuzenleModal(${e(JSON.stringify(mitingHakki))})` });
  if (davetler.length) is.push({ ikon: IKON.parti, bas: "İttifak daveti", alt: davetler.map(x => e(x.ad)).join(", "), git: `ekranAc(()=>partiDetay(${pp.parti ? pp.parti.id : 0}))` });
  aktif.filter(s => s.asama === "basvuru" && TUR[s.tur].aday && !s.adayim && !s.bagimsiz_adayim).forEach(s => is.push({ ikon: IKON.kalem, bas: `Başvuru açık: ${secimTakvimAdi(s)}`, alt: `Kapanış ${tarihSaat(s.basvuru_bit)}`, git: `document.getElementById('sec${s.id}').scrollIntoView({behavior:'smooth'})` }));
  if (p.hesap_engeli) is.push({ ikon: IKON.uyari, bas: "Seçmen kartın henüz hazır değil", alt: e(p.hesap_engeli), git: "vatandaslikModal()" });
  if (!p.parti) is.push({ ikon: IKON.pusula, bas: "Sana yakın partiyi bul", alt: "Sekiz soruluk kısa test", git: "partiTestiModal()" });

  const cb = d.cb, ms = meclis && meclis.partiler ? meclis.partiler.filter(x => x.n > 0) : [];
  const govde = `
    ${seritHtml(haber)}
    ${sahneHtml(d.takvim)}
    <div class="bolum-bas"><h2>Bugün</h2><span class="kucuk">${is.length ? is.length + " iş" : ""}</span></div>
    <div class="kart">${is.length ? is.map(yapilacakSatir).join("") : `<div class="bos" style="padding:8px 0">Bugün acil bir işin yok. Sohbete uğra ya da gazeteleri oku.</div>`}</div>
    ${ilkAdimlarHtml(ia)}
    ${aktif.length || ihaleler.length || meclisBekleyen.length || refler.length || cbKararKarti() ? `<div class="bolum-bas"><h2>Seçimler ve oylamalar</h2></div>` : ""}
    ${cbKararKarti()}
    ${aktif.map(s => `<div id="sec${s.id}">${olayKarti(s)}</div>`).join("")}
    ${meclisBekleyen.map(meclisSecimKart).join("")}
    ${ihaleler.map(ihaleKart).join("")}
    ${refler.map(r => r.durum === "sonuclandi" ? `<div class="olay basvuru" onclick="ekranAc(()=>referandumEkrani(${r.id}))" style="cursor:pointer"><div class="baslik"><b>Halk oylaması sonuçlandı</b><span class="rozet ${r.sonuc === "kabul" ? "yesil" : ""}">${r.sonuc === "kabul" ? "Kabul" : "Ret"}</span></div><div style="margin-top:6px;font-weight:700">${e(r.baslik)}</div><div class="kucuk">%${fmt(r.evet * 100 / Math.max(1, r.evet + r.hayir), 1)} Evet · %${fmt(r.hayir * 100 / Math.max(1, r.evet + r.hayir), 1)} Hayır</div></div>` : refKart(r)).join("")}
    ${oylanacak.length ? `<div class="olay oy"><div class="baslik"><b>Meclis'te oyunu bekleyen ${oylanacak.length} teklif var</b><span class="rozet kirmizi">Vekil</span></div>
      ${oylanacak.map(k => `<div class="liste-satir" onclick="ekranAc(()=>kanunEkrani(${k.id}))" style="cursor:pointer"><div class="orta"><b>${e(k.baslik)}</b><div class="kucuk">${k.durum === "israr" ? "Israr oylaması" : "Oylama"} bitişi ${tarihSaat(k.durum === "israr" ? k.israr_bit : k.oy_bit)}</div></div><span>›</span></div>`).join("")}</div>` : ""}
    ${onaylanacak.length ? `<div class="olay basvuru"><div class="baslik"><b>Onayını bekleyen ${onaylanacak.length} kanun</b><span class="rozet altin">Cumhurbaşkanı</span></div>
      ${onaylanacak.map(k => `<div class="liste-satir" onclick="ekranAc(()=>kanunEkrani(${k.id}))" style="cursor:pointer"><div class="orta"><b>${e(k.baslik)}</b><div class="kucuk">Son: ${tarihSaat(k.cb_bit)}</div></div><span>›</span></div>`).join("")}</div>` : ""}
    ${pp.makamlar.some(x => x.tur === "bel") ? `<div class="olay basvuru"><div class="baslik"><b>${e((pp.makamlar.find(x => x.tur === "bel") || {}).il_ad || "")} Belediyesi</b><span class="rozet altin">Belediye başkanı</span></div>
      <p class="alt" style="margin-top:6px">Kent vergisini ve hemşehri desteğini belirle; kent lokantası, ücretsiz ulaşım, kira yardımı, istihdam ofisi aç. İlinde yaşayan oyuncuların cüzdanına doğrudan dokunursun.</p>
      <button class="btn altin" onclick="ekranAc(belediyeEkrani)">Belediyeme git</button></div>` : ""}
    ${mitingHtml(mitingler)}
    <div class="bolum-bas"><h2>Türkiye</h2></div>
    <div class="kart">
      ${cb ? `<div class="cb-kart" onclick="oyuncuKart('${e(cb.kad)}')" style="cursor:pointer">${portre(cb.kad, cb.parti && cb.parti.renk, 48)}<div><div class="kucuk">Cumhurbaşkanı</div><b style="font-family:var(--disp);font-size:22px;font-weight:700">${e(cb.kad)}</b><div class="alt">${partiRozet(cb.parti)}</div></div></div>`
        : `<div class="alt">Cumhurbaşkanlığı makamı boş.</div>`}
      ${ms.length ? `<div class="meclis-serit" aria-label="Meclis dağılımı">${ms.map(x => `<i style="flex:${x.n};background:${e(x.renk || "#8E97B5")}"></i>`).join("")}</div>
        <div class="kucuk">TBMM ${meclis.dolu} vekil · ${ms.map(x => `<span style="color:${e(x.renk || "#8E97B5")}">${e(x.kisa || "Bağımsız")}</span> ${x.n}`).join(" · ")}</div>` : ""}
      <div style="margin-top:6px">
        <button class="giris-satir" onclick="otomatikGazeteEkrani()"><span class="yik">${IKON.gazete}</span><span class="orta"><b>Türkiye Gündem</b><span class="kucuk">Oyundaki gelişmelerden otomatik gazete</span></span><span class="ok">›</span></button>
        <button class="giris-satir" onclick="ekranAc(basinEkrani)"><span class="yik">${IKON.kalem}</span><span class="orta"><b>Oyuncu gazeteleri</b><span class="kucuk">Haberler, köşe yazıları; kendi gazeteni kur</span></span><span class="ok">›</span></button>

        <button class="giris-satir" onclick="D.devletSekme='tarih';sekmeAc('devlet')"><span class="yik">${IKON.tarih}</span><span class="orta"><b>Cumhuriyet tarihi</b><span class="kucuk">Cumhurbaşkanları, Meclis dönemleri, rekorlar</span></span><span class="ok">›</span></button>
      </div></div>
    <div class="bolum-bas"><h2>Seçim takvimi</h2></div>
    <div class="kart">${gelecek.length ? gelecek.map(s => {

async function secimEkrani(sid){
  yukleniyor("Seçim");
  let s;
  try { s = await API.rpc("secim_detay", { p_secim: sid }); } catch (err) { iskelet("Seçim", `<div class="bos">${e(hataCevir(err.message))}</div>`, { geri: true }); return; }
  const tur = TUR[s.tur];
  let govde = `<div class="kart"><h3>${tur.ad}</h3><div class="alt">Oylama: ${tarih(s.oy_bas)}, ${saatYaz(s.oy_bas)}–${saatYaz(s.oy_bit)} · Sonuç: ${saatYaz(s.sonuc_at)}${s.goreve_bas ? ` · Göreve başlama: ${tarihSaat(s.goreve_bas)}` : ""}</div>
    ${s.katilim != null ? `<div class="kucuk" style="margin-top:4px">${s.katilim} oy kullanıldı</div>` : ""}</div>`;
  if (s.asama === "bitti") govde += sonucHtml(s);
  else if (s.asama === "oy") govde += pusulaHtml(s);
  else govde += `<div class="kart">${adayListesiHtml(s)}</div>`;
  iskelet(tur.kisa, govde, { geri: true });
  if (s.asama === "oy" && !s.oy_verdim && !s.oy_engeli) pusulaBagla(s);
}

      <div class="kucuk">Liste: ${x.liste.slice(0, 4).map(l => `${l.sira}. ${e(l.kad)}`).join(", ")}${x.liste.length > 4 ? ` +${x.liste.length - 4}` : ""}</div>${x.liste[0] && x.liste[0].vaat ? `<div class="vaat">“${e(x.liste[0].vaat)}” — ${e(x.liste[0].kad)}</div>` : ""}${x.beyanname && x.beyanname.vaatler.length ? `<div class="kucuk" style="margin-top:4px;color:var(--gold2);font-weight:700">Seçim beyannamesi</div>${vaatHtml(x.beyanname.vaatler)}` : ""}</div><div class="daire"></div></div>`;

let PARTI_ON = [];
const partiBul = (id) => PARTI_ON.find(p => p.id === id);

  return `<div class="kart duz"><p class="alt">${aciklama}</p>

function pusulaBagla(s){
  let secili = null;

function sonucHtml(s){

        ${sonucSatirlari(ulusal.map(p => ({ ad: p.ad || p.kisa, kisa: p.kisa, renk: p.renk, oy: p.oy, yuzde: +p.yuzde, sandalye: p.sandalye, not: p.gecti ? "" : "baraj altı" })), 0, { kazanan: true })}

      <details class="kart"><summary style="cursor:pointer;font-family:var(--disp);font-size:20px;font-weight:700">İl il sonuçlar</summary>${Object.entries(r.iller || {}).sort((a, b) => ilAd(+a[0]).localeCompare(ilAd(+b[0]), "tr")).map(([il, v]) =>

      ${sonucSatirlari(ad.map(a => ({ kad: a.kad, kisa: a.kisa, renk: a.renk, oy: a.oy })), r.toplam, { kazanan: !!r.kazanan, portre: true })}</section>`;

async function haritaEkrani(){

function haritaCiz(){
  const veri = Object.fromEntries(D.harita.map(x => [x.id, x]));
  const maxO = Math.max(1, ...D.harita.map(x => x.oyuncu));
  const gMin = Math.min(...D.harita.map(x => x.gelisim || 0)), gMax = Math.max(...D.harita.map(x => x.gelisim || 0));
  const renk = (id) => {
    const v = veri[id];
    if (D.haritaMod === "gelisim") return { f: "#32D74B", o: .12 + .86 * ((v.gelisim || 0) - gMin) / Math.max(1, gMax - gMin) };
    if (D.haritaMod === "belediye") return v.bel ? { f: v.bel.parti ? v.bel.parti.renk : "#888", o: .92 } : { f: "#2a2a33", o: 1 };
    if (D.haritaMod === "vekil") return v.vekil.length ? { f: v.vekil[0].renk, o: .35 + .6 * (v.vekil.reduce((t, x) => t + x.n, 0) / v.mv) } : { f: "#2a2a33", o: 1 };
    return v.oyuncu ? { f: "#FF453A", o: .15 + .85 * Math.sqrt(v.oyuncu / maxO) } : { f: "#2a2a33", o: 1 };
  };
  const H = VERI.harita;
  const svg = `<svg viewBox="0 0 ${H.w} ${H.h}" style="width:100%;height:auto;display:block"><g stroke="#0b0b0f" stroke-width="1.3">${Object.entries(H.il).map(([id, p]) => {
    const r = renk(+id); return `<path d="${p.d}" fill="${e(r.f)}" fill-opacity="${r.o.toFixed(2)}" onclick="ilDetay(${id})" style="cursor:pointer"></path>`;
  }).join("")}</g></svg>`;
  const partiler = {};
  D.harita.forEach(v => {
    if (D.haritaMod === "belediye" && v.bel && v.bel.parti) partiler[v.bel.parti.kisa] = v.bel.parti.renk;
    if (D.haritaMod === "vekil") v.vekil.forEach(x => partiler[x.kisa] = x.renk);
  });
  const lejant = D.haritaMod === "gelisim" ? `<span class="kucuk">Yeşil ne kadar koyuysa il o kadar gelişmiş (en düşük ${fmt(gMin, 0)}, en yüksek ${fmt(gMax, 0)}). Bakanlık yatırımları ve cumhurbaşkanlığı destekleri gelişmişliği artırır; yatırım almayan iller zamanla ortalamaya döner.</span>`
    : D.haritaMod === "oyuncu" ? `<span class="kucuk">Renk ne kadar koyuysa o ilde o kadar çok oyuncu var.</span>`
    : Object.entries(partiler).map(([k, r]) => `<span class="parti"><span class="nok" style="background:${e(r)}"></span>${e(k)}</span>`).join("") + `<span class="parti"><span class="nok" style="background:#2a2a33"></span>${D.haritaMod === "belediye" ? "Başkan yok" : "Vekil yok"}</span>`;
  const top = D.harita.reduce((t, x) => t + x.oyuncu, 0);
  const sirali = [...D.harita].sort((a, b) => D.haritaMod === "gelisim" ? (b.gelisim || 0) - (a.gelisim || 0) : b.oyuncu - a.oyuncu);
  iskelet("Türkiye", `
    <div class="segment">${[["belediye","Belediye"],["vekil","Vekil"],["gelisim","Gelişmişlik"],["oyuncu","Oyuncu"]].map(([k, a]) => `<button class="${D.haritaMod === k ? "aktif" : ""}" onclick="D.haritaMod='${k}';haritaCiz()">${a}</button>`).join("")}</div>
    <div class="kart harita" style="margin-top:12px;padding:10px">${svg}<div class="lejant">${lejant}</div></div>
    <div class="kart"><h2>İller (${top} oyuncu)</h2>${sirali.map(v => `<div class="liste-satir" onclick="ilDetay(${v.id})" style="cursor:pointer">
      <div class="orta"><b>${e(v.ad)}</b><div class="kucuk">${v.mv} vekil · ${v.oyuncu} oyuncu · gelişmişlik ${fmt(v.gelisim || 0, 0)}${v.bel ? ` · Başkan: ${e(v.bel.kad)}` : ""}</div></div>
      ${v.oyuncu < v.mv ? `<span class="rozet yesil">fırsat</span>` : ""}</div>`).join("")}</div>`);
}

function meclisSvg(dagilim, toplam){
  // Sandalye sayısı Meclis'in o dönemki büyüklüğüdür (oyuncu sayısına göre ölçeklenir)
  const N = Math.max(30, toplam || dagilim.reduce((a, d) => a + d.n, 0) || 600), sira = Math.max(4, Math.min(12, Math.round(Math.sqrt(N / 4)))), r0 = 0.36;
  const yari = []; let topR = 0;
  for (let i = 0; i < sira; i++) { const r = r0 + (1 - r0) * i / (sira - 1); yari.push(r); topR += r; }
  let adet = yari.map(r => Math.floor(N * r / topR)); let kalan = N - adet.reduce((a, b) => a + b, 0);
  for (let i = sira - 1; kalan > 0; i = (i - 1 + sira) % sira, kalan--) adet[i]++;
  const nok = [];
  yari.forEach((r, i) => { for (let j = 0; j < adet[i]; j++) { const a = Math.PI * (1 - j / (adet[i] - 1)); nok.push({ a, x: 100 + 92 * r * Math.cos(a), y: 98 - 92 * r * Math.sin(a) }); } });
  nok.sort((p, q) => q.a - p.a);
  const renkler = []; dagilim.forEach(d => { for (let i = 0; i < d.n; i++) renkler.push(d.renk); });
  const rr = Math.min(5.2, 2.35 * Math.sqrt(600 / N) * .82).toFixed(2);
  return `<svg viewBox="0 0 200 104" style="width:100%;display:block;margin-top:6px">${nok.map((p, i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rr}" fill="${e(renkler[i] || "#2A3460")}"/>`).join("")}</svg>`;
}

/* =========================================================
   ÇOKLU HESAP ÖNLEMİ: cihaz kimliği ve cihaz izi (sunucuda tuzlanıp özetlenir)
   ========================================================= */
async function ozetle(m){
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(m)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (_) { let h = 0; for (const c of m) h = (h * 31 + c.charCodeAt(0)) | 0; return "h" + h; }
}
async function cihazBilgisi(){
  let cihaz = null;
  try { const Dv = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Device; if (Dv && Dv.getId) { const r = await Dv.getId(); cihaz = r && (r.identifier || r.uuid); } } catch (_) {}
  if (!cihaz) { try { cihaz = localStorage.getItem("ssk_cihaz"); if (!cihaz) { cihaz = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now(); localStorage.setItem("ssk_cihaz", cihaz); } } catch (_) {} }
  let tuval = "";
  try { const c = document.createElement("canvas"); c.width = 220; c.height = 40; const x = c.getContext("2d"); x.textBaseline = "top"; x.font = "16px Arial";
    x.fillStyle = "#f60"; x.fillRect(10, 10, 100, 20); x.fillStyle = "#069"; x.fillText("Seçim Simülasyonu ğüşiöç", 2, 4); tuval = c.toDataURL(); } catch (_) {}
  const iz = await ozetle([navigator.userAgent, navigator.language, (navigator.languages || []).join(","), screen.width + "x" + screen.height, screen.colorDepth,
    window.devicePixelRatio, (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone, navigator.hardwareConcurrency, navigator.maxTouchPoints, navigator.platform, tuval].join("|"));
  return { cihaz: cihaz || iz, iz };
}

  if (!_oturumSoz) _oturumSoz = (async () => { try { const c = await cihazBilgisi(); await API.rpc("oturum_kaydet", { p_cihaz: c.cihaz, p_iz: c.iz }); } catch (_) { _oturumSoz = null; } })();

  const uyumlu = (a, b) => (a === b && (a === "gb" || a === "gby")) || [["mv","gby"],["gby","mv"],["gb","cb"],["cb","gb"],["gb","mv"],["mv","gb"]].some(c => c[0] === a && c[1] === b);

function akisaEkle(akis, liste, ozel, basa){
  if (!liste.length) return;
  const altta = akis.scrollHeight - akis.scrollTop - akis.clientHeight < 80;
  const html = liste.map(m => balonHtml(m, ozel)).join("");
  const bos = akis.querySelector(".bos, .yukleniyor"); if (bos) bos.remove();
  if (basa) { const h = akis.scrollHeight; akis.insertAdjacentHTML("afterbegin", html); akis.scrollTop += akis.scrollHeight - h; }
  else { akis.insertAdjacentHTML("beforeend", html); if (altta || liste.some(m => m.benim)) akis.scrollTop = akis.scrollHeight; }
  if (typeof portreleriTazele === "function") portreleriTazele(akis);
}

    <h4>Görev ihmali</h4>

    <h4>Para hediyesi</h4>

    <h4>Anayasa değişikliği ve halk oylaması</h4>
    <p>Yetki sırası: Anayasa › Kanun › Cumhurbaşkanlığı kararnamesi. Kanunla düzenlenen konuda kararname çıkarılamaz; anayasaya bağlanan kural ancak yeni bir anayasa değişikliğiyle değişir. Anayasa değişikliğini bir milletvekili teklif eder; 24 saatte vekillerin üçte biri imza vermelidir. Meclis gizli oyla oylar: beşte üç kabul çıkarsa değişiklik halk oylamasına gider; üçte iki çıkarsa cumhurbaşkanı yayımlar ya da halkoyuna sunar. Halk oylamasında oylamadan önce kayıtlı bütün oyuncular belirlenen gün 08:00–20:00 arası sandığa gider ve Evet ya da Hayır mührü basar; oy gizlidir, sonuç il il açıklanır. Geçerli oyların yarısından fazlası Evet ise değişiklik yürürlüğe girer.</p>
    <p>Bütçe kanunu gelir vergisinin alt ve üst sınırını (hükümet bu bant içinde ayarlar), belediyelerin vergi payını, partilere hazine yardımını ve bakanlıkların bütçe payını belirler. Asgari ücreti Meclis değil hükümet belirler.</p>

    <p>Paranı aday adaylığı başvuru ücretine (partinin kasasına gider, ücreti genel başkan belirler), başka ile taşınmaya, ek propaganda hakkına ve partine bağışa harcarsın. Oyunda günlük bağış limiti yoktur; oyuncular gerçek cüzdan bakiyeleri kadar başka oyunculara, partilere, kurumlara ve şehirlere bağış yapabilir.</p>

    <h4>Hakların</h4>

/* =====================================================================
   12a) PUSH BİLDİRİMLERİ (yalnızca telefonda; Capacitor + @capacitor-firebase/messaging)
   ===================================================================== */
const PUSH = {
  eklenti(){ const C = window.Capacitor; return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.FirebaseMessaging; },
  depo(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) { return null; } },
  async baslat(){
    const FM = this.eklenti(); if (!FM || !D.durum || !D.durum.profil) return;
    try {
      const izin = await FM.requestPermissions(); if (izin.receive !== "granted") return;
      const { token } = await FM.getToken();
      if (token) { await API.rpc("cihaz_kaydet", { p_token: token, p_platform: window.Capacitor.getPlatform() }); this.depo("push_token", token); }
      if (!this._dinle) {
        this._dinle = true;
        FM.addListener("notificationActionPerformed", ev => this.yonlendir(((ev || {}).notification || {}).data || {}));
        FM.addListener("notificationReceived", ev => { const n = (ev || {}).notification || {}; toast((n.title ? n.title + ": " : "") + (n.body || "")); API.rpc("rozetler").then(rozetGuncelle).catch(() => {}); });
        FM.addListener("tokenReceived", ev => { if (ev && ev.token) { this.depo("push_token", ev.token); API.rpc("cihaz_kaydet", { p_token: ev.token, p_platform: window.Capacitor.getPlatform() }).catch(() => {}); } });
      }
      await this.konulariGuncelle();
    } catch (err) { console.warn("push", err); }
  },
  istenenKonular(){
    const p = D.durum.profil, a = p.bildirim_ayar || {}, k = ["duyuru"];
    if (a.secim !== false) { k.push("s_tum", "s_il_" + p.il_id); if (p.parti) k.push("s_parti_" + p.parti.id); }
    if (a.propaganda !== false) { k.push("p_tum", "p_il_" + p.il_id); if (p.parti) k.push("p_parti_" + p.parti.id); }
    return k;
  },
  async konulariGuncelle(){
    const FM = this.eklenti(); if (!FM || !D.durum || !D.durum.profil) return;
    let eski = []; try { eski = JSON.parse(this.depo("push_konular") || "[]"); } catch (_) {}
    const yeni = this.istenenKonular();
    for (const t of eski.filter(x => !yeni.includes(x))) { try { await FM.unsubscribeFromTopic({ topic: t }); } catch (_) {} }
    for (const t of yeni.filter(x => !eski.includes(x))) { try { await FM.subscribeToTopic({ topic: t }); } catch (_) {} }
    this.depo("push_konular", JSON.stringify(yeni));
  },
  async cikis(){
    const FM = this.eklenti(); if (!FM) return;
    try {
      const t = this.depo("push_token"); if (t) await API.rpc("cihaz_sil", { p_token: t });
      for (const k of JSON.parse(this.depo("push_konular") || "[]")) { try { await FM.unsubscribeFromTopic({ topic: k }); } catch (_) {} }
      this.depo("push_konular", null);
    } catch (_) {}
  },
  yonlendir(v){
    if (!D.durum || !D.durum.profil) { D._bekleyenYon = v; return; }
    modalKapat(); D.yigin = [];
    if (v.ekran === "ozel" && v.kad) { D.sekme = "sohbet"; ekranAc(() => ozelEkrani(v.kad)); }
    else if (v.ekran === "secim" && v.id) { D.sekme = "gundem"; ekranAc(() => secimEkrani(+v.id)); }
    else if (v.ekran === "referandum" && v.id) { D.sekme = "gundem"; ekranAc(() => referandumEkrani(+v.id)); }
    else if (v.ekran === "bildirim") { D.sekme = "gundem"; ekranAc(bildirimEkrani); }
    else if (v.ekran === "hayat") sekmeAc("hayat");
    else sekmeAc("gundem");
  }
};

// Ödüllü reklam (@capacitor-community/admob). Ödül yalnızca reklam gerçekten izlenince verilir.
const REKLAM = {
  eklenti(){ const C = window.Capacitor; return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.AdMob; },
  async goster(){
    const A = this.eklenti();
    if (!A) throw new Error("Reklamlar yalnızca telefondaki uygulamada izlenebilir.");
    if (!this._hazir) { await A.initialize({ initializeForTesting: !!AYAR.ADMOB_TEST }); this._hazir = true; }
    const ios = window.Capacitor.getPlatform() === "ios";
    let odul = false;
    const dinle = await A.addListener("onRewardedVideoAdReward", () => { odul = true; });
    try {
      await A.prepareRewardVideoAd({ adId: ios ? AYAR.ADMOB_ODULLU_IOS : AYAR.ADMOB_ODULLU_ANDROID });
      const r = await A.showRewardVideoAd();
      if (r && (r.amount != null || r.type)) odul = true;
    } finally { try { dinle.remove(); } catch (_) {} }
    return odul;
  }
};
// Satın alma (@revenuecat/purchases-capacitor). Para, mağaza ödemeyi onaylayınca sunucuya gelen bildirimle eklenir.
const ODEME = {
  eklenti(){ const C = window.Capacitor; return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Purchases; },
  async hazirla(){
    const P = this.eklenti(); if (!P) return false;
    if (!this._hazir) {
      const ios = window.Capacitor.getPlatform() === "ios";
      await P.configure({ apiKey: ios ? AYAR.REVENUECAT_IOS : AYAR.REVENUECAT_ANDROID, appUserID: D.durum.profil.id });
      this._hazir = true;
    }
    return true;
  },
  async urunler(ids){ const r = await this.eklenti().getProducts({ productIdentifiers: ids, type: "NON_SUBSCRIPTION" }); return r.products || []; },
  async al(urun){ return this.eklenti().purchaseStoreProduct({ product: urun }); }
};
async function magazaModal(){
  const h = D._hayat || await API.rpc("hayat");
  const m = modal(`<h3 style="font-size:19px;font-weight:800">Mağaza</h3><p class="alt">Cüzdanına ₺ ekle: aday adaylığı, kampanya, taşınma ve parti bağışı için. Bağış ve ek yayın hakkının günlük sınırları satın alanlar için de geçerlidir.</p><div id="mgz"><div class="yukleniyor">Yükleniyor…</div></div>`);
  const kutu = $("#mgz", m);
  if (!ODEME.eklenti()) {
    kutu.innerHTML = h.paketler.map(p2 => `<div class="liste-satir"><div class="orta"><b>${e(p2.ad)}</b><div class="kucuk">${tlYaz(p2.miktar)}</div></div><span class="rozet">Telefonda</span></div>`).join("")
      + `<p class="kucuk" style="margin-top:8px">Satın alma yalnızca telefondaki uygulamada yapılabilir.</p>`;
    return;
  }
  let urunler = [];
  try { await ODEME.hazirla(); urunler = await ODEME.urunler(h.paketler.map(p2 => p2.urun_id)); } catch (err) { kutu.innerHTML = `<div class="bos">${e(hataCevir(err.message))}</div>`; return; }
  kutu.innerHTML = h.paketler.map(p2 => { const u = urunler.find(x => x.identifier === p2.urun_id);
    return `<div class="liste-satir"><div class="orta"><b>${e(p2.ad)}</b><div class="kucuk">Cüzdanına ${tlYaz(p2.miktar)}</div></div>
      <button class="rozet altin" style="padding:9px 12px" data-urun="${p2.urun_id}" ${u ? "" : "disabled"}>${u ? e(u.priceString) : "—"}</button></div>`; }).join("");
  kutu.querySelectorAll("[data-urun]").forEach(b => b.onclick = async () => {
    const u = urunler.find(x => x.identifier === b.dataset.urun); b.disabled = true;
    const once = (await API.rpc("hayat")).para;
    try { await ODEME.al(u); } catch (err) { b.disabled = false; if (!/cancel/i.test(String(err && (err.code || err.message)))) toast(hataCevir(err.message), true); return; }
    toast("Ödeme alındı, cüzdanına ekleniyor…");
    for (let i = 0; i < 15; i++) {
      await new Promise(r => setTimeout(r, 2000));
      const r2 = await API.rpc("hayat");
      if (r2.para > once) { modalKapat(); hayatCiz(r2); toast(`Cüzdanına ${tlYaz(r2.para - once)} eklendi. Teşekkürler!`); return; }
    }
    toast("Ödeme alındı; mağaza onayı biraz gecikebilir. Paran birkaç dakika içinde cüzdanında olacak.");
  });
}

let _sirketEkonomi={asgari:NaN,normal:100000,banka:1000000};
let _sirketSonMin=100000;
function sirketOnizleme(sektorDegisti=false){
 const sektor=document.getElementById("sir_sektor"),sermaye=document.getElementById("sir_sermaye");
 const alt=document.getElementById("sir_alt_limit"),onizleme=document.getElementById("sir_kazanc_onizleme");
 const uyari=document.getElementById("sir_sermaye_uyari"),btn=document.getElementById("sir_kur_btn");
 if(!sektor||!sermaye||!alt||!onizleme||!uyari||!btn)return;
 const min=sektor.value==="banka"?_sirketEkonomi.banka:_sirketEkonomi.normal;
 if(sektorDegisti&&Number(sermaye.value)===_sirketSonMin)sermaye.value=String(min);
 _sirketSonMin=min;sermaye.min=String(min);sermaye.max="100000000";sermaye.step="1";
 alt.textContent="Bu sektörde en az "+fmt(min)+" ₺, en fazla 100.000.000 ₺ sermaye gerekir.";
 const tutar=Number(sermaye.value);let hata="";
 if(!sermaye.value.trim()||!Number.isSafeInteger(tutar)||tutar<=0)hata="Geçerli ve pozitif bir tam sayı gir.";
 else if(tutar<min)hata="Bu sektör için en az "+fmt(min)+" ₺ gerekli; girdiğin sermaye "+fmt(tutar)+" ₺.";
 else if(tutar>100000000)hata="En yüksek kuruluş sermayesi 100.000.000 ₺.";
 uyari.textContent=hata;uyari.style.display=hata?"block":"none";btn.disabled=Boolean(hata);
 if(hata){onizleme.textContent="Haftalık kazanç tahmini için geçerli bir sermaye gir.";return;}
 const oran={tarim:.12,sanayi:.15,teknoloji:.20,ticaret:.14,insaat:.18,medya:.16,banka:.08}[sektor.value];
 const asgari=Number(_sirketEkonomi.asgari);
 if(!Number.isFinite(asgari)||asgari<=0||!Number.isFinite(oran)){onizleme.textContent="Canlı ekonomi bilgisi alınamadı, tahmin yapılamıyor.";return;}
 const gelirMin=tutar*oran*.6,gelirMax=tutar*oran*1.4;
 const giderMin=tutar*.025+asgari*.5,giderMax=tutar*.08+asgari*1.5;
 const netMin=gelirMin-giderMax,netMax=gelirMax-giderMin,netOrt=tutar*oran-tutar*.0525-asgari;
 const para=x=>fmt(Math.round(x))+" ₺";
 onizleme.innerHTML='<h3 style="margin-bottom:8px">7 günlük faaliyet tahmini</h3>'
 +'<div class="kv"><span>Olası brüt gelir</span><b>'+para(gelirMin)+' – '+para(gelirMax)+'</b></div>'
 +'<div class="kv"><span>Olası giderler</span><b>'+para(giderMin)+' – '+para(giderMax)+'</b></div>'
 +'<div class="kv"><span>Olası net kâr / zarar</span><b>'+para(netMin)+' – '+para(netMax)+'</b></div>'
 +'<div class="kv"><span>Ortalama senaryo</span><b>'+para(netOrt)+'</b></div>'
 +'<p class="alt" style="margin-top:8px">Bunlar garanti kazanç değildir; mevcut 7 günlük oyun formülüne göre olası sonuçlardır. Kâr ortakların paylarına göre cüzdana geçer, zarar şirket kasasını azaltır. Asgari ücret değişirse tahmin değişir.</p>';
}

  });

    ${sec ? `<div class="alan"><label>${sec.ad}</label><select id="tsec">${sec.liste.map(([d, a]) => `<option value="${d}">${a}</option>`).join("")}</select></div>` : ""}
    <p class="kucuk" id="tonizle" style="min-height:18px"></p>
    <button class="btn altin" id="tok">${o.buton}</button><button class="btn ikinci" onclick="modalKapat()">Vazgeç</button>`);

  $("#tmik", m).oninput = ciz; if (sec) $("#tsec", m).onchange = ciz; ciz();
  if (o.tamami) $("#ttam", m).onclick = () => { $("#tmik", m).value = o.tamami; ciz(); };

}

const ilBuyukluk = (mv) => mv >= 14 ? 3 : mv >= 8 ? 2 : 1;

    <div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:20px">${t.sayi} <span class="kucuk">/ 81 il</span></b>${t.yetkili ? `<span class="kucuk">Kasa: ${tlYaz(t.kasa)}</span>` : ""}</div>
    <div class="bar"><i style="width:${t.sayi * 100 / 81}%;background:var(--gold)"></i></div>
    <div style="margin-top:6px">${t.sayi >= 81 ? `<span class="cip notr">Türkiye'nin 81 ilinde teşkilatlı</span>`
      : t.iller.map(x => `<span class="cip notr">${x.genel_merkez ? "" : ""}${e(x.ad)}${x.uye ? " · " + x.uye + " üye" : ""}</span>`).join("")}</div>
    <p class="kucuk" style="margin-top:8px">${t.zorunlu ? "Genel seçime katılmak için Türkiye’de en az 1 il teşkilatı yeterlidir; belediye başkanı adayı göstermek için ilgili ilde teşkilat gerekir." : "Şu an aday göstermek için teşkilat şartı aranmıyor."}
      Kuruluş bedeli: küçük il ${tlYaz(t.ucretler["1"])}, orta il ${tlYaz(t.ucretler["2"])}, büyük il ${tlYaz(t.ucretler["3"])}. Genel başkan/GBY parti kasasından; atanmış İl Başkanı kendi cüzdanından ödeyebilir.</p>
    ${(t.gorevler || []).map(g => `<div class="liste-satir"><div class="orta"><b>${e(g.ad)}</b><div class="alt">Parti İl Başkanı: ${e(g.kad)}</div><div class="kucuk">${g.teskilat_acik ? "Teşkilat açık" : "Kuruluş bekliyor"}</div></div></div>`).join("")}

function teskilatAcModal(pid){
  const t = D._teskilat; if (!t) return;

  const bedel = (id) => { const g = gorevler.find(x => x.il_id === id); return g ? g.ucret : t.ucretler[String(ilBuyukluk((VERI.iller.find(i => i.id === id) || {}).mv || 1))]; };
  const benimIl = D.durum.profil.il_id;

    <p class="kucuk" id="tkbilgi"></p>
    <div class="alan"><label for="tkkaynak">Ödeme kaynağı</label><select id="tkkaynak">${t.yetkili ? '<option value="parti">Parti kasası</option>' : ''}<option value="kendi">Kendi cüzdanım</option></select></div>
    <button class="btn altin" id="tkok">Teşkilatı aç</button><button class="btn ikinci" onclick="modalKapat()">Vazgeç</button>`);
  const ciz = () => { const id = +$("#tkil", m).value, g = (t.gorevler || []).find(x => x.il_id === id); $("#tkbilgi", m).textContent = `İl: ${ilAd(id)} · İl Başkanı: ${g ? g.kad : "Henüz atanmadı"} · Kuruluş bedeli: ${tlYaz(bedel(id))}`; };
  $("#tkil", m).onchange = ciz; ciz();
  $("#tkok", m).onclick = async () => {
    await basinIslem($("#tkok", m), { ad: "teskilat_ac2", args: { p_il: +$("#tkil", m).value, p_kaynak: $("#tkkaynak", m).value } }, async () => { await teskilatKartCiz(pid); await partiKasaCiz(pid); });
  };
}

const EKRAN = { gundem: gundemEkrani, hayat: hayatEkrani, sohbet: sohbetListe, devlet: devletEkrani, harita: haritaEkrani, parti: partilerEkrani, ben: benEkrani };
// Sunucu bu uygulama sürümünü artık desteklemiyorsa güncelleme ister (oyuncunun verisi sunucuda, kaybolmaz)
function surumKucuk(a, b){ return /^\d/.test(a) && /^\d/.test(b) && a.localeCompare(b, "en", { numeric: true }) < 0; }
async function surumKontrol(){
  try {
    const s = await API.rpc("surum");
    if (s && surumKucuk(window.UYGULAMA_SURUM, s.min_uygulama)) {
      const ios = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === "ios";
      $("#app").innerHTML = `<div class="karsila"><h1>Güncelleme gerekli</h1><p class="giris">Oyunun yeni sürümü yayında. Devam etmek için uygulamayı güncelle. Hesabın, makamın, paran ve bütün geçmişin sunucuda güvende; güncelleyince kaldığın yerden devam edersin.</p>
        <a class="btn" style="text-decoration:none;display:block;text-align:center" href="${e(ios ? AYAR.APP_STORE : AYAR.GOOGLE_PLAY)}">Güncelle</a><button class="btn ikinci" onclick="basla()">Tekrar dene</button></div>`;
      return false;
    }
  } catch (_) {}
  return true;
}
async function basla(){
  if (!await surumKontrol()) return;
  const o = await API.oturum();
  if (!o) return karsilama();
  await oturumKaydet();
  try { await durumYenile(); } catch (err) {
    $("#app").innerHTML = `<div class="karsila"><h1>Bağlantı sorunu</h1><p class="giris">${e(hataCevir(err.message))}</p><button class="btn" onclick="basla()">Tekrar dene</button><button class="btn ikinci" onclick="cikisYap()">Çıkış</button></div>`;
    return;
  }
  if (!D.durum.profil) return profilOlusturEkrani();
  try { PARTI_ON = await API.rpc("partiler"); } catch (_) {}
  if (typeof kimlikYukle === "function") await kimlikYukle([D.durum.profil.kad]);
  sekmeAc("gundem");
  PUSH.baslat();
  if (D._bekleyenYon) { const v = D._bekleyenYon; D._bekleyenYon = null; PUSH.yonlendir(v); }
}

setInterval(async () => { if (API && D.durum && D.durum.profil && !document.hidden) { try { rozetGuncelle(await API.rpc("rozetler")); } catch (_) {} } }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && D.durum && !D.yigin.length && !$("#modal")) EKRAN[D.sekme](); });
