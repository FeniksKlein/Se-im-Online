name: Publish organization invitations on existing game pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/halk-org-davet.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: secim-online-halk-org-ui
  cancel-in-progress: false
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new feature syntax
        run: node --check docs/halk-org-davet.js
      - name: Attach new feature without rebuilding or removing existing game code
        run: |
          cp docs/halk-org-davet.js www/halk-org-davet.js
          python3 - <<'PY'
          from pathlib import Path
          tag = b'<script defer src="halk-org-davet.js?v=20261107-5"></script>\n'
          for filename in ('docs/index.html','www/index.html'):
              p = Path(filename)
              data = p.read_bytes()
              if b'halk-org-davet.js' not in data:
                  position = data.lower().rfind(b'</body>')
                  if position < 0:
                      raise SystemExit(filename + ': closing body not found')
                  p.write_bytes(data[:position] + tag + data[position:])
                  print('Connected:', filename)
              else:
                  import re
                  newest = re.sub(rb'halk-org-davet[.]js[?]v=[0-9A-Za-z._-]+', b'halk-org-davet.js?v=20261107-5', data)
                  if newest != data:
                      p.write_bytes(newest)
                      print('Cache version updated:', filename)
                  else:
                      print('Already current:', filename)
          PY
          git diff --check
      - name: Commit the non-destructive page attachment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html www/index.html www/halk-org-davet.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: show protest organization invites on live game pages [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
