name: Build and publish game web
# Ayrı yayımlayıcı ile çakışmaması için otomatik çalışmaz.
# Otomatik canlı yayın meslek-derle.yml tarafından yapılır.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check module JavaScript
        run: node --check gelistirici/www/meslek_carsi.js
      - name: Compile single-file site and mobile bundle
        run: node --max-old-space-size=4096 gelistirici/build/derle.js
      - name: Update GitHub Pages and legacy web copy
        run: |
          cp gelistirici/dist/index.html docs/index.html
          cp gelistirici/dist/index.html www/index.html
          cp docs/halk-org-davet.js www/halk-org-davet.js
          node --check docs/halk-org-davet.js
          python3 - <<'PY'
          from pathlib import Path
          tag=b'<script defer src="halk-org-davet.js?v=20261108-1"></script>\n'
          for name in ('docs/index.html','www/index.html'):
              p=Path(name)
              data=p.read_bytes()
              if b'halk-org-davet.js' not in data:
                  position=data.lower().rfind(b'</body>')
                  if position<0: raise SystemExit('Closing body missing: '+name)
                  p.write_bytes(data[:position]+tag+data[position:])
          PY
          git add docs/index.html www/index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: publish game UI from latest source"
            git push
          fi
