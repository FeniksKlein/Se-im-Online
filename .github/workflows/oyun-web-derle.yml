name: Oyun web surumu derle

# 25.10.2026: Bu iş artık canlı web dosyalarını (docs/index.html, www/index.html) EZMEZ.
# Sebep: canlıdaki docs/index.html, gelistirici/www/index.html'de olmayan parçalar içeriyor
# (seçim gecesi yük koruması, kriz merkezi, banka/çek merkezi yükleyicileri...). Sabah bu iş
# docs/index.html'i eski kaynaktan yeniden üretince bu bölümler canlıdan kayboldu.
# Şimdi yalnızca: sözdizimi kontrolü + deneme derlemesi + supabase-kurulum.sql üretimi
# + canlı web dosyasının temel modülleri hâlâ yüklediğinin kontrolü.

on:
  push:
    branches: [main]
    paths:
      - "gelistirici/**"
      - "docs/**"
      - ".github/workflows/oyun-web-derle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oyun-web-derle
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript sozdizimi
        run: |
          for f in docs/*.js gelistirici/build/derle.js gelistirici/build/sql_birlestir.js; do node --check "$f"; done
      - name: Deneme derlemesi ve SQL
        run: |
          node gelistirici/build/derle.js
          node gelistirici/build/sql_birlestir.js
          cp gelistirici/dist/supabase-kurulum.sql supabase-kurulum.sql
      - name: Tek dosyalik uygulamada ekonomi ve bankacilik modullerini denetle
        run: |
          for isaret in "SO_MENU_MERKEZLERI_V1" "BANKACILIK_V2" "function bankaDetayEkrani" "function bankaRehberiEkrani" "window.mobilSubeEkrani" "ILAN_MEYDANI" "window.YUK" "YUK.otomatik" "async function krizMerkeziEkrani" "SO_PREMIUM_ARAYUZ_V1" "window.muzayedeEkrani" "window.kursuEkrani" "window.fiyatTarifesiEkrani" "window.siyasetArenasiEkrani" "window.meclisSandalyeEkrani" "window.butceEkonomiEkrani" "SO_KESINTISIZ_V1"; do
            grep -q "$isaret" gelistirici/dist/index.html || { echo "Derlemede bulunamayan isaret: $isaret"; exit 1; }
          done
          test -s docs/index.html
      - name: SQL kurulum dosyasini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-kurulum.sql
          if ! git diff --cached --quiet; then
            git commit -m "build: supabase-kurulum.sql [skip ci]"
            # 28.10.2026: "Uygulama derle" işi aynı anda docs/index.html'i itiyor; itme reddedilirse
            # önce onun commit'ini al, sonra yeniden dene (eskiden bu adım kırmızı X veriyordu).
            for deneme in 1 2 3 4 5; do
              git pull --rebase -q origin main && git push origin HEAD:main && exit 0
              sleep $((deneme * 5))
            done
            exit 1
          fi
