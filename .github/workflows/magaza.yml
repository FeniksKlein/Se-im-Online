# Seçim Simülasyonu Online — mağaza paketleri
# Android: imzasız App Bundle (.aab, Google Play'e yüklenmeden önce yükleme anahtarıyla imzalanır) + deneme APK'sı
# iOS: Xcode projesi (MacinCloud'da açılıp Archive edilir); burada simülatör için derlenerek doğrulanır.
# Çıktılar "magaza-ciktilari" dalına yazılır.
name: Mağaza paketleri

on:
  workflow_dispatch:
    inputs:
      surum_adi:
        description: "Sürüm adı (ör. 1.0.0). Boşsa mobil/magaza.json"
        required: false
      surum_kodu:
        description: "Sürüm kodu (her yüklemede 1 artar). Boşsa mobil/magaza.json"
        required: false
  push:
    branches: [main]
    paths:
      - "mobil/**"
      - ".github/workflows/magaza.yml"

permissions:
  contents: write

concurrency:
  group: magaza
  cancel-in-progress: true

env:
  SURUM_ADI: ${{ github.event.inputs.surum_adi }}
  SURUM_KODU: ${{ github.event.inputs.surum_kodu }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketler
        working-directory: mobil
        run: |
          # Eski sharp/libvips indirme sunucusunda ara sira zaman asimi oluyor.
          # Gecici ag hatasi yuzunden iOS paketinin tamamen atlanmasini onle.
          for deneme in 1 2 3 4; do
            if npm install --no-audit --no-fund; then break; fi
            if [ "$deneme" = 4 ]; then exit 1; fi
            echo "Bagimlilik indirmesi basarisiz; yeniden deneniyor: $deneme/4"
            sleep 8
          done
          npm ls --depth=0 | tee ../surumler.txt
      - name: Web içeriği (docs → mobil/www)
        run: node gelistirici/build/magaza_paketi.js
      - name: Android projesi
        working-directory: mobil
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0E1530' --iconBackgroundColorDark '#0E1530' --splashBackgroundColor '#0E1530' --splashBackgroundColorDark '#0E1530'
          npx cap sync android
          node hazirla.mjs
      - name: App Bundle ve deneme APK'sı
        working-directory: mobil/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
          mkdir -p ../../cikti
          cp app/build/outputs/bundle/release/app-release.aab ../../cikti/SecimOnline-imzasiz.aab
          cp app/build/outputs/apk/debug/app-debug.apk ../../cikti/SecimOnline-deneme.apk
          cp ../../surumler.txt ../../cikti/android-surumler.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: cikti/

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paketler
        working-directory: mobil
        run: |
          # Eski sharp/libvips indirme sunucusunda ara sira zaman asimi oluyor.
          # Gecici ag hatasi yuzunden iOS paketinin tamamen atlanmasini onle.
          for deneme in 1 2 3 4; do
            if npm install --no-audit --no-fund; then break; fi
            if [ "$deneme" = 4 ]; then exit 1; fi
            echo "Bagimlilik indirmesi basarisiz; yeniden deneniyor: $deneme/4"
            sleep 8
          done
          npm ls --depth=0 | tee ../surumler-ios.txt
      - name: Web içeriği
        run: node gelistirici/build/magaza_paketi.js
      - name: iOS ve Android projeleri
        working-directory: mobil
        run: |
          npx cap add ios
          npx cap add android
          npx capacitor-assets generate --ios --android --iconBackgroundColor '#0E1530' --iconBackgroundColorDark '#0E1530' --splashBackgroundColor '#0E1530' --splashBackgroundColorDark '#0E1530'
          npx cap sync
          node hazirla.mjs
      - name: iOS derleme denetimi (simülatör, imzasız)
        working-directory: mobil/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies | tail -20
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Proje arşivi (MacinCloud / Android Studio için)
        run: |
          mkdir -p cikti
          cd mobil && npm prune --omit=dev --no-audit --no-fund && cd ..
          rm -rf mobil/ios/App/build mobil/ios/DerivedData
          zip -qry cikti/SecimOnline-proje.zip mobil -x 'mobil/android/.gradle/*' 'mobil/android/app/build/*' 'mobil/android/build/*'
          cp surumler-ios.txt cikti/ios-surumler.txt
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: cikti/
      - name: Çıktıları "magaza-ciktilari" dalına yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/dal && cp -r cikti/* /tmp/dal/
          echo "kaynak: ${GITHUB_SHA}" > /tmp/dal/BILGI.txt
          echo "tarih: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/dal/BILGI.txt
          git checkout --orphan magaza-ciktilari
          git rm -rfq . > /dev/null
          rm -rf ./* .github 2>/dev/null || true
          cp -r /tmp/dal/* .
          git add -A
          git commit -qm "Mağaza paketleri (${GITHUB_SHA::7})"
          git push -f origin magaza-ciktilari
