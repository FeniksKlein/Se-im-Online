<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim Portalı · Seçim Simülasyonu Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --kagit:#E9ECF1; --yuzey:#FFFFFF; --yuzey2:#F4F6F9; --cizgi:#D3D9E2; --cizgi2:#B9C2CF;
  --murekkep:#172131; --murekkep2:#4A5668; --soluk:#6E7a8C;
  --sandik:#1F4E8C; --sandik-acik:#E3ECF8;
  --muhur:#A8231B; --muhur-acik:#F8E5E3;
  --onay:#1D7348; --onay-acik:#E1F2E8;
  --dikkat:#9A6410; --dikkat-acik:#FBF0DC;
  --golge:0 1px 2px rgba(23,33,49,.06);
  --r1:6px; --r2:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="acik"]){
    --kagit:#10141B; --yuzey:#171D26; --yuzey2:#1D2430; --cizgi:#2A3342; --cizgi2:#3A4557;
    --murekkep:#E6EAF0; --murekkep2:#AEB8C6; --soluk:#8592A5;
    --sandik:#7FA8E3; --sandik-acik:#1C2B42;
    --muhur:#F0857C; --muhur-acik:#3A1F1E;
    --onay:#6FCB97; --onay-acik:#16301F;
    --dikkat:#E9B35C; --dikkat-acik:#33270F;
    --golge:none; color-scheme: dark;
  }
}
:root[data-tema="koyu"]{
  --kagit:#10141B; --yuzey:#171D26; --yuzey2:#1D2430; --cizgi:#2A3342; --cizgi2:#3A4557;
  --murekkep:#E6EAF0; --murekkep2:#AEB8C6; --soluk:#8592A5;
  --sandik:#7FA8E3; --sandik-acik:#1C2B42;
  --muhur:#F0857C; --muhur-acik:#3A1F1E;
  --onay:#6FCB97; --onay-acik:#16301F;
  --dikkat:#E9B35C; --dikkat-acik:#33270F;
  --golge:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--kagit);color:var(--murekkep);font:15px/1.5 "Public Sans",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sandik)}
:focus-visible{outline:2px solid var(--sandik);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.gizli{display:none!important}

/* İskelet */
.kabuk{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.yan{background:var(--yuzey);border-right:1px solid var(--cizgi);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.marka{display:flex;gap:10px;align-items:center;padding:0 8px 16px}
.marka-isaret{width:34px;height:34px;border-radius:50%;border:2px solid var(--sandik);display:grid;place-items:center;flex:none}
.marka-isaret span{width:14px;height:14px;border-radius:3px;background:var(--sandik);transform:rotate(45deg)}
.marka b{display:block;font-size:14px;line-height:1.2}
.marka small{color:var(--soluk);font-size:12px}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r1);color:var(--murekkep2);text-decoration:none;font-weight:600}
.menu a:hover{background:var(--yuzey2);color:var(--murekkep)}
.menu a[aria-current="page"]{background:var(--sandik-acik);color:var(--sandik)}
.menu svg{width:18px;height:18px;flex:none}
.yan-alt{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--cizgi);font-size:13px;color:var(--soluk);display:grid;gap:8px}
.yan-alt .sat{display:flex;gap:8px;flex-wrap:wrap}
.ana{min-width:0;padding:20px 28px 60px}
.ust{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.ust .menu-dugme{display:none}
.arama{flex:1;max-width:520px;position:relative}
.arama input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--cizgi);border-radius:var(--r2);background:var(--yuzey)}
.arama svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--soluk)}
.arama-sonuc{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r2);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;max-height:60vh;overflow:auto}
.arama-sonuc button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--cizgi)}
.arama-sonuc button:hover{background:var(--yuzey2)}
.saat{margin-left:auto;color:var(--soluk);font-size:13px;white-space:nowrap}

/* Parçalar */
.blok{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r2);padding:16px;box-shadow:var(--golge)}
.blok + .blok{margin-top:14px}
.blok-bas{display:flex;align-items:baseline;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.blok-bas .alt{color:var(--soluk);font-size:13px}
.izgara{display:grid;gap:14px}
.iz-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.iz-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sayilar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border:1px solid var(--cizgi);border-radius:var(--r2);background:var(--yuzey);overflow:hidden}
.sayi{padding:14px 16px;border-right:1px solid var(--cizgi)}
.sayi:last-child{border-right:0}
.sayi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sayi span{color:var(--soluk);font-size:13px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--murekkep2)}
.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.izgara > .blok + .blok{margin-top:0}
.etiket{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--yuzey2);color:var(--murekkep2);white-space:nowrap}
.etiket::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.e-oy{background:var(--onay-acik);color:var(--onay)}
.e-basvuru{background:var(--sandik-acik);color:var(--sandik)}
.e-sayim,.e-dikkat{background:var(--dikkat-acik);color:var(--dikkat)}
.e-iptal,.e-hata{background:var(--muhur-acik);color:var(--muhur)}
.e-tamam,.e-sonuclandi{background:var(--yuzey2);color:var(--soluk)}
.uyari{border-radius:var(--r2);padding:12px 14px;font-size:14px;border:1px solid}
.u-dikkat{background:var(--dikkat-acik);border-color:color-mix(in srgb,var(--dikkat) 30%,transparent);color:var(--murekkep)}
.u-hata{background:var(--muhur-acik);border-color:color-mix(in srgb,var(--muhur) 35%,transparent)}
.u-iyi{background:var(--onay-acik);border-color:color-mix(in srgb,var(--onay) 30%,transparent)}
.u-bilgi{background:var(--sandik-acik);border-color:color-mix(in srgb,var(--sandik) 25%,transparent)}
.uyari b{display:block;margin-bottom:2px}
.uyari ul{margin:6px 0 0;padding-left:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--cizgi2);background:var(--yuzey);border-radius:var(--r1);padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--murekkep);min-height:40px}
.btn:hover{background:var(--yuzey2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ana{background:var(--sandik);border-color:var(--sandik);color:#fff}
:root[data-tema="koyu"] .btn-ana{color:#0E1726}
@media (prefers-color-scheme: dark){:root:not([data-tema="acik"]) .btn-ana{color:#0E1726}}
.btn-ana:hover{background:color-mix(in srgb,var(--sandik) 88%,#000)}
.btn-kirmizi{border-color:var(--muhur);color:var(--muhur)}
.btn-kirmizi:hover{background:var(--muhur-acik)}
.btn-kucuk{min-height:32px;padding:5px 10px;font-size:13px}
.dugmeler{display:flex;gap:8px;flex-wrap:wrap}
.hizli{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.hizli button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--cizgi);background:var(--yuzey);border-radius:var(--r2);padding:12px 14px;cursor:pointer;min-height:64px}
.hizli button:hover{border-color:var(--sandik)}
.hizli b{font-size:14px}
.hizli span{font-size:12px;color:var(--soluk)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--soluk);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--cizgi);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--cizgi);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.tik{cursor:pointer}
tbody tr.tik:hover td{background:var(--yuzey2)}
.tablo-kap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.sag{text-align:right}
.tutar{white-space:nowrap}
.soluk{color:var(--soluk)}
.kucuk{font-size:13px}
.ince{font-weight:400}
.bos{padding:24px;text-align:center;color:var(--soluk)}

.form{display:grid;gap:12px}
.alan{display:grid;gap:5px}
.alan label{font-size:13px;font-weight:600;color:var(--murekkep2)}
.alan input,.alan select,.alan textarea{padding:9px 11px;border:1px solid var(--cizgi2);border-radius:var(--r1);background:var(--yuzey);min-height:40px;width:100%}
.alan small{color:var(--soluk);font-size:12px}
.secim-kutu{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.secim-kutu input{width:18px;height:18px;margin-top:2px;accent-color:var(--sandik)}
.cubuk{height:8px;background:var(--yuzey2);border-radius:4px;overflow:hidden}
.cubuk i{display:block;height:100%;background:var(--sandik)}
.sekmeler{display:flex;gap:2px;border-bottom:1px solid var(--cizgi);margin:18px 0 14px;overflow-x:auto}
.sekmeler button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--murekkep2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.sekmeler button[aria-selected="true"]{color:var(--sandik);border-bottom-color:var(--sandik)}

.takvim{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--cizgi);border:1px solid var(--cizgi);border-radius:var(--r2);overflow:hidden}
.takvim div{padding:10px 12px;background:var(--yuzey)}
.takvim span{display:block;font-size:12px;color:var(--soluk)}
.takvim b{font-size:14px}

/* Pencere */
.perde{position:fixed;inset:0;background:rgba(10,16,26,.48);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.pencere{background:var(--yuzey);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.pencere-bas{padding:18px 20px 12px;border-bottom:1px solid var(--cizgi);display:flex;gap:12px;align-items:flex-start}
.pencere-bas h2{flex:1}
.pencere-govde{padding:16px 20px;overflow:auto;display:grid;gap:14px}
.pencere-alt{padding:14px 20px;border-top:1px solid var(--cizgi);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.kapat{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--soluk);padding:4px 8px}

/* Mühür onayı: portalın tek gösterişli anı */
.muhur-alan{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px;border:1px dashed var(--muhur);border-radius:var(--r2);background:var(--muhur-acik)}
.muhur-alan .alan{flex:1;min-width:200px}
.muhur{width:96px;height:96px;border-radius:50%;border:3px double var(--muhur);color:var(--muhur);background:transparent;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.04em;cursor:pointer;transform:rotate(-8deg);flex:none}
.muhur:disabled{opacity:.35;cursor:not-allowed}
.muhur:not(:disabled):hover{background:var(--muhur);color:#fff}
.damga{position:fixed;left:50%;top:42%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:6px double var(--onay);color:var(--onay);display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:.05em;z-index:80;pointer-events:none;background:color-mix(in srgb,var(--yuzey) 80%,transparent);animation:damga .9s ease-out forwards}
@keyframes damga{0%{transform:scale(1.8) rotate(-18deg);opacity:0}25%{transform:scale(1) rotate(-10deg);opacity:1}75%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-10deg)}}
@media (prefers-reduced-motion: reduce){.damga{animation:none;opacity:0}}

.bildirim{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--murekkep);color:var(--kagit);padding:11px 16px;border-radius:var(--r2);z-index:90;max-width:min(560px,calc(100vw - 32px));font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bildirim.hata{background:var(--muhur);color:#fff}

/* Giriş */
.giris{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.giris-kart{width:100%;max-width:400px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:14px;padding:26px 24px;display:grid;gap:16px}
.giris-kart .marka{padding:0}
.qr{background:#fff;border-radius:var(--r2);padding:10px;width:200px;height:200px;margin:0 auto}
.qr img{width:100%;height:100%}
.gizli-kod{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--yuzey2);padding:8px 10px;border-radius:var(--r1)}
.kod-girdi{letter-spacing:.3em;font-size:22px!important;text-align:center}
.yukleniyor{padding:40px;text-align:center;color:var(--soluk)}

/* Oyuncular + toplu işlem */
.filtreler{display:grid;grid-template-columns:minmax(160px,2fr) repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.filtreler .alan label{font-size:12px}
.sec-sutun{width:36px}
.sec-sutun input{width:18px;height:18px;accent-color:var(--sandik);cursor:pointer}
.secili-cubuk{position:sticky;bottom:12px;z-index:15;margin-top:14px;background:var(--murekkep);color:var(--kagit);border-radius:var(--r2);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.secili-cubuk b{margin-right:auto}
.secili-cubuk .btn{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--kagit) 40%,transparent);min-height:34px;padding:5px 10px;font-size:13px}
.secili-cubuk .btn:hover{background:color-mix(in srgb,var(--kagit) 14%,transparent)}
.profil-bas{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.profil-bas h1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.profil-bas .alt{color:var(--soluk);font-size:13px;margin-top:4px}
.adimlar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin:0 0 16px;padding:0;list-style:none;counter-reset:adim}
.adimlar li{counter-increment:adim;font-size:12px;font-weight:600;color:var(--soluk);border-top:3px solid var(--cizgi);padding-top:6px}
.adimlar li::before{content:counter(adim) ". "}
.adimlar li.tamam{border-color:var(--onay);color:var(--murekkep2)}
.adimlar li.simdi{border-color:var(--sandik);color:var(--sandik)}
.islem-sec{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.islem-sec label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--cizgi);border-radius:var(--r2);padding:10px 12px;cursor:pointer;background:var(--yuzey)}
.islem-sec label:has(input:checked){border-color:var(--sandik);background:var(--sandik-acik)}
.islem-sec input{margin-top:3px;accent-color:var(--sandik)}
.islem-sec b{display:block;font-size:14px}
.islem-sec span{font-size:12px;color:var(--soluk)}
.fark{display:grid;gap:10px}
.fark ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.fark .bitecek li::marker{color:var(--muhur)}
.fark .baslayacak li::marker{color:var(--onay)}

/* Siyaset ve ekonomi */
.renk-nokta{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:baseline;margin-right:2px;border:1px solid color-mix(in srgb,var(--murekkep) 20%,transparent)}
.meclis-cubuk{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--cizgi);gap:1px}
.arz{display:grid;gap:10px}
.arz div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.arz i{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sandik)}
.kartlar{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.kartlar > .blok + .blok{margin-top:0}
.kart h3{font-size:15px;margin:0}
.alinti{margin:0 0 8px;padding:10px 12px;border-left:3px solid var(--muhur);background:var(--yuzey2);border-radius:0 var(--r1) var(--r1) 0;white-space:pre-wrap;overflow-wrap:anywhere}
.konusma{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.balon{align-self:flex-start;max-width:85%;background:var(--yuzey2);border-radius:12px 12px 12px 4px;padding:8px 11px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.balon.giden{align-self:flex-end;background:var(--sandik-acik);border-radius:12px 12px 4px 12px}
.balon small{display:block;color:var(--soluk);font-size:11px;margin-top:3px}
.olay-liste{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.gizli-etiket{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kontrol-liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.kontrol-liste summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.kontrol-liste details{border-bottom:1px solid var(--cizgi);padding-bottom:8px}
.kontrol-liste details > *:not(summary){margin:6px 0 0}
.sohbet{display:flex;flex-direction:column;gap:10px}
.mesajlar{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:62vh;overflow:auto;padding:4px 2px}
.mesajlar .balon{max-width:92%;font-size:15px;line-height:1.5}
.mesajlar .balon:not(.giden){white-space:normal}
.mesajlar .balon small{margin-top:8px}
.balon.yaziyor{color:var(--soluk);font-style:italic}
.ornekler{display:flex;gap:8px;flex-wrap:wrap}
.ornekler .btn{white-space:normal;text-align:left}
.sohbet-giris{display:flex;gap:8px;align-items:flex-end}
.sohbet-giris textarea{flex:1;min-width:0;resize:vertical}
.oneri{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border:1px solid var(--sandik);border-radius:var(--r2);background:var(--yuzey)}
.oneri.engelli{border-color:var(--muhur)}
.madde{display:block;padding-left:4px}
.gecmis-kayit{border-bottom:1px solid var(--cizgi);padding:10px 0}
.gecmis-kayit p{margin:4px 0}

/* Canlı ayarlar */
.ayar-grup{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--soluk);margin:18px 0 6px}
.ayar-grup:first-child{margin-top:4px}
.ayar-liste{display:grid;gap:8px}
.ayar{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,260px);gap:14px;align-items:center;border:1px solid var(--cizgi);border-radius:var(--r2);padding:12px 14px;background:var(--yuzey)}
.ayar.degisti{border-color:var(--sandik);background:var(--sandik-acik)}
.ayar-bilgi p{margin:4px 0;font-size:13px;color:var(--murekkep2)}
.ayar-bilgi a{color:inherit}

    govde: h => { d.querySelector(".pencere-govde").innerHTML = h; },

function sonucHtml(s){
  let h = "";
  if(s.basarili === false){
    return `<div class="uyari u-hata"><b>Uygulanmadı</b>${e(s.hata)}</div>${s.degisti ? `<p class="kucuk">Güncel durumu görmek için işlemi yeniden başlat.</p>` : ""}`;
  }

  h += `<div class="uyari u-iyi"><b>${e(s.ozet || "Uygulandı")}</b>İşlem #${e(s.islem_id)} denetim kaydına yazıldı.</div>`;

      ${d.beklenen != null ? `<br>Yazılan kayıt: ${sayi(d.kayit)} / ${sayi(d.beklenen)}` : ""}
      ${d.bos_pusula_secmen != null ? `<br>Pusulası hâlâ boş seçmen: ${sayi(d.bos_pusula_secmen)}` : ""}
      ${d.asama ? `<br>Seçimin durumu: ${e(ASAMA[d.asama]||d.asama)}` : ""}
      ${d.hesap_hareketi != null ? `<br>Hesap hareketi: ${sayi(d.hesap_hareketi)} kayıt, toplam ${e(tl(d.hareket_toplami))} (beklenen ${e(tl(d.beklenen_toplam))})` : ""}
      ${d.il_dogru != null ? `<br>İl doğru: ${d.il_dogru ? "evet" : "hayır"} · eski ilde açık il başkanlığı yok: ${d.eski_ilde_aktif_teskilat_yok ? "evet" : "hayır"} · eski ilde bekleyen adaylık yok: ${d.eski_ilde_bekleyen_adaylik_yok ? "evet" : "hayır"}` : ""}</div>`;
  }
  if(s.bildirim) h += `<p class="kucuk soluk">${sayi(s.bildirim)} oyuncuya bildirim gönderildi.</p>`;
  h += farkHtml(s, true);
  if(Array.isArray(s.eklenen)) h += `<div><h3>Başarılı (${s.eklenen.length})</h3>${tablo(s.eklenen)}</div>`;
  if(Array.isArray(s.eklenemeyen) && s.eklenemeyen.length) h += `<div><h3>Başarısız (${s.eklenemeyen.length})</h3>${tablo(s.eklenemeyen)}</div>`;
  return h;
}
function raporSatirlari(s){
  const temizle = (r, durum) => { const o = { durum }; for(const [k, v] of Object.entries(r)) if(k !== "user_id" && (v == null || typeof v !== "object")) o[k] = v; return o; };
  return [...(s.eklenen || []).map(r => temizle(r, "Başarılı")), ...(s.eklenemeyen || []).map(r => temizle(r, "Başarısız"))];
}
function csvIndir(ad, satirlar){
  if(!satirlar || !satirlar.length) return;
  const anahtar = [...new Set(satirlar.flatMap(r => Object.keys(r)))];
  const baslik = k => k === "durum" ? "Durum" : ((SUTUN.find(([x]) => x === k) || [k, k])[1]);
  const kac = v => { const t = v == null ? "" : String(v); return /[";\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const csv = "\ufeff" + [anahtar.map(k => kac(baslik(k))).join(";"), ...satirlar.map(r => anahtar.map(k => kac(r[k])).join(";"))].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = ad + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function islemYap(islem, param, sonra){
  const p = pencere("Ön izleme hazırlanıyor", `<div class="yukleniyor">Etkilenecek kayıtlar hesaplanıyor…</div>`, "");
  let o;
  try { o = await rpc("yp_onizle", { p_islem: islem, p_param: param || {} }); }
  catch(err){ p.govde(`<div class="uyari u-hata"><b>Ön izleme yapılamadı</b>${e(err.message)}</div>`); p.alt(`<button class="btn" data-kapat>Kapat</button>`); return; }
  onizlemeCiz(p, o, sonra);
}
function onizlemeAc(o, sonra){ onizlemeCiz(pencere(o.baslik || "İşlem", "", ""), o, sonra); }
function onizlemeCiz(p, o, sonra){
  p.el.querySelector(".pencere-bas h2").textContent = o.baslik || "İşlem";
  let govde = onizlemeHtml(o);
  if(!o.engel && o.kritik) govde += `<div class="muhur-alan"><div class="alan"><label for="onay">Onaylamak için <b>${e(o.onay_metni)}</b> yaz</label>
    <input id="onay" autocomplete="off" autocapitalize="characters"><small>Kritik işlem: onay metnini aynen yazman gerekir.</small></div>
    <button class="muhur" id="uygula" disabled>MÜHÜRLE</button></div>`;
  p.govde(govde);
  p.alt(o.engel ? `<button class="btn" data-kapat>Kapat</button>` : o.kritik ? `<button class="btn" data-kapat>Vazgeç</button>`
    : `<button class="btn" data-kapat>Vazgeç</button><button class="btn btn-ana" id="uygula">Uygula</button>`);
  if(o.engel) return;
  const btn = p.q("#uygula"), onay = p.q("#onay");
  if(onay){ onay.oninput = () => { btn.disabled = onay.value.trim().toLocaleUpperCase("tr-TR") !== String(o.onay_metni).toLocaleUpperCase("tr-TR"); }; onay.focus(); }
  btn.onclick = async () => {
    btn.disabled = true;
    let s;
    try { s = await rpc("yp_uygula", { p_anahtar: o.anahtar, p_onay: onay ? onay.value.trim() : null }); }
    catch(err){ s = { basarili:false, hata: err.message }; }
    if(s.basarili !== false) damga("UYGULANDI");
    p.el.querySelector(".pencere-bas h2").textContent = s.basarili === false ? "Uygulanmadı" : "Tamamlandı";
    p.govde(sonucHtml(s));
    const rapor = raporSatirlari(s);
    p.alt(`${rapor.length ? `<button class="btn" id="csv">Raporu indir (CSV)</button>` : ""}<button class="btn btn-ana" data-kapat>Kapat</button>`);
    if(rapor.length) p.q("#csv").onclick = () => csvIndir(`islem-${s.islem_id || "rapor"}`, rapor);
    if(s.basarili !== false && sonra) sonra(s);
  };
}

        ${d.sistem.son_hatalar.length ? `<details style="margin-top:10px"><summary class="kucuk">Son motor hataları</summary>${d.sistem.son_hatalar.map(h => `<div class="kucuk" style="margin-top:6px"><b>${e(h.adim)}</b> · ${e(tarih(h.zaman))} · ${sayi(h.sayi)} kez<br><span class="soluk">${e(h.hata)}</span></div>`).join("")}</details>` : ""}
      </section>
      <section class="blok"><div class="blok-bas"><h2>Son yönetici işlemleri</h2><a href="#/islemler" class="kucuk">Hepsi</a></div>
        ${d.islemler.length ? d.islemler.map(i => `<div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--cizgi)"><span class="etiket ${(DURUM[i.durum]||[])[1]||""}">${e((DURUM[i.durum]||[i.durum])[0])}</span><span class="kucuk" style="flex:1">${e(i.ozet || i.baslik)}</span><span class="kucuk soluk">${e(tarih(i.zaman))}</span></div>`).join("") : `<div class="bos">Portaldan henüz işlem yapılmadı.</div>`}
      </section>
    </div>`);
  document.querySelectorAll("tr[data-id]").forEach(t => t.onclick = () => location.hash = "#/secim/" + t.dataset.id);
  document.querySelectorAll("[data-git]").forEach(b => b.onclick = () => {
    const g = b.dataset.git;
    if(g === "erken") erkenSecimFormu();
    else if(g === "secimler") location.hash = "#/secimler";
    else if(g === "aday" && bos) mvAdaylikFormu(bos.secim);
    else if(g === "oy"){ const s = sec.suren[0] || sec.yaklasan[0]; if(s){ S.sekme = "oy"; location.hash = "#/secim/" + s.id; } else location.hash = "#/secimler"; }
  });
  const bd = document.getElementById("bosDuzelt"); if(bd) bd.onclick = () => mvAdaylikFormu(bos.secim);
}

/* ---------- Seçimler ---------- */
async function secimlerSayfa(){
  yukle();
  const l = await guvenli(() => rpc("yp_secimler", { p_tumu: S.tumSecimler })); if(!l) return;
  const gorunen = l.filter(s => S.tumSecimler || s.asama !== "iptal");
  sayfa(`<div class="blok-bas" style="margin-bottom:16px"><h1>Seçimler</h1>
      <div class="dugmeler"><button class="btn" id="tum">${S.tumSecimler ? "Yalnız güncel olanlar" : "Geçmiş dahil hepsi"}</button><button class="btn btn-ana" id="erken">Erken seçim ilan et</button></div></div>
    <section class="blok">${gorunen.length ? `<div class="tablo-kap"><table><thead><tr><th>Seçim</th><th>Durum</th><th>Oylama</th><th class="gizle-mobil">Sonuç</th><th class="sag">Aday</th><th class="sag">Oy</th></tr></thead><tbody>
      ${gorunen.map(s => `<tr class="tik" data-id="${s.id}"><td><b>${e(s.tur_ad)}</b><div class="kucuk soluk">${e(s.hedef_il || s.hedef_parti || s.donem)}</div></td><td>${asamaEtiket(s.asama)}</td>
        <td>${e(tarih(s.oy_bas))}–${e(saatYaz(s.oy_bit))}</td><td class="gizle-mobil">${e(tarih(s.sonuc_at))}</td><td class="sag">${sayi(s.aday)}</td><td class="sag">${sayi(s.katilim)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="bos">Gösterilecek seçim yok.</div>`}</section>`);
  document.getElementById("tum").onclick = () => { S.tumSecimler = !S.tumSecimler; secimlerSayfa(); };
  document.getElementById("erken").onclick = erkenSecimFormu;
  document.querySelectorAll("tr[data-id]").forEach(t => t.onclick = () => { S.sekme = "takvim"; location.hash = "#/secim/" + t.dataset.id; });
}

async function secimSayfa(id){
  yukle();
  const s = await guvenli(() => rpc("yp_secim", { p_id: id })); if(!s) return;
  S.secim = s;
  const acikOncesi = ["basvuru","bekliyor"].includes(s.asama), oyda = s.asama === "oy", sayimda = s.asama === "sayim";
  const sekmeler = [["takvim","Takvim"],["adaylar",`Adaylar (${s.adaylar.length})`],["oy","Oy sorunları"],["katilim","Katılım"]];
  if(s.sonuc) sekmeler.push(["sonuc","Sonuç"]);
  if(!sekmeler.some(([k]) => k === S.sekme)) S.sekme = "takvim";
  const bosT = s.bos_pusula ? s.bos_pusula.reduce((a, x) => a + x.secmen, 0) : 0;
  sayfa(`<p class="kucuk"><a href="#/secimler">Seçimler</a></p>
    <div class="blok-bas" style="margin:6px 0 14px"><div><h1>${e(s.tur_ad)}</h1><span class="alt">${e(s.hedef_il || s.hedef_parti || s.donem)} · #${s.id}</span></div>${asamaEtiket(s.asama)}</div>
    <div class="takvim">
      ${s.basvuru_bas ? `<div><span>Başvuru</span><b>${e(tarih(s.basvuru_bas))}<br>– ${e(tarih(s.basvuru_bit))}</b></div>` : ""}
      <div><span>Oylama</span><b>${e(tarih(s.oy_bas))}<br>– ${e(tarih(s.oy_bit))}</b></div>
      <div><span>Sonuç</span><b>${e(tarih(s.sonuc_at))}</b></div>
      ${s.goreve_bas ? `<div><span>Göreve başlama</span><b>${e(tarih(s.goreve_bas))}</b></div>` : ""}
      <div><span>Katılım</span><b>${sayi(s.katilim)} / ${sayi(s.secmen)} seçmen</b></div>
    </div>
    ${s.takvim_sorun ? `<div class="uyari u-hata" style="margin-top:12px"><b>Takvim tutarsız</b>${e(s.takvim_sorun)}</div>` : ""}
    ${bosT && acikOncesi ? `<div class="uyari u-dikkat" style="margin-top:12px"><b>${sayi(bosT)} seçmenin pusulası boş kalacak</b>Aday olmayan iller: ${s.bos_pusula.map(x => `${e(x.il)} (${x.secmen})`).join(", ")}.</div>` : ""}
    ${s.durum === "bekliyor" && s.asama !== "iptal" ? `<div class="dugmeler" style="margin-top:14px">
      <button class="btn" id="takvimDuz">Takvimi düzenle</button>
      ${acikOncesi ? `<button class="btn" id="simdiBas">Oylamayı şimdi başlat</button>` : ""}
      ${oyda || sayimda ? `<button class="btn" id="uzat">Süreyi uzat</button>` : ""}
      ${oyda ? `<button class="btn btn-kirmizi" id="bitir">Oylamayı şimdi bitir</button>` : ""}
      ${s.tur === "mv" && acikOncesi ? `<button class="btn btn-ana" id="mvAday">MV adaylığı</button><button class="btn" id="cbCikar">CB adaylarını MV'den çıkar</button>` : ""}
    </div>` : ""}
    <div class="sekmeler" role="tablist">${sekmeler.map(([k, a]) => `<button role="tab" aria-selected="${S.sekme === k}" data-sekme="${k}">${a}</button>`).join("")}</div>
    <div id="sekmeIc"></div>`);
  const bag = (i, f) => { const b = document.getElementById(i); if(b) b.onclick = f; };
  const yenile = () => secimSayfa(id);
  bag("takvimDuz", () => takvimFormu(s, yenile));
  bag("simdiBas", () => islemYap("secim_simdi_baslat", { secim_id: s.id }, yenile));
  bag("uzat", () => uzatFormu(s, yenile));
  bag("bitir", () => bitirFormu(s, yenile));
  bag("mvAday", () => mvAdaylikFormu(s, yenile));
  bag("cbCikar", () => islemYap("cb_adaylari_mv_den_cikar", { secim_id: s.id }, yenile));
  document.querySelectorAll("[data-sekme]").forEach(b => b.onclick = () => { S.sekme = b.dataset.sekme; document.querySelectorAll("[data-sekme]").forEach(x => x.setAttribute("aria-selected", x === b)); sekmeCiz(s, yenile); });
  sekmeCiz(s, yenile);
}

function sekmeCiz(s, yenile){
  const ic = document.getElementById("sekmeIc");
  if(S.sekme === "takvim"){
    ic.innerHTML = `<section class="blok"><div class="blok-bas"><h2>Aynı dönemdeki seçimler</h2><span class="alt">${e(s.donem)}</span></div>
      ${s.iliskili.length ? `<div class="tablo-kap"><table><thead><tr><th>Seçim</th><th>Durum</th><th>Oylama</th><th>Sonuç</th></tr></thead><tbody>
      ${s.iliskili.map(x => `<tr class="tik" data-id="${x.id}"><td>${e(x.tur_ad)}</td><td>${asamaEtiket(x.asama)}</td><td>${e(tarih(x.oy_bas))}</td><td>${e(tarih(x.sonuc_at))}</td></tr>`).join("")}</tbody></table></div>` : `<div class="bos">Bu dönemde başka seçim yok.</div>`}
      <p class="kucuk soluk" style="margin-top:10px">Takvim değişince açık telefonlar birkaç saniye içinde yeni tarihi çeker; kapalı olanlar açılınca görür.</p></section>`;
    ic.querySelectorAll("tr[data-id]").forEach(t => t.onclick = () => location.hash = "#/secim/" + t.dataset.id);
  } else if(S.sekme === "adaylar"){
    const iller = [...new Set(s.adaylar.map(a => a.il).filter(Boolean))].sort((a, b) => a.localeCompare(b, "tr"));
    const partiler = [...new Set(s.adaylar.map(a => a.parti || "Bağımsız"))].sort((a, b) => a.localeCompare(b, "tr"));
    const iptalOlur = s.durum === "bekliyor" && ["basvuru","bekliyor"].includes(s.asama) || (s.tur === "mv_on" && s.durum !== "bekliyor" && s.iliskili.some(x => x.tur === "mv" && ["basvuru","bekliyor"].includes(x.asama)));
    ic.innerHTML = `<section class="blok"><div class="blok-bas"><h2>Adaylar</h2><div class="dugmeler">
        ${iller.length ? `<select id="fIl" class="btn btn-kucuk" aria-label="İl"><option value="">Bütün iller</option>${iller.map(x => `<option>${e(x)}</option>`).join("")}</select>` : ""}
        <select id="fPa" class="btn btn-kucuk" aria-label="Parti"><option value="">Bütün partiler</option>${partiler.map(x => `<option>${e(x)}</option>`).join("")}</select>
        <button class="btn btn-kucuk" id="csv" ${s.adaylar.length ? "" : "disabled"}>Listeyi indir (CSV)</button></div></div>
      <div id="adayT"></div></section>`;
    const ciz = () => {
      const fi = (document.getElementById("fIl") || {}).value || "", fp = document.getElementById("fPa").value;
      const l = s.adaylar.filter(a => (!fi || a.il === fi) && (!fp || (a.parti || "Bağımsız") === fp));
      document.getElementById("adayT").innerHTML = l.length ? `<div class="tablo-kap"><table><thead><tr><th>Aday</th><th>Parti</th><th>İl</th><th class="sag">Sıra</th>${s.sonuc ? `<th class="sag">Oy</th>` : ""}<th></th></tr></thead><tbody>
        ${l.map(a => `<tr><td><b>${e(a.kad)}</b>${a.cb_adayi ? ` <span class="etiket e-dikkat">CB adayı</span>` : ""}</td><td>${e(a.parti || "Bağımsız")}</td><td>${e(a.il || "—")}</td><td class="sag">${a.sira ?? "—"}</td>
          ${s.sonuc ? `<td class="sag">${sayi(a.oy)}</td>` : ""}<td class="sag">${iptalOlur ? `<button class="btn btn-kucuk" data-iptal="${a.aday_id}">İptal et</button>` : ""}</td></tr>`).join("")}</tbody></table></div>`
        : `<div class="bos">Bu süzgece uyan aday yok.</div>`;
      document.querySelectorAll("[data-iptal]").forEach(b => b.onclick = () => islemYap("adaylik_iptal", { aday_id: +b.dataset.iptal }, yenile));
    };
    ["fIl","fPa"].forEach(i => { const x = document.getElementById(i); if(x) x.onchange = ciz; });
    document.getElementById("csv").onclick = () => {
      const sat = [["Aday","Parti","İl","Sıra"].concat(s.sonuc ? ["Oy"] : [])].concat(s.adaylar.map(a => [a.kad, a.parti || "Bağımsız", a.il || "", a.sira ?? ""].concat(s.sonuc ? [a.oy ?? ""] : [])));
      const csv = "﻿" + sat.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      a.download = `adaylar-${s.tur}-${s.donem}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    ciz();
  } else if(S.sekme === "oy"){
    ic.innerHTML = `<section class="blok"><div class="blok-bas"><h2>Oy kullanma sorunları</h2>
      <div class="dugmeler"><input id="tAra" class="btn btn-kucuk" placeholder="Oyuncu adı" style="min-width:150px">
      <label class="secim-kutu kucuk"><input type="checkbox" id="tHepsi"> Herkesi göster</label><button class="btn btn-kucuk btn-ana" id="tYenile">Yeniden kontrol et</button></div></div>
      <p class="kucuk soluk" style="margin-bottom:10px">Kurallar her oyuncu için sunucuda yeniden hesaplanır. Oy kullanıp kullanmadığı görünür, kime verdiği görünmez.</p><div id="tIc"><div class="yukleniyor">Kontrol ediliyor…</div></div></section>`;
    const kontrol = async () => {
      const kad = document.getElementById("tAra").value.trim() || null, hepsi = document.getElementById("tHepsi").checked;
      document.getElementById("tIc").innerHTML = `<div class="yukleniyor">Kontrol ediliyor…</div>`;
      const r = await guvenli(() => rpc("yp_oy_teshis", { p_secim: s.id, p_kad: kad, p_sadece_sorunlu: !hepsi })); if(!r) return;
      const oz = r.ozet || {};
      const bosOyuncular = r.oyuncular.filter(o => o.durum === "bos_pusula");
      document.getElementById("tIc").innerHTML = `<div class="sayilar" style="margin-bottom:12px">
          ${Object.keys(OY_D).filter(k => oz[k]).map(k => `<div class="sayi"><b>${sayi(oz[k])}</b><span>${OY_D[k][0].toLocaleLowerCase("tr")}</span></div>`).join("") || `<div class="sayi"><b>0</b><span>sorunlu oyuncu</span></div>`}</div>
        ${bosOyuncular.length && s.tur === "mv" && ["basvuru","bekliyor"].includes(s.asama) ? `<div class="uyari u-dikkat" style="margin-bottom:12px"><b>${bosOyuncular.length} oyuncunun ilinde aday yok</b>Bu oyuncular uygunsa doğrudan aday yapılabilir; böylece ilin pusulası da dolar.
          <div class="dugmeler" style="margin-top:8px"><button class="btn btn-kucuk btn-ana" id="bosAday">Bu oyuncuları aday yap</button></div></div>` : ""}
        ${r.oyuncular.length ? `<div class="tablo-kap"><table class="yigin"><thead><tr><th>Oyuncu</th><th>İl</th><th>Durum</th><th>Neden ve çözüm</th></tr></thead><tbody>
          ${r.oyuncular.map(o => `<tr><td><b>${e(o.kad)}</b>${o.cb_adayi ? ` <span class="etiket e-dikkat">CB adayı</span>` : ""}<div class="kucuk soluk">${e(o.parti || "bağımsız")}</div></td><td>${e(o.il || "—")}</td><td>${oyDurumEtiket(o.durum)}</td>
            <td class="kucuk">${o.engel ? `<div>${e(o.engel)}</div>` : ""}${o.oneri ? `<div class="soluk">${e(o.oneri)}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>`
          : `<div class="uyari u-iyi"><b>Sorun yok</b>Bütün seçmenler bu seçimde oy kullanabiliyor ya da kullandı.</div>`}
        <p class="kucuk soluk" style="margin-top:8px">Kontrol: ${e(tarih(r.kontrol_zamani, true))}</p>`;
      const ba = document.getElementById("bosAday");
      if(ba) ba.onclick = () => islemYap("mv_toplu_adaylik", { secim_id: s.id, kullanicilar: bosOyuncular.map(o => o.user_id), cb_haric: true }, () => { kontrol(); });
    };
    document.getElementById("tYenile").onclick = kontrol;
    document.getElementById("tAra").onkeydown = ev => { if(ev.key === "Enter") kontrol(); };
    document.getElementById("tHepsi").onchange = kontrol;
    kontrol();
  } else if(S.sekme === "katilim"){
    const enCok = Math.max(1, ...s.il_katilim.map(x => x.secmen));
    ic.innerHTML = `<section class="blok"><div class="blok-bas"><h2>İl bazında katılım</h2><span class="alt">${sayi(s.katilim)} oy · %${s.secmen ? (s.katilim * 100 / s.secmen).toFixed(1).replace(".", ",") : "0"}</span></div>
      ${s.il_katilim.length ? `<div class="tablo-kap"><table><thead><tr><th>İl</th><th class="sag">Oy / seçmen</th><th style="width:40%">Katılım</th></tr></thead><tbody>
      ${s.il_katilim.map(x => `<tr><td>${e(x.il)}</td><td class="sag">${sayi(x.oy)} / ${sayi(x.secmen)}</td><td><div class="cubuk" title="%${Math.round(x.oy * 100 / Math.max(1, x.secmen))}"><i style="width:${(x.oy / enCok * 100).toFixed(1)}%"></i></div></td></tr>`).join("")}
      </tbody></table></div>` : `<div class="bos">Kayıtlı seçmen yok.</div>`}
      <p class="kucuk soluk" style="margin-top:10px">Yalnız katılım sayıları gösterilir; gizli oy ilkesi gereği tercihler sonuç açıklanana kadar görünmez.</p></section>`;
  } else if(S.sekme === "sonuc"){
    const r = s.sonuc || {};
    let h = "";
    if(r.iptal) h = `<div class="uyari u-hata"><b>Bu seçim iptal edildi</b>Neden: ${e(r.iptal)}</div>`;
    else if(r.ulusal){
      h = `<div class="sayilar" style="margin-bottom:12px"><div class="sayi"><b>${sayi(r.toplam)}</b><span>geçerli oy</span></div><div class="sayi"><b>${sayi(r.dolu)}</b><span>dolan sandalye</span></div><div class="sayi"><b>${sayi(r.bos)}</b><span>boş sandalye</span></div><div class="sayi"><b>%${e(r.baraj)}</b><span>baraj${r.test_modu ? " (test modu)" : ""}</span></div></div>
        <div class="tablo-kap"><table><thead><tr><th>Parti</th><th class="sag">Oy</th><th class="sag">%</th><th>Baraj</th><th class="sag">Sandalye</th></tr></thead><tbody>
        ${r.ulusal.map(p => `<tr><td><b style="color:${e(p.renk || "inherit")}">${e(p.kisa)}</b> <span class="soluk kucuk">${e(p.ad)}</span></td><td class="sag">${sayi(p.oy)}</td><td class="sag">${String(p.yuzde).replace(".", ",")}</td><td>${p.gecti ? "Geçti" : "Kaldı"}</td><td class="sag"><b>${sayi(p.sandalye)}</b></td></tr>`).join("")}
        </tbody></table></div>`;
      if(r.bagimsizlar && r.bagimsizlar.length) h += `<h3 style="margin:14px 0 6px">Bağımsızlar</h3>${tablo(r.bagimsizlar.map(b => ({ kad: b.kad, neden: sayi(b.oy) + " oy" + (b.sandalye ? " · seçildi" : "") })))}`;
    } else if(r.adaylar){
      h = `<div class="sayilar" style="margin-bottom:12px"><div class="sayi"><b>${sayi(r.toplam ?? r.katilim)}</b><span>oy</span></div>${r.kazanan ? `<div class="sayi"><b>${e(r.kazanan.kad || "")}</b><span>kazanan</span></div>` : ""}${r.ikinci_tur ? `<div class="sayi"><b>2. tur</b><span>kimse %50'yi geçemedi</span></div>` : ""}</div>
        <div class="tablo-kap"><table><thead><tr><th>Aday</th><th>Parti</th><th class="sag">Oy</th></tr></thead><tbody>
        ${r.adaylar.map(a => `<tr><td><b>${e(a.kad)}</b></td><td>${e(a.kisa || a.parti || "Bağımsız")}</td><td class="sag">${sayi(a.oy)}</td></tr>`).join("")}</tbody></table></div>`;
    } else if(r.kazananlar){
      h = tablo(r.kazananlar.map(k => ({ kad: k.kad, parti: k.kisa || k.parti, il: k.il, neden: k.oy != null ? sayi(k.oy) + " oy" : "" })));
    } else h = `<div class="bos">Sonuç özeti: ${sayi(r.katilim)} katılım, ${sayi(r.aday)} aday.</div>`;
    ic.innerHTML = `<section class="blok"><div class="blok-bas"><h2>Sonuç</h2><span class="alt">${e(tarih(s.sonuc_at, true))}</span></div>${h}</section>`;
  }
}

/* ---------- Formlar ---------- */
function takvimFormu(s, sonra){
  const alanlar = (s.basvuru_bas || ["mv_on","bel_on","kurultay","cb_on","cb"].includes(s.tur) ? ["basvuru_bas","basvuru_bit"] : []).concat(["oy_bas","oy_bit","sonuc_at"]).concat(s.goreve_bas ? ["goreve_bas"] : []);
  const p = pencere("Takvimi düzenle", `<form class="form" id="tf">
    <p class="kucuk soluk">Saatler Türkiye saatidir. Ön seçim, asıl seçimin oylamasından önce sonuçlanmalı; portal bunu kontrol eder.</p>
    <div class="izgara iz-2">${alanlar.map(k => `<div class="alan"><label for="t_${k}">${ALAN[k]}</label><input type="datetime-local" id="t_${k}" value="${yerelGirdi(s[k])}"></div>`).join("")}</div>
    <label class="secim-kutu"><input type="checkbox" id="tDuyur" checked><span>Bütün oyunculara takvim bildirimi gönder</span></label></form>`,
    `<button class="btn" data-kapat>Vazgeç</button><button class="btn btn-ana" id="tGit">Ön izleme</button>`);
  p.q("#tGit").onclick = () => {
    const param = { secim_id: s.id, duyur: p.q("#tDuyur").checked };
    for(const k of alanlar){ const v = p.q("#t_" + k).value; if(yerelGirdi(s[k]) !== v) param[k] = girdidenISO(v); }
    p.kapat(true); islemYap("secim_takvim", param, sonra);
  };
}

function mvAdaylikFormu(s, sonra){
  const so = S.sozluk || { iller: [], partiler: [] };
  const p = pencere("Milletvekili adaylığı", `<div class="form">
    <p><b>${e(s.tur_ad)}</b> · oylama ${e(tarih(s.oy_bas))}</p>
    <p class="kucuk soluk">Uygun oyuncular kendi il ve partisinden aday yapılır; partisiz olanlar bağımsız aday olur. Ön izlemede kimin neden dahil edilmediğini görürsün.</p>
    <div class="izgara iz-2">
      <div class="alan"><label for="mIl">İl</label><select id="mIl"><option value="">Bütün iller</option>${so.iller.map(i => `<option value="${i.id}">${e(i.ad)}</option>`).join("")}</select></div>
      <div class="alan"><label for="mPa">Parti</label><select id="mPa"><option value="">Bütün partiler</option>${so.partiler.map(x => `<option value="${x.id}">${e(x.kisa)}</option>`).join("")}</select></div>
    </div>
    <div class="alan"><label for="mOy">Tek oyuncu (isteğe bağlı)</label><input id="mOy" placeholder="Kullanıcı adı yaz; boş bırakırsan filtreye uyan herkes"><small id="mOyB"></small></div>
    <label class="secim-kutu"><input type="checkbox" id="mCb" checked><span>Cumhurbaşkanı adaylarını hariç tut</span></label>
    <label class="secim-kutu"><input type="checkbox" id="mBg" checked><span>Partisiz oyuncuları bağımsız aday yap</span></label></div>`,
    `<button class="btn" data-kapat>Vazgeç</button><button class="btn btn-ana" id="mGit">Ön izleme</button>`);
  p.q("#mGit").onclick = async () => {
    const param = { secim_id: s.id, cb_haric: p.q("#mCb").checked, bagimsiz_dahil: p.q("#mBg").checked };
    if(p.q("#mIl").value) param.il_id = +p.q("#mIl").value;
    if(p.q("#mPa").value) param.parti_id = +p.q("#mPa").value;
    const kad = p.q("#mOy").value.trim();
    if(kad){
      const l = await guvenli(() => rpc("yp_oyuncu_ara", { p_ara: kad, p_limit: 5 })); if(!l) return;
      const t = l.find(x => x.kad.toLocaleLowerCase("tr") === kad.toLocaleLowerCase("tr")) || (l.length === 1 ? l[0] : null);
      if(!t){ p.q("#mOyB").textContent = l.length ? "Birden çok oyuncu eşleşti: " + l.map(x => x.kad).join(", ") : "Bu adla oyuncu yok."; return; }
      param.kullanicilar = [t.user_id];
    }
    p.kapat(true); islemYap("mv_toplu_adaylik", param, sonra);
  };
}

const TOPLU_IS = ["oyuncu_para", "oyuncu_kidem", "oyuncu_bildirim", "sustur", "hesap_engelle", "engel_kaldir"];

function islemFormu(islem, hedef, hedefAd, sonra, on){
  const d = IS[islem];
  const p = pencere(d.ad, `<div class="form"><p class="kucuk soluk">${e(d.aciklama)}</p>
    <div class="uyari u-bilgi"><b>Hedef</b>${e(hedefAd)}</div>${d.form(on || {})}<div id="fHata"></div></div>`,
    `<button class="btn" data-kapat>Vazgeç</button><button class="btn btn-ana" id="fGit">Ön izleme</button>`);
  if(d.bagla) d.bagla(p.q);
  const ilk = p.el.querySelector(".pencere-govde input, .pencere-govde select, .pencere-govde textarea"); if(ilk) ilk.focus();
  p.q("#fGit").onclick = () => {
    const r = d.oku(p.q);
    if(typeof r === "string"){ p.q("#fHata").innerHTML = `<div class="uyari u-hata">${e(r)}</div>`; return; }
    p.kapat(true); islemYap(islem, Object.assign({}, hedef, r), sonra);
  };
}

/* ---------- Oyuncular ---------- */
S.secili = new Map(); // user_id → kad
S.of = { ara: "", il_id: "", parti_id: "", durum: "tum", sira: "kad", sayfa: 0 };
const DURUM_SEC = [["tum","Hepsi"],["herkes","Engelli olmayanlar"],["cevrimici","Çevrimiçi (15 dk)"],["aktif","Son 7 günde aktif"],["pasif","7 gündür girmeyen"],["yeni","Yeni (3 gün)"],["makamli","Görevi olanlar"],["susturulmus","Susturulmuş"],["engelli","Engelli"]];
function oyuncuEtiketleri(o){
  return [o.yonetici ? `<span class="etiket e-basvuru">Yönetici</span>` : "", o.yasakli ? `<span class="etiket e-hata">Engelli</span>` : "",
    o.susturma_bitis ? `<span class="etiket e-dikkat">Susturulmuş</span>` : "", o.cevrimici ? `<span class="etiket e-oy">Çevrimiçi</span>` : ""].join(" ");
}
function filtreAlanlari(f, kimlik, topluMu){
  const so = sozluk();
  return `<div class="filtreler">
    <div class="alan"><label for="${kimlik}Ara">Ad</label><input id="${kimlik}Ara" type="search" value="${e(f.ara || "")}" placeholder="Kullanıcı adında ara"></div>
    <div class="alan"><label for="${kimlik}Il">İl</label><select id="${kimlik}Il"><option value="">Bütün iller</option>${secenek(so.iller, "id", "ad")}</select></div>
    <div class="alan"><label for="${kimlik}Pa">Parti</label><select id="${kimlik}Pa"><option value="">Bütün partiler</option><option value="0">Bağımsızlar</option>${secenek(so.partiler, "id", "kisa")}</select></div>
    <div class="alan"><label for="${kimlik}Du">Durum</label><select id="${kimlik}Du">${DURUM_SEC.filter(([k]) => !topluMu || k !== "tum").map(([k, a]) => `<option value="${k}">${a}</option>`).join("")}</select></div>
    ${topluMu ? "" : `<div class="alan"><label for="${kimlik}Si">Sırala</label><select id="${kimlik}Si"><option value="kad">Ada göre</option><option value="para">Paraya göre</option><option value="kidem">Kıdeme göre</option><option value="son_gorulme">Son görülmeye göre</option><option value="olusturma">Kayıt tarihine göre</option></select></div>`}
  </div>`;
}
function filtreOku(kimlik, f){
  const v = id => (document.getElementById(kimlik + id) || {}).value;
  f.ara = (v("Ara") || "").trim(); f.il_id = v("Il") || ""; f.parti_id = v("Pa") ?? ""; f.durum = v("Du") || f.durum; if(v("Si")) f.sira = v("Si");
  return f;
}
function filtreYaz(kimlik, f){
  const k = (id, val) => { const x = document.getElementById(kimlik + id); if(x && val != null) x.value = val; };
  k("Il", f.il_id); k("Pa", f.parti_id); k("Du", f.durum); k("Si", f.sira);
}
const filtreJson = f => { const o = {}; for(const k of ["ara", "il_id", "parti_id", "durum"]) if(f[k] !== "" && f[k] != null) o[k] = String(f[k]); return o; };

async function oyuncularSayfa(){
  if(!document.getElementById("oyTablo")){
    sayfa(`<div class="blok-bas" style="margin-bottom:12px"><h1>Oyuncular</h1><span class="alt" id="oySay"></span></div>
      <section class="blok">${filtreAlanlari(S.of, "of", false)}<div id="oyTablo"><div class="yukleniyor">Yükleniyor…</div></div></section>
      <div id="seciliCubuk"></div>`);
    filtreYaz("of", S.of);
    let z;
    const tetik = () => { clearTimeout(z); z = setTimeout(() => { filtreOku("of", S.of); S.of.sayfa = 0; oyuncuListesi(); }, 250); };
    document.querySelectorAll(".filtreler input, .filtreler select").forEach(x => { x.oninput = tetik; x.onchange = tetik; });
  }
  seciliCubuk();
  return oyuncuListesi();
}
async function oyuncuListesi(){
  const kap = document.getElementById("oyTablo"); if(!kap) return;
  const f = S.of;

    : `<div class="bos">Filtreye uyan oyuncu yok.</div>`;

/* ---------- Canlı ayarlar ---------- */
S.ayarTaslak = new Map(); // anahtar → yeni değer
S.ayarGrup = S.ayarGrup || "tumu";
const RISK_ETIKET = { yuksek: ["Yüksek risk", "e-hata"], orta: ["Orta risk", "e-dikkat"], dusuk: ["", ""] };
const ayarSinir = a => a.tur === "metin" ? `en fazla ${a.en_uzun || 500} karakter`
  : a.tur === "evet_hayir" ? "" : [a.en_az, a.en_cok].every(x => x != null) ? `${sayi(a.en_az)} – ${sayi(a.en_cok)}${a.birim ? " " + a.birim : ""}` : "";
function ayarGirdi(a){
  const t = S.ayarTaslak.has(a.anahtar) ? S.ayarTaslak.get(a.anahtar) : a.deger;
  const id = "ay_" + a.anahtar.replace(/[^a-z0-9]/gi, "_");
  if(a.tur === "evet_hayir") return `<label class="secim-kutu"><input type="checkbox" id="${id}" data-ayar="${e(a.anahtar)}" ${t === true ? "checked" : ""}><span>${t === true ? "Açık" : "Kapalı"}</span></label>`;
  if(a.tur === "metin") return (a.en_uzun || 0) > 150
    ? `<textarea id="${id}" data-ayar="${e(a.anahtar)}" rows="2" maxlength="${a.en_uzun || 500}" aria-label="${e(a.baslik)}">${e(t ?? "")}</textarea>`
    : `<input id="${id}" data-ayar="${e(a.anahtar)}" maxlength="${a.en_uzun || 500}" value="${e(t ?? "")}" aria-label="${e(a.baslik)}">`;
  return `<div class="ayar-sayi"><input id="${id}" data-ayar="${e(a.anahtar)}" inputmode="decimal" value="${e(t ?? "")}" aria-label="${e(a.baslik)}">${a.birim ? `<span>${e(a.birim)}</span>` : ""}</div>`;
}
function ayarDegerOku(a, el){
  if(a.tur === "evet_hayir") return el.checked;
  if(a.tur === "metin") return el.value.trim();
  const v = el.value.trim().replace(/\s/g, "").replace(a.tur === "para" ? /\./g : /(?!)/, "").replace(",", ".");
  return v === "" ? null : (isNaN(+v) ? v : +v);
}
const ayarAyni = (a, x, y) => a.tur === "metin" ? String(x ?? "") === String(y ?? "") : a.tur === "evet_hayir" ? !!x === !!y : Number(x) === Number(y);

async function ayarlarSayfa(){
  yukle();
  const d = await guvenli(() => rpc("yp_ayarlar"));
  if(!d) return;
  S.ayarVeri = d;
  for(const [k, v] of [...S.ayarTaslak]){ const a = d.ayarlar.find(x => x.anahtar === k); if(!a || ayarAyni(a, a.deger, v)) S.ayarTaslak.delete(k); }
  sayfa(`<div class="blok-bas" style="margin-bottom:12px"><h1>Canlı ayarlar</h1><span class="alt">Uygulama güncellemesi gerekmez · açık telefonlara 0–8 sn içinde yansır</span></div>
    ${d.planlar.length ? `<section class="blok"><div class="blok-bas"><h2>Planlı değişiklikler</h2><span class="alt">${sayi(d.planlar.length)} bekliyor</span></div>
      <div class="tablo-kap"><table><thead><tr><th>Zaman</th><th>Ne olacak</th><th>Ayarlar</th><th class="gizle-mobil">Neden</th><th></th></tr></thead><tbody>
      ${d.planlar.map(p => `<tr><td>${e(tarih(p.zaman))}</td><td>${p.tur === "uygula" ? `<span class="etiket e-basvuru">Uygulanacak</span>` : `<span class="etiket e-dikkat">Eski değere dönecek</span>`}</td>
        <td class="kucuk">${(p.ayarlar || []).map(x => e(x.ad) + (x.deger ? ` → <b>${e(x.deger)}</b>` : "")).join("<br>")}</td>
        <td class="gizle-mobil kucuk">${e(p.neden || "")}</td>
        <td class="sag"><button class="btn btn-kucuk" data-plan-iptal="${e(p.islem_id)}">İptal / geri al</button></td></tr>`).join("")}
      </tbody></table></div></section>` : ""}
    <section class="blok">
      <div class="filtreler" style="grid-template-columns:minmax(160px,2fr) minmax(160px,1fr)">
        <div class="alan"><label for="ayAra">Ayar ara</label><input id="ayAra" type="search" placeholder="ör. baraj, maaş, bakım" value="${e(S.ayarAra || "")}"></div>
        <div class="alan"><label for="ayGrup">Grup</label><select id="ayGrup"><option value="tumu">Bütün gruplar</option>${d.gruplar.map(g => `<option value="${g.kod}">${e(g.ad)}</option>`).join("")}</select></div>
      </div>
      <div id="ayListe"></div>
    </section>
    <section class="blok"><div class="blok-bas"><h2>Son değişiklikler</h2><button class="btn btn-kucuk" id="ayTumGecmis">Tümünü göster</button></div><div id="ayGecmis"><div class="yukleniyor">Yükleniyor…</div></div></section>
    <div id="ayCubuk"></div>`);
  document.getElementById("ayGrup").value = S.ayarGrup;
  document.getElementById("ayGrup").onchange = ev => { S.ayarGrup = ev.target.value; ayarListe(); };
  document.getElementById("ayAra").oninput = ev => { S.ayarAra = ev.target.value; ayarListe(); };
  document.querySelectorAll("[data-plan-iptal]").forEach(b => b.onclick = () => islemYap("geri_al", { islem_id: +b.dataset.planIptal }, () => ayarlarSayfa()));
  document.getElementById("ayTumGecmis").onclick = () => ayarGecmisPencere(null, "Ayar değişiklik geçmişi");
  ayarListe(); ayarCubuk();
  const g = await guvenli(() => rpc("yp_ayar_gecmis", { p_anahtar: null, p_limit: 8 }));
  const k = document.getElementById("ayGecmis");
  if(k) k.innerHTML = g ? ayarGecmisTablo(g) : "";
}
function ayarListe(){
  const d = S.ayarVeri, k = document.getElementById("ayListe"); if(!d || !k) return;
  const ara = (S.ayarAra || "").toLocaleLowerCase("tr").trim();
  const l = d.ayarlar.filter(a => (S.ayarGrup === "tumu" || a.grup === S.ayarGrup)
    && (!ara || (a.baslik + " " + a.aciklama).toLocaleLowerCase("tr").includes(ara)));
  if(!l.length){ k.innerHTML = `<div class="bos">Aramaya uyan ayar yok.</div>`; return; }
  const gruplar = d.gruplar.filter(g => l.some(a => a.grup === g.kod));
  k.innerHTML = gruplar.map(g => `<h3 class="ayar-grup">${e(g.ad)}</h3><div class="ayar-liste">${l.filter(a => a.grup === g.kod).map(a => {
      const r = RISK_ETIKET[a.risk] || ["", ""], degisti = S.ayarTaslak.has(a.anahtar);
      return `<div class="ayar${degisti ? " degisti" : ""}" data-satir="${e(a.anahtar)}">
        <div class="ayar-bilgi"><b>${e(a.baslik)}</b> ${r[0] ? `<span class="etiket ${r[1]}">${r[0]}</span>` : ""} ${a.planli ? `<span class="etiket e-basvuru">Planlı</span>` : ""}
          <p>${e(a.aciklama)}</p>
          <div class="kucuk soluk">Şu an: <b>${e(a.deger_metin)}</b>${ayarSinir(a) ? ` · aralık ${e(ayarSinir(a))}` : ""} · ${e(a.etki)}
            ${a.son ? ` · son değişiklik ${e(tarih(a.son.zaman))}${a.son.kad ? " (" + e(a.son.kad) + ")" : ""}` : ""}
            · <a href="#" data-gecmis="${e(a.anahtar)}">geçmiş</a></div></div>
        <div class="ayar-girdi">${ayarGirdi(a)}</div></div>`; }).join("")}</div>`).join("");
  k.querySelectorAll("[data-ayar]").forEach(el => {
    const a = d.ayarlar.find(x => x.anahtar === el.dataset.ayar);
    const f = () => {
      const v = ayarDegerOku(a, el);
      if(a.tur === "evet_hayir") el.nextElementSibling.textContent = v ? "Açık" : "Kapalı";
      ayarAyni(a, a.deger, v) ? S.ayarTaslak.delete(a.anahtar) : S.ayarTaslak.set(a.anahtar, v);
      el.closest(".ayar").classList.toggle("degisti", S.ayarTaslak.has(a.anahtar));
      ayarCubuk();
    };
    el.oninput = f; el.onchange = f;
  });
  k.querySelectorAll("[data-gecmis]").forEach(x => x.onclick = ev => { ev.preventDefault(); const a = d.ayarlar.find(y => y.anahtar === x.dataset.gecmis); ayarGecmisPencere(a.anahtar, a.baslik); });
}
function ayarCubuk(){
  const k = document.getElementById("ayCubuk"); if(!k) return;
  if(!S.ayarTaslak.size){ k.innerHTML = ""; return; }
  // Var olan çubuğu yeniden çizme: girdinin "change" olayı düğmeye tıklarken tetiklenir, tıklama kaybolmasın
  const var_ = k.querySelector(".secili-cubuk b");
  if(var_){ var_.textContent = `${sayi(S.ayarTaslak.size)} ayar değişti`; return; }
  k.innerHTML = `<div class="secili-cubuk" role="region" aria-label="Kaydedilmemiş ayarlar"><b>${sayi(S.ayarTaslak.size)} ayar değişti</b>
    <button class="btn" id="ayVazgec">Vazgeç</button><button class="btn" id="ayDevam" style="background:var(--kagit);color:var(--murekkep)">Devam et</button></div>`;
  k.querySelector("#ayVazgec").onclick = () => { S.ayarTaslak.clear(); ayarListe(); ayarCubuk(); };
  k.querySelector("#ayDevam").onclick = ayarKaydetPencere;
}
function ayarKaydetPencere(){
  const d = S.ayarVeri;
  const l = [...S.ayarTaslak].map(([k, v]) => ({ a: d.ayarlar.find(x => x.anahtar === k), v }));
  const yerel = dt => { const z = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); };
  const p = pencere("Ayar değişikliği", `<div class="form">
      <div class="tablo-kap"><table><thead><tr><th>Ayar</th><th>Şimdi</th><th>Yeni</th></tr></thead><tbody>
        ${l.map(({ a, v }) => `<tr><td>${e(a.baslik)}${a.risk === "yuksek" ? ` <span class="etiket e-hata">Yüksek risk</span>` : ""}</td><td class="soluk">${e(a.deger_metin)}</td>
          <td><b>${e(a.tur === "evet_hayir" ? (v ? "Açık" : "Kapalı") : a.tur === "metin" ? (v || "(boş)") : String(v ?? "—") + (a.birim ? " " + a.birim : ""))}</b></td></tr>`).join("")}
      </tbody></table></div>
      <div class="alan"><label for="ayNeden">Neden</label><input id="ayNeden" maxlength="300" placeholder="ör. Hafta sonu etkinliği — geçmişte görünür"></div>
      <div class="alan"><label for="ayZaman">Ne zaman?</label><select id="ayZaman"><option value="hemen">Hemen</option><option value="ileri">İleri bir tarihte</option></select></div>
      <div class="alan gizli" id="ayBasA"><label for="ayBas">Başlangıç</label><input id="ayBas" type="datetime-local" value="${yerel(new Date(Date.now() + 3600e3))}"></div>
      <label class="secim-kutu"><input type="checkbox" id="aySureli"><span>Süreli: belirli bir zamanda eski değerlerine dönsün</span></label>
      <div class="alan gizli" id="ayBitA"><label for="ayBit">Eski değere dönüş</label><input id="ayBit" type="datetime-local" value="${yerel(new Date(Date.now() + 2 * 86400e3))}"></div>
      <div id="ayHata"></div></div>`,
    `<button class="btn" data-kapat>Vazgeç</button><button class="btn btn-ana" id="ayOn">Ön izleme</button>`);
  p.q("#ayZaman").onchange = () => p.q("#ayBasA").classList.toggle("gizli", p.q("#ayZaman").value !== "ileri");
  p.q("#aySureli").onchange = () => p.q("#ayBitA").classList.toggle("gizli", !p.q("#aySureli").checked);
  p.q("#ayNeden").focus();
  p.q("#ayOn").onclick = () => {
    const neden = p.q("#ayNeden").value.trim();
    const hata = m => { p.q("#ayHata").innerHTML = `<div class="uyari u-hata">${e(m)}</div>`; };
    if(neden.length < 3) return hata("Nedeni yaz (en az 3 karakter).");
    const param = { degisiklikler: l.map(({ a, v }) => ({ anahtar: a.anahtar, deger: v })), neden };
    if(p.q("#ayZaman").value === "ileri"){ const b = new Date(p.q("#ayBas").value); if(isNaN(b)) return hata("Başlangıç zamanını seç."); param.baslangic = b.toISOString(); }
    if(p.q("#aySureli").checked){ const b = new Date(p.q("#ayBit").value); if(isNaN(b)) return hata("Dönüş zamanını seç."); param.bitis = b.toISOString(); }
    p.kapat(true);
    islemYap("ayar_degistir", param, () => { S.ayarTaslak.clear(); ayarlarSayfa(); });
  };
}
const KAYNAK_AD = { portal: "Portal", plan: "Plan (zamanlayıcı)", plan_bitis: "Süre bitti", geri_al: "Geri alma" };
function ayarGecmisTablo(g, tekAyar){

async function ayarGecmisPencere(anahtar, baslik){

async function kurumListe(tur){

    `<button class="btn btn-ana" data-kapat>Kapat</button>`);
  const ciz = async ara => {
    const l = await guvenli(() => tur === "sirket" ? rpc("yp_sirketler", { p_ara: ara || null, p_limit: 100 }) : rpc("yp_dernekler")); if(!l) return;
    p.q("#kListe").innerHTML = l.length ? `<div class="tablo-kap"><table><thead><tr><th>${tur === "sirket" ? "Şirket" : "Dernek"}</th><th class="gizle-mobil">${tur === "sirket" ? "Kurucu" : "Başkan"}</th><th class="sag">Kasa</th><th></th></tr></thead><tbody>
      ${l.map(x => `<tr><td><b>${e(x.ad)}</b>${x.sektor ? `<div class="kucuk soluk">${e(x.sektor)}${x.aktif === false ? " · kapalı" : ""}</div>` : x.kapali ? `<div class="kucuk soluk">kapalı</div>` : ""}</td>
        <td class="gizle-mobil">${e(x.kurucu || x.baskan || "—")}</td><td class="sag tutar">${e(tl(x.kasa))}</td>
        <td class="sag"><button class="btn btn-kucuk" data-k="${x.id}" data-ad="${e(x.ad)}" data-kasa="${e(tl(x.kasa))}">Kasa</button></td></tr>`).join("")}</tbody></table></div>` : `<div class="bos">Kayıt yok.</div>`;
    p.q("#kListe").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { p.kapat(true); kasaDuzelt(tur, b.dataset.k, b.dataset.ad + (tur === "sirket" ? " şirket kasası" : " dernek kasası"), b.dataset.kasa, () => kurumListe(tur)); });
  };
  const a = p.q("#kAra"); if(a){ let z; a.oninput = () => { clearTimeout(z); z = setTimeout(() => ciz(a.value.trim()), 300); }; }
  ciz("");
}

function pushDurumHtml(pu){
  const calisiyor = pu.aktif && pu.adres_var && pu.cihaz > 0;
  if(calisiyor) return `<div class="uyari u-iyi"><b>Telefon bildirimi (push) çalışıyor</b>${sayi(pu.cihaz)} kayıtlı cihaz (${sayi(pu.cihaz_7g)} tanesi son 7 günde güncel) · kuyrukta ${sayi(pu.bekleyen)} bildirim${pu.son_gonderim ? ` · son gönderim ${e(tarih(pu.son_gonderim))}` : ""}.</div>`;
  return `<div class="uyari u-dikkat"><b>Telefon bildirimi (push) şu an çalışmıyor</b>
    Kayıtlı cihaz: ${sayi(pu.cihaz)} · gönderim ${pu.aktif ? "açık" : "kapalı"} · gönderim adresi ${pu.adres_var ? "tanımlı" : "tanımlı değil"}.
    Duyurular oyun içinde (bildirim kutusu, haber akışı, duyuru bandı) görünür; telefona kilit ekranı bildirimi olarak düşmez.
    Açmak için Firebase / Apple bildirim anahtarları ve uygulamanın bu özelliği içeren yeni bir mağaza sürümü gerekir; portaldan açılamaz.</div>`;
}

      <section class="blok"><div class="blok-bas"><h2>Planlı duyurular</h2><span class="alt">${sayi(bekleyen.length)} bekliyor</span></div>
        ${tablo3(d.planlar.slice(0, 12), [[r => `<b>${e(tarih(r.zaman))}</b><div class="kucuk soluk">${e(r.hedef)}</div>`, "Zaman"],

      ${tablo3(d.arsiv, [[r => `<span class="kucuk">${e(tarih(r.zaman))}</span>${r.gelecek ? ` <span class="etiket e-basvuru">İleri tarihli</span>` : ""}`, "Zaman"],
        [r => `${e(r.metin)}<div class="kucuk soluk">${e(r.hedef)} · ${sayi(r.kitle)} oyuncu${r.gonderen ? " · " + e(r.gonderen) : ""}</div>`, "Duyuru"],

  document.getElementById("dYeni").onclick = () => duyuruFormu(yenile);

function duyuruFormu(sonra){
  const so = sozluk();
  const p = pencere("Yeni duyuru", `<div class="form">
      <div class="alan"><label for="dMetin">Duyuru metni</label><textarea id="dMetin" rows="5" maxlength="600" placeholder="ör. Bu akşam 21.00'de genel seçim oylaması başlıyor."></textarea><small data-sayac></small></div>
      <fieldset class="alan" style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:6px">Nerede görünsün?</legend>
        <label class="secim-kutu"><input type="checkbox" id="dKutu" checked><span><b>Bildirim kutusu</b> · “Oyun Yönetimi” imzasıyla, hedefe uyan oyunculara</span></label>
        <label class="secim-kutu" style="margin-top:6px"><input type="checkbox" id="dHaber"><span><b>Haber akışı</b> · “duyuru” olarak</span></label></fieldset>
      <div class="izgara iz-2"><div class="alan"><label for="dIl">Hedef il</label><select id="dIl"><option value="">Bütün Türkiye</option>${secenek(so.iller, "id", "ad")}</select></div>
        <div class="alan"><label for="dPa">Hedef parti</label><select id="dPa"><option value="">Bütün partiler</option>${secenek(so.partiler, "id", "kisa")}</select></div></div>
      <div class="alan"><label for="dZa">Ne zaman?</label><select id="dZa"><option value="hemen">Hemen</option><option value="ileri">İleri bir tarihte</option></select></div>
      <div class="alan gizli" id="dTarA"><label for="dTar">Gönderim zamanı (Türkiye saati)</label><input id="dTar" type="datetime-local" value="${yerelGirdi(new Date(Date.now() + 3600e3))}"><small>En erken 2 dakika, en geç 30 gün sonrası.</small></div>
      <p class="kucuk soluk">Çevrimiçi, aktif ya da tek tek seçilmiş oyunculara göndermek için <a href="#/toplu">Toplu işlem › Bildirim gönder</a>.</p>
      <div id="dHata"></div></div>`,
    `<button class="btn" data-kapat>Vazgeç</button><button class="btn btn-ana" id="dOn">Ön izleme</button>`);
  sayac(p.q("#dMetin"), 600); p.q("#dMetin").focus();
  p.q("#dZa").onchange = () => p.q("#dTarA").classList.toggle("gizli", p.q("#dZa").value !== "ileri");
  p.q("#dOn").onclick = () => {
    const hata = m => { p.q("#dHata").innerHTML = `<div class="uyari u-hata">${e(m)}</div>`; };
    const metin = p.q("#dMetin").value.trim();
    if(metin.length < 3) return hata("Duyuru metnini yaz (en az 3 karakter).");
    const kanallar = [p.q("#dKutu").checked && "kutu", p.q("#dHaber").checked && "haber"].filter(Boolean);
    if(!kanallar.length) return hata("En az bir yer seç: bildirim kutusu ya da haber akışı.");
    const param = { metin, kanallar };
    if(p.q("#dIl").value) param.hedef_il = +p.q("#dIl").value;
    if(p.q("#dPa").value) param.hedef_parti = +p.q("#dPa").value;
    if(p.q("#dZa").value === "ileri"){ const v = p.q("#dTar").value; if(!v) return hata("Gönderim zamanını seç."); param.zaman = girdidenISO(v); }
    p.kapat(true); islemYap("duyuru_yayinla", param, sonra);
  };
}
function bantFormu(simdi, sonra){
  const p = pencere("Duyuru bandı", `<div class="form">
      <p class="kucuk soluk">Uygulamanın üstünde herkese görünen tek satırlık duyuru. Telefonlara 0–8 saniye içinde yansır. Boş bırakılırsa bant kalkar.</p>
      <div class="alan"><label for="bMetin">Bant metni</label><input id="bMetin" maxlength="200" value="${e(simdi || "")}"><small data-sayac></small></div>
      <div class="alan"><label for="bSure">Otomatik kaldır</label><select id="bSure"><option value="">Kaldırma (ben değiştirene kadar)</option>
        <option value="1">1 saat sonra</option><option value="6">6 saat sonra</option><option value="24">24 saat sonra</option><option value="72">3 gün sonra</option><option value="168">7 gün sonra</option></select>
        <small>Süre dolunca bant eski hâline döner (değiştirilmemişse).</small></div>
      <div class="alan"><label for="bNeden">Neden</label><input id="bNeden" maxlength="300" placeholder="ör. Bakım duyurusu — ayar geçmişinde görünür"></div>
      <div id="bHata"></div></div>`,
    `${simdi ? `<button class="btn btn-kirmizi" id="bKaldir">Bandı kaldır</button>` : ""}<button class="btn" data-kapat>Vazgeç</button><button class="btn btn-ana" id="bOn">Ön izleme</button>`);
  sayac(p.q("#bMetin"), 200); p.q("#bMetin").focus();
  const git = metin => {
    const neden = p.q("#bNeden").value.trim();
    if(neden.length < 3){ p.q("#bHata").innerHTML = `<div class="uyari u-hata">Nedeni yaz (en az 3 karakter).</div>`; return; }
    const param = { degisiklikler: [{ anahtar: "uygulama.duyuru_bandi", deger: metin }], neden };
    const s = p.q("#bSure").value; if(s && metin) param.bitis = new Date(Date.now() + s * 3600e3).toISOString();
    p.kapat(true); islemYap("ayar_degistir", param, sonra);
  };
  p.q("#bOn").onclick = () => git(p.q("#bMetin").value.trim());
  const k = p.q("#bKaldir"); if(k) k.onclick = () => git("");
}

function olayFormu(tur, sonra){
  const d = S.olay;
  const sab = tur === "ulusal" ? d.ulusal_sablon : tur === "ulke" ? d.ulke_sablon : d.belediye_sablon;
  const baslik = { ulusal: "Ulusal kriz başlat", ulke: "Ülke krizi başlat", belediye: "Belediye krizi başlat" }[tur];
  const iller = tur === "belediye" ? d.iller.filter(i => i.baskan) : d.iller;
  const p = pencere(baslik, `<div class="form">
      <div class="alan"><label for="oKod">Kriz türü</label><select id="oKod"><option value="">Seç</option>${sab.map(s => `<option value="${e(s.kod)}">${e(s.baslik)}${s.kapsam ? (s.kapsam === "il" ? " · bir ilde" : " · ülke çapında") : ""}${tur === "belediye" && !s.mevsiminde ? " · mevsim dışı" : ""}</option>`).join("")}</select></div>
      <div id="oBilgi"></div>
      <div class="alan gizli" id="oIlA"><label for="oIl">İl</label><select id="oIl"><option value="">Seç</option>${iller.map(i => `<option value="${i.id}" ${i.acik_kriz && tur === "belediye" ? "disabled" : ""}>${e(i.ad)}${tur === "belediye" ? ` · ${e(i.baskan)}${i.acik_kriz ? " · açık krizi var" : ""}` : ` · ${sayi(i.nufus)} oyuncu`}</option>`).join("")}</select>
        ${tur === "belediye" ? `<small>Yalnız görevde belediye başkanı olan iller listelenir (${sayi(iller.length)} il).</small>` : ""}</div>
      <div id="oHata"></div></div>`,
    `<button class="btn" data-kapat>Vazgeç</button><button class="btn btn-ana" id="oOn">Ön izleme</button>`);
  const goster = () => {
    const s = sab.find(x => x.kod === p.q("#oKod").value);
    p.q("#oIlA").classList.toggle("gizli", !(tur === "belediye" || (s && s.kapsam === "il")));
    if(!s){ p.q("#oBilgi").innerHTML = ""; return; }
    const ek = tur === "ulusal" ? [s.kategori, s.bakanlik, s.il_havuzu && s.il_havuzu.length ? "olağan iller: " + s.il_havuzu.slice(0, 6).join(", ") : ""]
      : tur === "ulke" ? [s.kategori, s.bakanlik, s.sektor ? "sektör: " + s.sektor : "", sayi(s.secenek) + " seçenek"] : [sayi(s.secenek) + " seçenek", s.mevsiminde ? "" : "bu ay normalde çıkmaz"];
    p.q("#oBilgi").innerHTML = `<div class="uyari u-bilgi"><b>${e(s.baslik)}</b>${e(s.aciklama || s.metin || "")}<div class="kucuk soluk" style="margin-top:4px">${e(ek.filter(Boolean).join(" · "))}</div></div>`;
  };
  p.q("#oKod").onchange = goster; goster();
  p.q("#oOn").onclick = () => {
    const kod = p.q("#oKod").value, il = p.q("#oIl").value;
    if(!kod){ p.q("#oHata").innerHTML = `<div class="uyari u-hata">Kriz türünü seç.</div>`; return; }
    const param = { tur, kod }; if(il && !p.q("#oIlA").classList.contains("gizli")) param.il_id = +il;
    p.kapat(true); islemYap("olay_baslat", param, sonra);
  };
}

async function asistanGecmis(){
  const p = pencere("Asistan geçmişi", `<div class="yukleniyor">Yükleniyor…</div>`, `<button class="btn btn-ana" data-kapat>Kapat</button>`);
  const l = await guvenli(() => rpc("yp_asistan_gecmis", { p_limit: 50 })); if(!l){ p.kapat(true); return; }
  p.govde(l.length ? l.map(k => `<div class="gecmis-kayit"><div class="kucuk soluk">${e(tarih(k.zaman, true))} · ${e(k.kad || "")}${k.model ? " · " + e(k.model) : ""}${k.girdi_token ? ` · ${sayi(k.girdi_token + (k.cikti_token || 0))} token` : ""}</div>
      <p><b>${e(k.soru)}</b></p>${k.yanit ? `<p class="kucuk">${asistanMetin(k.yanit)}</p>` : ""}${k.hata ? `<p class="kucuk" style="color:var(--muhur)">${e(k.hata)}</p>` : ""}
      ${k.onizlemeler && k.onizlemeler.length ? `<p class="kucuk">Hazırlanan ön izleme: ${k.onizlemeler.map(o => `#${e(o.islem_id)} ${e(o.ozet || o.islem)}`).join("; ")}</p>` : ""}</div>`).join("")
    : `<div class="bos">Henüz asistana soru sorulmadı.</div>`);
}

/* ---------- İşlem geçmişi ---------- */
async function islemlerSayfa(sayfaNo){
  yukle(); sayfaNo = sayfaNo || 0;
  const d = await guvenli(() => rpc("yp_islemler", { p_limit: 50, p_offset: sayfaNo * 50 })); if(!d) return;
  sayfa(`<div class="blok-bas" style="margin-bottom:16px"><h1>İşlem geçmişi</h1><span class="alt">${sayi(d.toplam)} kayıt · her yönetici işlemi değişmeden saklanır</span></div>
    <section class="blok">${d.kayitlar.length ? `<div class="tablo-kap"><table><thead><tr><th>#</th><th>İşlem</th><th>Durum</th><th class="gizle-mobil">Yapan</th><th>Zaman</th></tr></thead><tbody>
      ${d.kayitlar.map(i => `<tr class="tik" data-id="${i.id}"><td class="soluk">${i.id}</td><td><b>${e(i.baslik || i.islem)}</b><div class="kucuk soluk">${e(i.ozet || i.hata || "")}</div></td>
        <td><span class="etiket ${(DURUM[i.durum]||[])[1]||""}">${e((DURUM[i.durum]||[i.durum])[0])}</span></td><td class="gizle-mobil">${e(i.kad)}</td><td class="kucuk">${e(tarih(i.uygulama || i.olusturma))}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="bos">Portaldan henüz işlem yapılmadı. Yapılan her işlem burada önceki ve yeni değerleriyle listelenir.</div>`}
      <div class="dugmeler" style="margin-top:12px">${sayfaNo > 0 ? `<button class="btn btn-kucuk" id="onceki">Önceki</button>` : ""}${(sayfaNo + 1) * 50 < d.toplam ? `<button class="btn btn-kucuk" id="sonraki">Sonraki</button>` : ""}</div></section>`);
  const o = document.getElementById("onceki"), s = document.getElementById("sonraki");
  if(o) o.onclick = () => islemlerSayfa(sayfaNo - 1); if(s) s.onclick = () => islemlerSayfa(sayfaNo + 1);
  document.querySelectorAll("tr[data-id]").forEach(t => t.onclick = () => islemDetay(d.kayitlar.find(x => x.id === +t.dataset.id), () => islemlerSayfa(sayfaNo)));
}
function jsonBlok(j){ return `<pre class="gizli-kod" style="white-space:pre-wrap;max-height:240px;overflow:auto;margin:4px 0 0">${e(JSON.stringify(j, null, 2))}</pre>`; }
function islemDetay(i, sonra){
  const p = pencere(`#${i.id} · ${i.baslik || i.islem}`, `
    <dl class="kv"><dt>Durum</dt><dd>${e((DURUM[i.durum]||[i.durum])[0])}</dd><dt>Yapan</dt><dd>${e(i.kad)}</dd>
      <dt>Ön izleme</dt><dd>${e(tarih(i.olusturma, true))}</dd><dt>Uygulama</dt><dd>${e(tarih(i.uygulama, true))}</dd>
      ${i.geri_alan ? `<dt>Geri alan işlem</dt><dd>#${i.geri_alan}</dd>` : ""}${i.geri_alinan ? `<dt>Geri aldığı işlem</dt><dd>#${i.geri_alinan}</dd>` : ""}</dl>
    ${i.ozet ? `<p><b>${e(i.ozet)}</b></p>` : ""}${i.hata ? `<div class="uyari u-hata">${e(i.hata)}</div>` : ""}
    ${i.sonuc && Array.isArray(i.sonuc.eklenemeyen) && i.sonuc.eklenemeyen.length ? `<div><h3>Başarısız kayıtlar</h3>${tablo(i.sonuc.eklenemeyen)}</div>` : ""}
    <details><summary>Parametreler</summary>${jsonBlok(i.parametre)}</details>
    ${i.once ? `<details><summary>Önceki değerler</summary>${jsonBlok(i.once)}</details>` : ""}
    ${i.sonra ? `<details><summary>Yeni değerler</summary>${jsonBlok(i.sonra)}</details>` : ""}`,
    `${i.geri_alinabilir ? `<button class="btn btn-kirmizi" id="geri">Geri al</button>` : ""}<button class="btn" data-kapat>Kapat</button>`);
  const g = p.q("#geri"); if(g) g.onclick = () => { p.kapat(true); islemYap("geri_al", { islem_id: i.id }, sonra); };
}
