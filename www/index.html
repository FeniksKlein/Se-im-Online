const GBY_GOREVLER = ["Teşkilattan Sorumlu", "Seçim İşlerinden Sorumlu", "Siyasi ve Hukuki İşlerden Sorumlu", "Ekonomi Politikalarından Sorumlu",
  "Mali İşlerden Sorumlu", "Tanıtım ve Medyadan Sorumlu", "Dış İlişkilerden Sorumlu", "Yerel Yönetimlerden Sorumlu",
  "Sosyal Politikalardan Sorumlu", "Halkla İlişkilerden Sorumlu"];
async function gbyGorevCiz(pid) {
  let l; try { l = await API.rpc("gby_gorevleri", { p_parti: pid }); } catch (_) { return; }
  (l || []).forEach(g => {
    const el = document.querySelector(`[data-gby-sira="${g.sira}"]`);
    if (el) el.innerHTML = g.gorev ? `${e(g.gorev)} GB Yardımcısı` : `GB Yardımcısı ${g.sira}`;
  });
}
async function gbyGorevModal(pid) {
  let l; try { l = await API.rpc("gby_gorevleri", { p_parti: pid }); } catch (err) { return toast(hataCevir(err.message), true); }
  if (!l || !l.length) return toast("Önce yardımcı ata; sonra her birine görev verebilirsin.", true);
  const sec = (g) => {
    const hazir = GBY_GOREVLER.includes(g.gorev), deger = !g.gorev ? "" : hazir ? g.gorev : "__diger";
    return `<div class="alan"><label>${g.sira}. ${e(g.kad)}</label>
      <select data-gorev-kad="${e(g.kad)}"><option value="">— Görev yok —</option>${GBY_GOREVLER.map(x => `<option ${x === deger ? "selected" : ""}>${e(x)}</option>`).join("")}<option value="__diger" ${deger === "__diger" ? "selected" : ""}>Başka bir görev yaz…</option></select>
      <input data-gorev-ozel="${e(g.kad)}" maxlength="60" placeholder="Örnek: Çevre ve Şehircilikten Sorumlu" value="${hazir ? "" : e(g.gorev || "")}" ${deger === "__diger" ? "" : "hidden"} style="margin-top:6px"></div>`;
  };
  const m = modal(`<h3>Yardımcılara görev ver</h3><p class="alt">Her yardımcının görev alanı unvanında görünür: örneğin “Teşkilattan Sorumlu Genel Başkan Yardımcısı”. Yardımcı değişirse görevi de sıfırlanır.</p>
    ${l.map(sec).join("")}<div class="hata-metin" id="ggHata"></div><button class="btn" id="ggKaydet">Kaydet</button>`);
  m.querySelectorAll("select[data-gorev-kad]").forEach(s => s.onchange = () => {
    const i = m.querySelector(`input[data-gorev-ozel="${CSS.escape(s.dataset.gorevKad)}"]`); if (i) i.hidden = s.value !== "__diger";
  });
  $("#ggKaydet", m).onclick = async () => {
    const b = $("#ggKaydet", m); b.disabled = true;
    try {
      for (const g of l) {
        const s = m.querySelector(`select[data-gorev-kad="${CSS.escape(g.kad)}"]`);
        const yeni = s.value === "__diger" ? m.querySelector(`input[data-gorev-ozel="${CSS.escape(g.kad)}"]`).value.trim() : s.value;
        if ((yeni || "") !== (g.gorev || "")) await API.rpc("gby_gorev_ver", { p_kad: g.kad, p_gorev: yeni || null });
      }
      modalKapat(); toast("Görevler kaydedildi."); gbyGorevCiz(pid);
    } catch (err) { b.disabled = false; $("#ggHata", m).textContent = hataCevir(err.message); }
  };
}
</script>
<script>/* Parti kuruluşu, kurucu davetleri ve ideoloji oylamaları — 2026-10-09 */
"use strict";
const IDEOLOJI_SECENEK = [
  ["merkez_sag","Merkez sağ"],["merkez_sol","Merkez sol"],
  ["sosyal_demokrat","Sosyal demokrat"],["muhafazakar","Muhafazakâr"],
  ["liberal","Liberal"],["milliyetci","Milliyetçi"],
  ["turk_milliyetcisi","Türk milliyetçisi"],["sosyalist","Sosyalist"],
  ["kemalist","Kemalist"],["islamci","İslamcı"],
  ["demokratik_sol","Demokratik sol"],["yesil_siyaset","Yeşil siyaset"],
  ["populist","Popülist"],["karma","Karma ideoloji"]
];
const ideolojiAdi = (kod) => (IDEOLOJI_SECENEK.find(([k])=>k===kod)||[kod,kod])[1];
const ideolojiYaz = (liste) => (liste || []).map(ideolojiAdi).join(" · ") || "Henüz belirlenmedi";
function ideolojiSecimHtml(liste=[],id="ideolojiSec"){
  return '<div class="alan"><label>İdeolojiler (en az 1, en fazla 3)</label>'+
    '<div id="'+id+'" class="ideoloji-izgara">'+IDEOLOJI_SECENEK.map(([kod,ad])=>
      '<button type="button" class="ideoloji-kutu'+(liste.includes(kod)?' secili':'')+'" data-ideo="'+kod+'" aria-pressed="'+liste.includes(kod)+'">'+e(ad)+'</button>').join('')+'</div>'+
    '<p class="kucuk">Parti kimliğini belirleyen 1–3 ideoloji seç.</p></div>';
}
function ideolojiSecimBagla(kok){
  const yer=kok.querySelector(".ideoloji-izgara");
  if(!yer) return ()=>[];
  yer.onclick=ev=>{
    const b=ev.target.closest("button[data-ideo]");if(!b)return;
    if(!b.classList.contains("secili")&&yer.querySelectorAll("button.secili").length>=3){
      toast("En fazla 3 ideoloji seçebilirsin.",true);return;
    }
    b.classList.toggle("secili");
    b.setAttribute("aria-pressed",b.classList.contains("secili")?"true":"false");
  };
  return ()=>[...yer.querySelectorAll("button.secili")].map(b=>b.dataset.ideo);
}
async function kurucuDavetModal(){
  let data;
  try{data=await API.rpc("kurucu_davetlerim");}
  catch(err){toast(hataCevir(err.message),true);return;}
  const gelen=data.gelen||[],b=data.basvurum;
  const m=modal('<h3>Kurucular kurulu</h3><p class="alt">Parti kurmak için başvuran kişinin dışında en az üç ayrı oyuncunun EVET onayı gerekir. Davetliler kabul ederse parti kuruluşunda üye olurlar.</p>'+
    (b?'<div class="kart"><h3>'+e(b.ad)+' · '+e(b.kisa)+'</h3><p class="alt">Kurucu onayı: <b>'+b.onay+'/3</b> · Son: '+e(tarihSaat(b.bit))+'</p>'+
      '<p class="kucuk">'+e(ideolojiYaz(b.ideolojiler))+'</p>'+
      (b.davetler||[]).map(d=>'<div class="kv"><span>'+e(d.kad)+'</span><b>'+e({evet:"Kabul",hayir:"Ret",bekliyor:"Bekliyor"}[d.durum]||d.durum)+'</b></div>').join('')+
      '<button class="btn altin" id="kurucularTamamla" '+(b.onay<3?'disabled':'')+'>Onayları tamamla ve partiyi kur</button>'+
      '<button class="btn ikinci" id="kurucuIptal">Başvuruyu iptal et</button></div>':'')+
    (gelen.length?'<h3>Bana gelen davetler</h3>'+gelen.map(d=>
      '<div class="kart"><b>'+e(d.ad)+' ('+e(d.kisa)+')</b><div class="alt">Seni '+e(d.kurucu)+' kurucular kuruluna çağırıyor.</div>'+
      '<div class="kucuk">İdeolojiler: '+e(ideolojiYaz(d.ideolojiler))+' · Son: '+e(tarihSaat(d.bit))+'</div>'+
      '<div class="satir"><button class="btn altin" data-davet="'+d.id+'" data-yanit="evet">Kabul et</button>'+
      '<button class="btn ikinci" data-davet="'+d.id+'" data-yanit="hayir">Reddet</button></div></div>').join(''):'')+
    (!b&&!gelen.length?'<p class="alt">Bekleyen kurucu başvurusu veya davetin yok.</p>':'')+
    '<button class="btn ikinci" id="kurucuKapat">Kapat</button>');
  m.querySelector("#kurucuKapat").onclick=()=>modalKapat();
  m.querySelectorAll("button[data-davet]").forEach(x=>x.onclick=async()=>{
    x.disabled=true;
    try{
      await API.rpc("kurucu_davet_yanit",{p_basvuru:+x.dataset.davet,p_kabul:x.dataset.yanit==="evet"});
      toast(x.dataset.yanit==="evet"?"Daveti kabul ettin.":"Daveti reddettin.");
      kurucuDavetModal();
    }catch(err){x.disabled=false;toast(hataCevir(err.message),true);}
  });
  if(b){
    m.querySelector("#kurucularTamamla").onclick=async()=>{
      const btn=m.querySelector("#kurucularTamamla");btn.disabled=true;
      try{
        await API.rpc("parti_kur_tamamla",{p_basvuru:b.id});
        modalKapat();toast("Kurucular kuruluyla partin resmen kuruldu.");
        D.yigin=[];D.sekme="parti";await durumYenile();partilerEkrani();
      }catch(err){btn.disabled=false;toast(hataCevir(err.message),true);}
    };
    m.querySelector("#kurucuIptal").onclick=async()=>{
      if(!await onayla("Başvuruyu iptal et","Kurucu davetleri geçersiz olur. Henüz kuruluş ücreti kesilmedi.","Başvuruyu iptal et",true))return;
      try{await API.rpc("parti_kur_iptal",{p_basvuru:b.id});toast("Başvuru iptal edildi.");kurucuDavetModal();}
      catch(err){toast(hataCevir(err.message),true);}
    };
  }
}
async function ideolojiOylamaModal(pid){
  let d;try{d=await API.rpc("ideoloji_durum",{p_parti:pid});}catch(err){toast(hataCevir(err.message),true);return;}
  const t=d.teklif;
  const gb=!!(D.durum?.profil?.gb && D.durum.profil.parti?.id===pid);
  const canVote=t&&t.durum==="acik"&&t.oy_hakkim&&t.benim_oyum==null&&new Date(t.bit).getTime()>simdi();
  const m=modal('<h3>Parti ideolojileri</h3><p class="alt">Mevcut: '+e(ideolojiYaz(d.ideolojiler))+'</p>'+
    (t?'<div class="kart"><b>Son ideoloji teklifi</b><p class="alt">'+e(ideolojiYaz(t.ideolojiler))+'</p>'+
      '<div class="kucuk">Durum: '+e({acik:"Oylamada",kabul:"Kabul",red:"Reddedildi"}[t.durum]||t.durum)+
      ' · EVET '+t.evet+' · HAYIR '+t.hayir+' · Kabul için '+t.gerekli+' EVET gerekli</div>'+
      (canVote?'<div class="satir"><button class="btn altin" data-ideoloji-oy="evet">Evet</button><button class="btn ikinci" data-ideoloji-oy="hayir">Hayır</button></div>':'')+'</div>':'')+
    (gb&&(!t||t.durum!=="acik"||new Date(t.bit).getTime()<=simdi())?
      '<h3>Üyelere yeni ideoloji öner</h3><p class="alt">Teklif 48 saat oylamada kalır. Onay için teklif açıldığı andaki bütün üyelerin yarısından fazlasının EVET oyu gerekir.</p>'+
      ideolojiSecimHtml(d.ideolojiler,"ideolojiOySec")+'<button class="btn altin" id="ideolojiTeklif">Oylamaya sun</button>':'')+
    '<button class="btn ikinci" id="ideolojiKapat">Kapat</button>');
  const secilen=ideolojiSecimBagla(m);
  m.querySelector("#ideolojiKapat").onclick=()=>modalKapat();
  m.querySelectorAll("[data-ideoloji-oy]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;try{
      const r=await API.rpc("ideoloji_oyla",{p_teklif:t.id,p_evet:b.dataset.ideolojiOy==="evet"});
      toast(r.durum==="kabul"?"Çoğunluk onayladı. İdeolojiler değişti.":"Oyun kaydedildi.");
      ideolojiOylamaModal(pid);partiKimlikKartCiz(pid);
    }catch(err){b.disabled=false;toast(hataCevir(err.message),true);}
  });
  const teklif=m.querySelector("#ideolojiTeklif");
  if(teklif)teklif.onclick=async()=>{
    const sec=secilen();if(sec.length<1||sec.length>3){toast("1–3 ideoloji seç.",true);return;}
    teklif.disabled=true;
    try{await API.rpc("ideoloji_teklif_ver",{p_ideolojiler:sec});
      toast("Üyelere ideoloji değişikliği oylaması gönderildi.");ideolojiOylamaModal(pid);
    }catch(err){teklif.disabled=false;toast(hataCevir(err.message),true);}
  };
}

/* Eski doğrudan parti kurma ekranının yerine kurucu onaylı akış. */
function partiKurEkrani(){
  const serbestAd=!!(D.durum&&D.durum.profil&&(D.durum.profil.kad||"").toLocaleLowerCase("tr")==="matestappen");
  const ozelKurucu=!!(D.durum&&D.durum.profil&&["eyetkin","celal","matestappen"].includes((D.durum.profil.kad||"").toLocaleLowerCase("tr")));
  let renk=RENKLER[6],amb=VERI.amblem[0].id;
  iskelet("Parti kur",
    '<div class="kart" id="onizleme"></div>'+
    '<div class="kart">'+
    '<div class="alan"><label>Parti adı ('+(serbestAd?'1–80 karakter, serbest':'5–40 karakter')+')</label><input id="ad" maxlength="'+(serbestAd?'80':'40')+'" placeholder="Örn. Yarın Partisi"></div>'+
    '<div class="alan"><label>Kısa ad (2–6 harf)</label><input id="kisa" maxlength="6" placeholder="Örn. YP" style="text-transform:uppercase"></div>'+
    '<div class="alan"><label>Renk</label><div class="renkler">'+RENKLER.map(r=>'<button data-r="'+r+'" style="background:'+r+'"></button>').join("")+'</div></div>'+
    '<div class="alan"><label>Amblem</label><div class="amblemler">'+VERI.amblem.map(a=>'<button data-a="'+a.id+'" title="'+e(a.ad)+'">'+amblemSvg(a.id,"#fff")+'</button>').join("")+'</div></div>'+
    ideolojiSecimHtml([],"kurulusIdeoloji")+
    (ozelKurucu
      ? '<p class="alt">'+(serbestAd?'Bu hesap için parti adı serbest: 1–80 karakter. Mevcut başka partinin adını ya da kısaltmasını kullanamazsın. ':'')+'3 kurucu üye bulmadan ve kuruluş ücreti ödemeden partini hemen kurabilirsin.</p>'
      : '<div class="alan"><label for="kurucuNick">Kurucu adayı oyuncu adları (en az 3)</label>'+
        '<textarea id="kurucuNick" class="alanmetin" rows="4" placeholder="Her satıra bir kullanıcı adı yaz"></textarea></div>'+
        '<p class="alt">Oyunculara kurucular kurulu daveti gönderilir. Kurucu dışında en az 3 kişi EVET demedikçe parti kurulmaz. Onay verenler kuruluş tamamlandığında yeni partiye katılır.</p>')+
    '<p class="kucuk" id="kurUcret">Kuruluş sermayesi hesaplanıyor…</p>'+
    '<div class="hata-metin" id="hata"></div>'+
    '<button class="btn altin" id="kur">'+(ozelKurucu?'Partiyi hemen kur':'Kurucu davetlerini gönder')+'</button>'+
    (ozelKurucu?'':'<button class="btn ikinci" id="kurDavetGor">Kurucu davetlerini gör</button>')+'</div>',
    {geri:true,sekmesiz:true});
  const secilen=ideolojiSecimBagla(document);
  if(ozelKurucu){
    $("#kurUcret").innerHTML='<b>Kuruluş ücreti: 0 ₺</b> · 3 kurucu üye şartı bu hesaba uygulanmaz.';
  }else{
    API.rpc("vatandaslik").then(v=>{
      const pk=v.parti_kurma,el=$("#kurUcret");if(!el||!pk)return;
      el.innerHTML='<b>Gerekli sermaye: '+tlYaz(Math.max(25000,pk.ucret||0))+'</b> · Cüzdandaki: '+tlYaz(pk.para||0)+
        '. Başvuru ücretsizdir; sermaye yalnızca kuruluş tamamlandığında alınır.';
    }).catch(()=>{});
  }
  const ciz=()=>{
    const ad=$("#ad").value||"Parti adı",kisa=($("#kisa").value||"KISA").toLocaleUpperCase("tr");
    $("#onizleme").innerHTML='<div style="display:flex;gap:12px;align-items:center">'+amblemKutu({renk,amblem:amb},56)+
      '<div><b style="font-size:18px">'+e(ad)+'</b><div style="color:'+renk+';font-weight:800">'+e(kisa)+'</div></div></div>';
    document.querySelectorAll(".renkler button").forEach(b=>b.classList.toggle("secili",b.dataset.r===renk));
    document.querySelectorAll(".amblemler button").forEach(b=>{b.classList.toggle("secili",b.dataset.a===amb);b.querySelector("svg").style.color=renk;});
  };
  document.querySelectorAll(".renkler button").forEach(b=>b.onclick=()=>{renk=b.dataset.r;ciz();});
  document.querySelectorAll(".amblemler button").forEach(b=>b.onclick=()=>{amb=b.dataset.a;ciz();});
  $("#ad").oninput=ciz;$("#kisa").oninput=ciz;ciz();
  if(!ozelKurucu) $("#kurDavetGor").onclick=()=>kurucuDavetModal();
  $("#kur").onclick=async()=>{
    const ideolojiler=secilen(),nickler=ozelKurucu?[]:$("#kurucuNick").value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
    if(ideolojiler.length<1||ideolojiler.length>3){$("#hata").textContent="En az 1 en fazla 3 ideoloji seç.";return;}
    if(!ozelKurucu&&new Set(nickler.map(x=>x.toLocaleLowerCase("tr"))).size<3){
      $("#hata").textContent="Kendinden başka en az üç farklı oyuncunun kullanıcı adını yaz.";return;
    }
    $("#hata").textContent="";$("#kur").disabled=true;
    try{
      if(ozelKurucu){
        await API.rpc(serbestAd?"matestappen_parti_kur":"eyetkin_parti_kur",{
          p_ad:$("#ad").value,p_kisa:$("#kisa").value.toLocaleUpperCase("tr"),
          p_renk:renk,p_amblem:amb,p_ideolojiler:ideolojiler
        });
        toast("Partin kuruldu. Kurucu daveti ve ücret gerekmiyor.");
        await durumYenile();
        sekmeAc("parti");
      }else{
        await API.rpc("parti_kur_baslat",{
          p_ad:$("#ad").value,p_kisa:$("#kisa").value.toLocaleUpperCase("tr"),
          p_renk:renk,p_amblem:amb,p_ideolojiler:ideolojiler,p_kadlar:nickler
        });
        toast("Kurucu adaylarına bildirim gönderildi. En az üç kabul bekleniyor.");
        sekmeAc("parti");kurucuDavetModal();
      }
    }catch(err){$("#hata").textContent=hataCevir(err.message);$("#kur").disabled=false;}
  };
}
// Eski sürümün parti kurma fonksiyonunun bu ekranı ezmesini önle.
window.partiKurEkrani = partiKurEkrani;
</script>
<script>/* Ekonomi merkezi: banka ve şirket rehberleri */
"use strict";
const vitTL=x=>tlYaz(Number(x)||0);
const vitSektor={tarim:"Tarım",sanayi:"Sanayi",teknoloji:"Teknoloji",ticaret:"Ticaret",insaat:"İnşaat",medya:"Medya",banka:"Banka"};
let vitSirketler=[];
async function bankaRehberiEkrani(){
 yukleniyor("Oyuncu bankaları");
 try{
 const [d,p]=await Promise.all([API.rpc("oyb_liste"),API.rpc("oyb_portfoy")]);
 const l=(d.bankalar||[]).sort((a,b)=>b.kasa-a.kasa);
 iskelet("Oyuncu bankaları",`
 <div class="kart vit-manset"><h2>🏦 Bankalar çarşısı</h2><p class="alt">Bankaları karşılaştır, sana uygun faizli mevduat veya kredi imkanını seç. Her bankanın kendi şubesi ve ayrı yönetimi var.</p>
 <div class="vit-dugme"><button class="btn altin" onclick="bankaKurEkrani()">+ Banka kur</button><button class="btn ikinci" onclick="ekranAc(bankaEkrani)">Devlet bankası</button></div></div>
 <div class="vit-ozet"><span><b>${l.length}</b> oyuncu bankası</span><span><b>${(p.mevduatlar||[]).filter(x=>!x.kapandi).length}</b> açık mevduatın</span></div>
 ${l.map(b=>`<button class="kart vit-banka" onclick="bankaDetayEkrani(${b.id})">
   <div class="vit-bas"><span class="vit-logo">🏦</span><span class="orta"><b>${e(b.ad)}</b><span class="kucuk">Banka kasası ${vitTL(b.kasa)} ${b.bankam?"· Ortağısın":""}</span></span><span class="ok">›</span></div>
   <div class="vit-stats"><span><small>1 saat mevduat</small><b>%${fmt(oybVadeOrani(b,1),2)}</b></span><span><small>7 gün mevduat</small><b>%${fmt(oybVadeOrani(b,168),2)}</b></span><span><small>Kredi / 24 saat</small><b>%${fmt(b.kredi_faiz,2)}</b></span></div>
 </button>`).join("")||'<div class="kart"><p class="alt">Henüz oyuncu bankası yok. İlk bankayı sen kurabilirsin.</p></div>'}
 <button class="btn altin" onclick="bankaPortfoyEkrani()">Mevduatlarım ve kredilerim</button>
 <p class="alt">Oyuncu bankalarında devlet garantisi bulunmaz. Yatırmadan önce bankanın vade sonunda ödeme gücünü kontrol et.</p>`,{geri:true});
 }catch(err){iskelet("Bankalar",'<div class="kart">'+e(hataCevir(err.message))+'</div>',{geri:true});}
}
async function bankaDetayEkrani(id){
 yukleniyor("Banka şubesi");
 try{
  const d=await API.rpc("oyb_liste"),b=(d.bankalar||[]).find(x=>x.id===id);
  if(!b){toast("Banka bulunamadı.",true);bankaRehberiEkrani();return;}
  iskelet(e(b.ad),`<div class="kart vit-manset"><h2>🏦 ${e(b.ad)}</h2>
    <div class="kv"><span>Banka kasası</span><b>${vitTL(b.kasa)}</b></div>
    <div class="kv"><span>Kredi faizi / 24 saat</span><b>%${fmt(b.kredi_faiz,2)}</b></div>
    ${b.bankam?`<button class="btn altin" onclick="oybYonetim(${id})">Bankamı yönet</button>`:""}</div>
  <div class="kart"><h2>Mevduat faiz tablosu</h2><p class="alt">Faiz oranları seçilen vadenin tamamı içindir.</p>
    ${[1,3,6,12,24,168].map(h=>`<div class="kv"><span>${oybVadeEtiket(h)}</span><b>%${fmt(oybVadeOrani(b,h),2)}</b></div>`).join("")}</div>

function sirketVitrinListeCiz(){
 const el=$("#vitSirketListe");if(!el)return;
 const sort=$("#vitSirketSort").value,tur=$("#vitSirketTur").value;
 const key={kazanc:"net_kazanc",vergi:"vergi",sermaye:"sermaye"}[sort];
 const l=vitSirketler.filter(x=>!tur||x.sektor===tur).sort((a,b)=>key?Number(b[key]||0)-Number(a[key]||0)||a.id-b.id:new Date(b.kurulus)-new Date(a.kurulus));
 const tumuSifir=(sort==="vergi"||sort==="kazanc")&&l.length>0&&l.every(x=>Number(x[sort==="vergi"?"vergi":"net_kazanc"]||0)===0);
 el.innerHTML=(tumuSifir?'<div class="kart"><p class="alt">Henüz '+(sort==="vergi"?"şirketler adına ödenmiş vergi":"şirket faaliyet kazancı")+' kaydı yok. Bu nedenle gerçek bir sıralama henüz oluşmadı; şirketleri aşağıdan keşfedebilirsin.</p></div>':'')+l.map((x,i)=>`<button class="kart vit-banka" onclick="sirketDetayEkrani(${x.id})">
 <div class="vit-bas"><span class="vit-logo">🏢</span><span class="orta"><b>${tumuSifir?'':(i+1)+'. '}${e(x.ad)}</b><span class="kucuk">${e(vitSektor[x.sektor]||x.sektor)} · En büyük ortak: ${e((x.ortaklar||[])[0]?.kad||x.sahip)}</span></span><span class="ok">›</span></div>
 <div class="vit-stats"><span><small>Net kazanç</small><b>${vitTL(x.net_kazanc)}</b></span><span><small>Kayıtlı vergi</small><b>${vitTL(x.vergi)}</b></span><span><small>Şirket kasası</small><b>${vitTL(x.kasa)}</b></span></div></button>`).join("")||'<div class="kart"><p class="alt">Bu kriterlerde şirket bulunmuyor.</p></div>';
}

 iskelet(e(x.ad),`<div class="kart vit-manset"><h2>🏢 ${e(x.ad)}</h2><p class="alt">${e(vitSektor[x.sektor]||x.sektor)} · Kuruluş ${tarihSaat(x.kurulus)}</p>

 <div class="kart"><h2>Pay sahipleri</h2>${(x.ortaklar||[]).map(o=>`<div class="kv"><span>${e(o.kad)}</span><b>%${fmt(o.pay,2)}</b></div>`).join("")||'<p class="alt">Ortak bulunamadı.</p>'}</div>
 <div class="kart"><h2>Şirket faaliyet raporu</h2><div class="kv"><span>Gerçekleşen brüt gelir</span><b>${vitTL(x.toplam_gelir)}</b></div>
 <div class="kv"><span>Gerçekleşen net kâr / zarar</span><b>${vitTL(x.net_kazanc)}</b></div><div class="kv"><span>Kaydedilen vergi</span><b>${vitTL(x.vergi)}</b></div>
 <p class="kucuk">Kayıtlara geçmiş tüm dönemlerin toplamıdır; eksik eski veriler hesaplanmaz.</p>

}

<script>/* Sahibinden benzeri emlak ilanları ve gerçek oyuncu pazarlığı */
"use strict";
const emlakAd={daire:"Daire",dukkan:"Dükkân",villa:"Villa"};

async function emlakYeniEkrani(){

 catch(err){iskelet("Emlak pazarı",'<div class="kart">'+e(hataCevir(err.message))+'</div>',{geri:true});}

function emlakYeniCiz(d){
 emlakIlanlar=d.ilanlar||[];
 iskelet("Emlak pazarı",`
 <div class="kart vit-manset"><h2>🏡 Oyuncudan Emlak</h2><p class="alt">Oyuncuların satılık mülklerini incele, ilanları karşılaştır, doğrudan satın al veya pazarlık yap.</p>
 <div class="vit-dugme"><button class="btn altin" onclick="emlakPazarliklarimEkrani()">Pazarlıklarım</button><button class="btn ikinci" onclick="ekranAc(mulkEkrani)">Mülklerim</button></div></div>
 <div class="vit-ozet"><span><b>${emlakIlanlar.length}</b> satılık ilan</span><span><b>%2</b> işlem vergisi</span></div>
 <div class="kart">
   <div class="vit-filtre"><div class="alan"><label>Mülk tipi</label><select id="emlakTip" onchange="emlakYeniListeCiz()">
      <option value="">Tümü</option><option value="daire">Daire</option><option value="dukkan">Dükkân</option><option value="villa">Villa</option></select></div>
    <div class="alan"><label>Azami satış fiyatı</label><input id="emlakMax" type="number" min="0" placeholder="Sınırsız" oninput="emlakYeniListeCiz()"></div></div>
    <div class="alan"><label>Sırala</label><select id="emlakSort" onchange="emlakYeniListeCiz()">
    <option value="son">En yeni ilan</option><option value="ucuz">En ucuz</option><option value="pahali">En pahalı</option><option value="kira">En yüksek kira</option></select></div>
 </div><div id="emlakYeniListe"></div>`,{geri:true});
 emlakYeniListeCiz();
}
function emlakYeniListeCiz(){
 const el=$("#emlakYeniListe");if(!el)return;
 const t=$("#emlakTip").value,max=Number($("#emlakMax").value||0),sort=$("#emlakSort").value;
 let l=emlakIlanlar.filter(x=>(!t||x.tip===t)&&(!max||x.fiyat<=max));
 l.sort((a,b)=>sort==="ucuz"?a.fiyat-b.fiyat:sort==="pahali"?b.fiyat-a.fiyat:sort==="kira"?b.haftalik-a.haftalik:b.id-a.id);
 el.innerHTML=l.map(x=>`<div class="kart vit-emlak"><div class="vit-bas">
  <span class="vit-logo">${x.tip==="daire"?"🏢":x.tip==="dukkan"?"🏪":"🏡"}</span><span class="orta">
  <b>${e(emlakAd[x.tip]||x.tip)} #${x.mulk_id}</b><span class="kucuk">📍 ${e(x.il)} · Sahibi: ${e(x.satici)}</span></span><span class="rozet ${x.benim?"yesil":"altin"}">${x.benim?"Benim":"Satılık"}</span></div>
  <div class="vit-emlak-fiyat">${emlakTL(x.fiyat)}</div>
  <div class="kv"><span>Haftalık kira</span><b>${emlakTL(x.haftalik)}</b></div>
  <button class="btn altin" onclick="emlakYeniDetay(${x.id})">İlanı incele / ${x.benim?"yönet":"pazarlık yap"}</button></div>`).join("")||'<div class="kart">Aradığın özelliklerde ilan yok.</div>';
}
function emlakYeniDetay(id){
 const x=emlakIlanlar.find(y=>y.id===id);if(!x){emlakYeniEkrani();return;}
 iskelet("Emlak ilanı",`<div class="kart vit-manset">
 <h2>${x.tip==="daire"?"🏢":x.tip==="dukkan"?"🏪":"🏡"} ${e(emlakAd[x.tip]||x.tip)} #${x.mulk_id}</h2>
 <p class="alt">📍 ${e(x.il)} · Satıcı: ${e(x.satici)}</p><div class="vit-emlak-fiyat">${emlakTL(x.fiyat)}</div>
 <div class="kv"><span>Haftalık kira geliri</span><b>${emlakTL(x.haftalik)}</b></div>
 <p class="kucuk">İlan fiyatı kirayı artırmaz. Satış tamamlanırsa %2 vergi satış bedelinden kesilir.</p>
 ${x.benim?`<button class="btn ikinci" onclick="emlakIlanIptal(${x.id})">İlanımı kaldır</button>`:
  `<button class="btn altin" onclick="emlakIlanAl(${x.id},${Number(x.fiyat)})">İlan fiyatından satın al</button>
    <button class="btn ikinci" onclick="emlakYeniTeklifModal(${x.id})">Satıcıyla pazarlık yap</button>`}
 </div><button class="btn ikinci" onclick="emlakYeniEkrani()">Diğer ilanlara dön</button>`,{geri:true});
}
function emlakYeniTeklifModal(id){
 const x=emlakIlanlar.find(y=>y.id===id);if(!x)return;
 const m=modal(`<h3>Satıcıya teklif gönder</h3><p class="alt">${e(x.satici)} · ${e(emlakAd[x.tip]||x.tip)} #${x.mulk_id}</p>
 <div class="kv"><span>İlan fiyatı</span><b>${emlakTL(x.fiyat)}</b></div>

  catch(err){b.disabled=false;toast(hataCevir(err.message),true);}
 };
}
async function emlakPazarliklarimEkrani(){
 yukleniyor("Emlak pazarlıkları");
 try{

 ${l.map(x=>`<div class="kart"><h3>${e(emlakAd[x.tip]||x.tip)} #${x.mulk_id} · ${e(x.il)}</h3>

 <div class="kv"><span>Durum</span><b>${e({bekliyor:"Yanıt bekliyor",karsi:"Karşı teklif",kabul:"Satış tamamlandı",red:"Reddedildi",iptal:"İlan kapandı"}[x.durum]||x.durum)}</b></div>
 ${x.ben_saticiyim&&x.durum==="bekliyor"&&x.ilan_acik?`<div class="vit-dugme"><button class="btn altin" onclick="emSaticiYanit(${x.id},'kabul')">Kabul et</button><button class="btn ikinci" onclick="emSaticiYanit(${x.id},'red')">Reddet</button></div><button class="btn ikinci" onclick="emKarsiModal(${x.id},${x.teklif})">Karşı fiyat ver</button>`:""}
 ${x.ben_aliciyim&&x.durum==="karsi"&&x.ilan_acik?`<div class="vit-dugme"><button class="btn altin" onclick="emAliciYanit(${x.id},true)">Karşı fiyatı kabul et</button><button class="btn ikinci" onclick="emAliciYanit(${x.id},false)">Reddet</button></div>`:""}
 </div>`).join("")||'<div class="kart">Henüz bir pazarlık teklifi yok.</div>'}
 <button class="btn ikinci" onclick="emlakYeniEkrani()">Satılık ilanlara git</button>`,{geri:true});
 }catch(err){iskelet("Emlak pazarlıklarım",'<div class="kart">'+e(hataCevir(err.message))+'</div>',{geri:true});}
}
async function emSaticiYanit(id,karar){

 catch(err){toast(hataCevir(err.message),true);}
