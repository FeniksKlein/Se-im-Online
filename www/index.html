<body>
<div id="app"><div class="yukleniyor">Yükleniyor…</div></div>
<script>
"use strict";
/* =====================================================================
   1) SUNUCU BAĞLANTISI
   Testte window.API_TEST kullanılır; gerçekte Supabase.
   ===================================================================== */
const HATA_CEVIRI = [
  [/invalid login credentials/i, "E-posta veya şifre hatalı."],
  [/user already registered/i, "Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene."],
  [/email not confirmed/i, "E-posta adresin henüz doğrulanmadı."],
  [/token has expired or is invalid/i, "Kod hatalı ya da süresi dolmuş."],
  [/password should be at least/i, "Şifre en az 8 karakter olmalı."],
  [/unable to validate email|invalid email/i, "Geçerli bir e-posta adresi gir."],
  [/rate limit|too many|security purposes/i, "Çok sık deneme yapıldı. Biraz bekleyip tekrar dene."],
  [/failed to fetch|network|load failed/i, "İnternet bağlantısı kurulamadı."],
  [/JWT expired/i, "Oturumun süresi doldu, tekrar giriş yap."]
];
function hataCevir(m){
  m = String(m || "Bilinmeyen hata");
  for (const [re, tr] of HATA_CEVIRI) if (re.test(m)) return tr;
  return m;
}
function gercekApi(){
  if (!window.supabase) return null;
  const sb = window.supabase.createClient(AYAR.SUPABASE_URL, AYAR.SUPABASE_ANON, { auth: { persistSession: true, autoRefreshToken: true } });
  const k = async (pr) => { const { data, error } = await pr; if (error) throw new Error(hataCevir(error.message)); return data; };
  return {
    rpc: (fn, args) => k(sb.rpc(fn, args || {})),
    async oturum(){ const { data } = await sb.auth.getSession(); return data.session ? { email: data.session.user.email } : null; },
    async kayit(email, sifre){ const d = await k(sb.auth.signUp({ email, password: sifre })); return { onayGerekli: !d.session }; },
    async kodDogrula(email, kod, tur){ await k(sb.auth.verifyOtp({ email, token: kod, type: tur })); },
    async kodTekrar(email){ await k(sb.auth.resend({ type: "signup", email })); },
    async giris(email, sifre){ await k(sb.auth.signInWithPassword({ email, password: sifre })); },
    async sifreSifirla(email){ await k(sb.auth.resetPasswordForEmail(email)); },
    async sifreGuncelle(sifre){ await k(sb.auth.updateUser({ password: sifre })); },
    async cikis(){ await sb.auth.signOut(); }
  };
}
let API = null;

/* =====================================================================
   2) YARDIMCILAR
   ===================================================================== */
const $ = (s, el) => (el || document).querySelector(s);
const e = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TZ = "Europe/Istanbul";
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
function trParca(ts){
  const d = new Date(ts);
  const p = Object.fromEntries(new Intl.DateTimeFormat("tr-TR", { timeZone: TZ, year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23" })
    .formatToParts(d).map(x => [x.type, x.value]));
  return { g: +p.day, a: +p.month, y: +p.year, s: p.hour, d: p.minute, hg: p.weekday };
}
const tarih = (ts) => { const p = trParca(ts); return `${p.g} ${AYLAR[p.a - 1]}`; };
const tarihSaat = (ts) => { const p = trParca(ts); return `${p.g} ${AYLAR[p.a - 1]} ${p.s}:${p.d}`; };
const saatYaz = (ts) => { const p = trParca(ts); return `${p.s}:${p.d}`; };
let saatFarki = 0;                     // sunucu saati - cihaz saati
const simdi = () => Date.now() + saatFarki;
function kalan(ms){
  if (ms <= 0) return "şimdi";
  const s = Math.floor(ms / 1000), g = Math.floor(s / 86400), sa = Math.floor(s % 86400 / 3600), dk = Math.floor(s % 3600 / 60), sn = s % 60;
  const iki = (n) => String(n).padStart(2, "0");
  return g > 0 ? `${g} gün ${iki(sa)}:${iki(dk)}:${iki(sn)}` : `${iki(sa)}:${iki(dk)}:${iki(sn)}`;
}
function amblemSvg(id, renk){
  const a = (VERI.amblem.find(x => x.id === id) || VERI.amblem[1]);
  return `<svg viewBox="0 0 24 24" fill="currentColor" style="color:${e(renk || "#fff")}">${a.svg}</svg>`;
}
function partiRozet(p, kisaltma){
  if (!p) return `<span class="parti" style="color:var(--mut)"><span class="nok" style="background:#555"></span>Bağımsız</span>`;
  return `<span class="parti">${p.amblem?`<span style="width:17px;height:17px;display:inline-grid;place-items:center;flex:none">${amblemSvg(p.amblem,p.renk).replace('style="color:','style="width:17px;height:17px;display:block;color:')}</span>`:`<span class="nok" style="background:${e(p.renk)}"></span>`}${e(kisaltma ? p.kisa : p.ad)}</span>`;
}
function amblemKutu(p, boy){
  if (!p) return `<div class="amb" style="background:var(--panel2)"></div>`;
  return `<div class="amb" style="background:${e(p.renk)}22${boy ? `;width:${boy}px;height:${boy}px` : ""}">${amblemSvg(p.amblem, p.renk)}</div>`;
}
function ilAd(id){ const i = VERI.iller.find(x => x.id === id); return i ? i.ad : "?"; }
function toast(m, hata){
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast" + (hata ? " hata" : ""); t.textContent = m;
  document.body.appendChild(t); setTimeout(() => t.remove(), hata ? 4200 : 2600);
}
async function islem(fn, basari){
  try { const r = await fn(); if (basari) toast(basari); return r; }
  catch (err) { toast(hataCevir(err.message), true); throw err; }
}
function modal(html){
  modalKapat();
  const a = document.createElement("div"); a.className = "modal-arka"; a.id = "modal";
  a.innerHTML = `<div class="modal"><div class="tutamak"></div>${html}</div>`;
  a.addEventListener("click", ev => { if (ev.target === a) modalKapat(); });
  document.body.appendChild(a);
  return a;
}
function modalKapat(){ const m = $("#modal"); if (m) m.remove(); }
function onayla(baslik, metin, buton, tehlike){
  return new Promise(res => {
    const m = modal(`<h3 style="font-size:19px;font-weight:800">${baslik}</h3><p class="alt" style="margin-top:6px">${metin}</p>
      <button class="btn ${tehlike ? "tehlike" : ""}" id="evet">${buton}</button><button class="btn ikinci" id="hayir">Vazgeç</button>`);
    $("#evet", m).onclick = () => { modalKapat(); res(true); };
    $("#hayir", m).onclick = () => { modalKapat(); res(false); };
  });
}
const IKON = {
  gundem: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
  harita: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
  meclis: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10M9.5 21V10M14.5 21V10M19 21V10M2.5 10 12 3l9.5 7z"/></svg>',
  parti: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  ben: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  sohbet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg>',
  devlet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10M9.5 21V10M14.5 21V10M19 21V10M2.5 10 12 3l9.5 7z"/></svg>',
  zil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
  gonder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  megafon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 5V5L7 10H4a1 1 0 0 0-1 1zM17 8a5 5 0 0 1 0 8M20 5a9 9 0 0 1 0 14"/></svg>',
  hayat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10.5h18M16.5 15h1.5M7 6V5a2 2 0 0 1 2-2h8"/></svg>',
  sandik: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v9H4zM8 11V4h8v7M10 7h4"/></svg>'
};
const TUR = {
  mv_on:    { ad: "Milletvekili Ön Seçimi", kisa: "Vekil ön seçimi", aday: "Milletvekili aday adayı ol" },
  mv:       { ad: "Genel Seçim", kisa: "Genel seçim" },
  cb_on:    { ad: "Cumhurbaşkanı Aday Ön Seçimi", kisa: "CB ön seçimi", aday: "Cumhurbaşkanı aday adayı ol" },
  cb:       { ad: "Cumhurbaşkanlığı Seçimi", kisa: "Cumhurbaşkanlığı" },
  cb2:      { ad: "Cumhurbaşkanlığı 2. Tur", kisa: "CB 2. tur" },
  bel_on:   { ad: "Belediye Başkanı Ön Seçimi", kisa: "Belediye ön seçimi", aday: "Belediye başkanı aday adayı ol" },
  bel:      { ad: "İl Belediye Başkanlığı Seçimi", kisa: "Belediye seçimi" },
  kurultay: { ad: "Kurultay — Genel Başkan Seçimi", kisa: "Kurultay", aday: "Genel başkanlığa aday ol" }
};
const MAKAM_AD = { mv: "Milletvekili", bel: "İl Belediye Başkanı", cb: "Cumhurbaşkanı", bakan: "Bakan", tbmm: "TBMM Başkanı", bskv: "TBMM Başkanvekili", grup_bskv: "Grup Başkanvekili" };
const makamYaz = (m) => m.tur === "bakan" ? (m.bakanlik_ad || "Bakanlık").replace("Bakanlığı", "Bakanı") : (MAKAM_AD[m.tur] || m.tur) + (m.il_ad ? " · " + m.il_ad : "");

/* =====================================================================
   3) DURUM VE GEZİNME
   ===================================================================== */
const D = { durum: null, sekme: "gundem", yigin: [], haritaMod: "belediye", harita: null, okunmamis: { bildirim: 0, ozel: 0 }, canli: null };
function canliDurdur(){ if (D.canli) { clearInterval(D.canli); D.canli = null; } }
async function durumYenile(){
  D.durum = await API.rpc("durum");
  saatFarki = new Date(D.durum.simdi).getTime() - Date.now();
  if (D.durum.okunmamis) D.okunmamis = D.durum.okunmamis;
  const imza = D.durum.profil ? [D.durum.profil.il_id, (D.durum.profil.parti || {}).id].join("/") : "";
  if (D._pushImza !== undefined && D._pushImza !== imza) PUSH.konulariGuncelle();
  D._pushImza = imza;
  return D.durum;
}
function paraKisa(n){ n = +n || 0; return n < 1e5 ? fmt(n) + " ₺" : n < 1e6 ? fmt(n / 1000) + " B ₺" : fmt(n / 1e6, 1) + " Mn ₺"; }
function sayiRozet(n){ return n > 0 ? `<span class="sayi">${n > 99 ? "99+" : n}</span>` : ""; }
function iskelet(baslik, govde, opt){
  opt = opt || {};
  canliDurdur();
  const ok = D.okunmamis || { bildirim: 0, ozel: 0 };
  const geri = opt.geri ? `<button class="geri" onclick="geriGit()" aria-label="Geri">‹</button>` : "";
  const cz = D.durum && D.durum.profil && D.durum.profil.cuzdan;
  const ikonlar = opt.geri || opt.ikonsuz ? "" :
    `${cz ? `<button class="ikon para-cip" onclick="sekmeAc('hayat')" aria-label="Cüzdan">${paraKisa(cz.para)}</button>` : ""}<button class="ikon" onclick="ekranAc(bildirimEkrani)" aria-label="Bildirimler">${IKON.zil}<span id="zilSayi">${sayiRozet(ok.bildirim)}</span></button>
     <button class="ikon portre-ikon" onclick="sekmeAc('ben')" aria-label="Profilim">${typeof portre === "function" && D.durum && D.durum.profil ? portre(D.durum.profil.kad, D.durum.profil.parti && D.durum.profil.parti.renk) : IKON.ben}</button>`;
  const sekmeler = opt.sekmesiz ? "" : `<nav class="sekmeler">${[["gundem","Gündem"],["hayat","Hayat"],["sohbet","Sohbet"],["devlet","Devlet"],["harita","Harita"],["parti","Partiler"]]
    .map(([k, ad]) => `<button class="${D.sekme === k ? "aktif" : ""}" onclick="sekmeAc('${k}')">${IKON[k]}<span>${ad}</span>${k === "sohbet" ? `<span id="dmSayi">${sayiRozet(ok.ozel)}</span>` : ""}${k === "hayat" && cz && (cz.dolu || cz.gunun_ilki) ? `<span class="nokta"></span>` : ""}</button>`).join("")}</nav>`;
  // Aynı ekran yenilenince (dakikalık tazeleme, işlem sonrası) kaydırma konumu korunur
  const anahtar = D.sekme + "|" + (D._ekranNo || 0) + "|" + baslik, eskiIc = $("#icerik");
  const eskiKaydirma = eskiIc && D._sonAnahtar === anahtar ? eskiIc.scrollTop : 0;
  $("#app").innerHTML = `<header class="ust">${geri}<h1>${baslik}</h1>${opt.sag || ""}${ikonlar}</header>
    <main class="icerik ${opt.sekmesiz ? "tam" : ""}" id="icerik">${govde}</main>${sekmeler}`;
  D._sonAnahtar = anahtar;
  if (eskiKaydirma) $("#icerik").scrollTop = eskiKaydirma;
}
function rozetGuncelle(ok){
  D.okunmamis = ok || D.okunmamis;
  const z = $("#zilSayi"), d = $("#dmSayi");
  if (z) z.innerHTML = sayiRozet(D.okunmamis.bildirim);
  if (d) d.innerHTML = sayiRozet(D.okunmamis.ozel);
}
function yukleniyor(baslik){ iskelet(baslik, `<div class="yukleniyor">Yükleniyor…</div>`, { geri: D.yigin.length > 0 }); }
function sekmeAc(k){ D._ekranNo = (D._ekranNo || 0) + 1; D.sekme = k; D.yigin = []; modalKapat(); EKRAN[k](); }
function ekranAc(fn){ D._ekranNo = (D._ekranNo || 0) + 1; D.yigin.push(fn); fn(); }
function geriGit(){ D._ekranNo = (D._ekranNo || 0) + 1; D.yigin.pop(); const f = D.yigin[D.yigin.length - 1]; if (f) f(); else EKRAN[D.sekme](); }
function yenidenCiz(){ const f = D.yigin[D.yigin.length - 1]; if (f) f(); else EKRAN[D.sekme](); }

/* =====================================================================
   4) GİRİŞ / KAYIT / PROFİL OLUŞTURMA
   ===================================================================== */
const LOGO = `<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v9H4zM8 11V4h8v7M10 7h4"/></svg></div>`;
function karsilama(){
  $("#app").innerHTML = `<div class="karsila">${typeof hemisiklSvg === "function" ? hemisiklSvg() : LOGO}
    <h1>Seçim Simülasyonu Online</h1>
    <p class="giris">Türkiye'yi botlar değil oyuncular yönetiyor. Her ay belediye, kurultay ve genel seçim var; 81 ilde aday ol, miting yap, oy topla, Meclis'e gir.</p>
    <button class="btn" onclick="kayitEkrani()">Hesap oluştur</button>
    <button class="btn ikinci" onclick="girisEkrani()">Giriş yap</button>
    <p class="kucuk" style="margin-top:18px;text-align:center"><a class="bag" href="#" onclick="metinGoster('kurallar');return false">Oyun nasıl oynanır?</a> · <a class="bag" href="#" onclick="metinGoster('gizlilik');return false">Gizlilik</a></p>
  </div>`;
}
function girisEkrani(){
  $("#app").innerHTML = `<div class="karsila">${LOGO}<h1>Giriş yap</h1>
    <div class="alan"><label>E-posta</label><input id="eposta" type="email" autocomplete="email" inputmode="email"></div>
    <div class="alan"><label>Şifre</label><input id="sifre" type="password" autocomplete="current-password"></div>
    <div class="hata-metin" id="hata"></div>
    <button class="btn" id="gir">Giriş yap</button>
    <button class="btn ikinci" onclick="sifremiUnuttum()">Şifremi unuttum</button>
    <button class="btn ikinci" onclick="karsilama()">Geri</button></div>`;
  $("#gir").onclick = async () => {
    const em = $("#eposta").value.trim(), sf = $("#sifre").value;
    $("#hata").textContent = ""; $("#gir").disabled = true;
    try { await API.giris(em, sf); await basla(); }
    catch (err) {
      if (/doğrulanmadı/.test(err.message)) { kodEkrani(em, "signup"); return; }
      $("#hata").textContent = hataCevir(err.message);
    } finally { const b = $("#gir"); if (b) b.disabled = false; }
  };
}
function kayitEkrani(){
  $("#app").innerHTML = `<div class="karsila">${LOGO}<h1>Hesap oluştur</h1>
    <p class="giris" style="margin-bottom:6px">E-posta adresine 6 haneli bir doğrulama kodu göndereceğiz.</p>

function siradakiAn(s){

    }

      : `<button class="btn" onclick="ekranAc(()=>secimEkrani(${s.id}))">${IKON.sandik.replace("<svg", '<svg width="20" height="20"')} Oy ver</button>`);

async function adayOl(tur){

    kurultay: "Partinin genel başkanlığına adaylık. Kurultayda partinin üyeleri oy verecek.",
    cb_on: "Partinin cumhurbaşkanı aday adaylığı. Ön seçimde partinin üyeleri oy verecek."
  }[tur];
  let ucret = null, para = null;
  try { const pid = D.durum.profil.parti && D.durum.profil.parti.id;
    if (pid) { const [k, h] = await Promise.all([API.rpc("parti_kasa", { p_parti: pid }), API.rpc("hayat")]); ucret = k.ucretler[tur]; para = h.para; } } catch (_) {}

}

async function secimEkrani(sid){
  yukleniyor("Seçim");
  let s;
  try { s = await API.rpc("secim_detay", { p_secim: sid }); } catch (err) { iskelet("Seçim", `<div class="bos">${e(hataCevir(err.message))}</div>`, { geri: true }); return; }
  const tur = TUR[s.tur];
  let govde = `<div class="kart"><h3>${tur.ad}</h3><div class="alt">Oylama: ${tarih(s.oy_bas)}, ${saatYaz(s.oy_bas)}–${saatYaz(s.oy_bit)} · Sonuç: ${saatYaz(s.sonuc_at)}${s.goreve_bas ? ` · Göreve başlama: ${tarihSaat(s.goreve_bas)}` : ""}</div>
    ${s.katilim != null ? `<div class="kucuk" style="margin-top:4px">${s.katilim} oy kullanıldı</div>` : ""}</div>`;
  if (s.asama === "bitti") govde += sonucHtml(s);
  else if (s.asama === "oy") govde += pusulaHtml(s);
  else govde += `<div class="kart">${adayListesiHtml(s)}</div>`;
  iskelet(tur.kisa, govde, { geri: true });

}

async function haritaEkrani(){

function haritaCiz(){
  const veri = Object.fromEntries(D.harita.map(x => [x.id, x]));
  const maxO = Math.max(1, ...D.harita.map(x => x.oyuncu));
  const gMin = Math.min(...D.harita.map(x => x.gelisim || 0)), gMax = Math.max(...D.harita.map(x => x.gelisim || 0));
  const renk = (id) => {
    const v = veri[id];
    if (D.haritaMod === "gelisim") return { f: "#32D74B", o: .12 + .86 * ((v.gelisim || 0) - gMin) / Math.max(1, gMax - gMin) };
    if (D.haritaMod === "belediye") return v.bel ? { f: v.bel.parti ? v.bel.parti.renk : "#888", o: .92 } : { f: "#2a2a33", o: 1 };
    if (D.haritaMod === "vekil") return v.vekil.length ? { f: v.vekil[0].renk, o: .35 + .6 * (v.vekil.reduce((t, x) => t + x.n, 0) / v.mv) } : { f: "#2a2a33", o: 1 };
    return v.oyuncu ? { f: "#FF453A", o: .15 + .85 * Math.sqrt(v.oyuncu / maxO) } : { f: "#2a2a33", o: 1 };
  };
  const H = VERI.harita;
  const svg = `<svg viewBox="0 0 ${H.w} ${H.h}" style="width:100%;height:auto;display:block"><g stroke="#0b0b0f" stroke-width="1.3">${Object.entries(H.il).map(([id, p]) => {
    const r = renk(+id); return `<path d="${p.d}" fill="${e(r.f)}" fill-opacity="${r.o.toFixed(2)}" onclick="ilDetay(${id})" style="cursor:pointer"></path>`;
  }).join("")}</g></svg>`;
  const partiler = {};
  D.harita.forEach(v => {
    if (D.haritaMod === "belediye" && v.bel && v.bel.parti) partiler[v.bel.parti.kisa] = v.bel.parti.renk;
    if (D.haritaMod === "vekil") v.vekil.forEach(x => partiler[x.kisa] = x.renk);
  });
  const lejant = D.haritaMod === "gelisim" ? `<span class="kucuk">Yeşil ne kadar koyuysa il o kadar gelişmiş (en düşük ${fmt(gMin, 0)}, en yüksek ${fmt(gMax, 0)}). Bakanlık yatırımları ve cumhurbaşkanlığı destekleri gelişmişliği artırır; yatırım almayan iller zamanla ortalamaya döner.</span>`
    : D.haritaMod === "oyuncu" ? `<span class="kucuk">Renk ne kadar koyuysa o ilde o kadar çok oyuncu var.</span>`
    : Object.entries(partiler).map(([k, r]) => `<span class="parti"><span class="nok" style="background:${e(r)}"></span>${e(k)}</span>`).join("") + `<span class="parti"><span class="nok" style="background:#2a2a33"></span>${D.haritaMod === "belediye" ? "Başkan yok" : "Vekil yok"}</span>`;
  const top = D.harita.reduce((t, x) => t + x.oyuncu, 0);
  const sirali = [...D.harita].sort((a, b) => D.haritaMod === "gelisim" ? (b.gelisim || 0) - (a.gelisim || 0) : b.oyuncu - a.oyuncu);
  iskelet("Türkiye", `
    <div class="segment">${[["belediye","Belediye"],["vekil","Vekil"],["gelisim","Gelişmişlik"],["oyuncu","Oyuncu"]].map(([k, a]) => `<button class="${D.haritaMod === k ? "aktif" : ""}" onclick="D.haritaMod='${k}';haritaCiz()">${a}</button>`).join("")}</div>
    <div class="kart harita" style="margin-top:12px;padding:10px">${svg}<div class="lejant">${lejant}</div></div>
    <div class="kart"><h2>İller (${top} oyuncu)</h2>${sirali.map(v => `<div class="liste-satir" onclick="ilDetay(${v.id})" style="cursor:pointer">
      <div class="orta"><b>${e(v.ad)}</b><div class="kucuk">${v.mv} vekil · ${v.oyuncu} oyuncu · gelişmişlik ${fmt(v.gelisim || 0, 0)}${v.bel ? ` · Başkan: ${e(v.bel.kad)}` : ""}</div></div>
      ${v.oyuncu < v.mv ? `<span class="rozet yesil">fırsat</span>` : ""}</div>`).join("")}</div>`);
}

function meclisSvg(dagilim, toplam){
  // Sandalye sayısı Meclis'in o dönemki büyüklüğüdür (oyuncu sayısına göre ölçeklenir)
  const N = Math.max(30, toplam || dagilim.reduce((a, d) => a + d.n, 0) || 600), sira = Math.max(4, Math.min(12, Math.round(Math.sqrt(N / 4)))), r0 = 0.36;
  const yari = []; let topR = 0;
  for (let i = 0; i < sira; i++) { const r = r0 + (1 - r0) * i / (sira - 1); yari.push(r); topR += r; }
  let adet = yari.map(r => Math.floor(N * r / topR)); let kalan = N - adet.reduce((a, b) => a + b, 0);
  for (let i = sira - 1; kalan > 0; i = (i - 1 + sira) % sira, kalan--) adet[i]++;
  const nok = [];
  yari.forEach((r, i) => { for (let j = 0; j < adet[i]; j++) { const a = Math.PI * (1 - j / (adet[i] - 1)); nok.push({ a, x: 100 + 92 * r * Math.cos(a), y: 98 - 92 * r * Math.sin(a) }); } });
  nok.sort((p, q) => q.a - p.a);
  const renkler = []; dagilim.forEach(d => { for (let i = 0; i < d.n; i++) renkler.push(d.renk); });
  const rr = Math.min(5.2, 2.35 * Math.sqrt(600 / N) * .82).toFixed(2);
  return `<svg viewBox="0 0 200 104" style="width:100%;display:block;margin-top:6px">${nok.map((p, i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rr}" fill="${e(renkler[i] || "#2A3460")}"/>`).join("")}</svg>`;
}

function gostergeHtml(u){

      <div class="kv" style="margin-top:6px"><span class="k">Bakanlık kasası</span><span class="v">${fmt(panel.kasa, 1)} milyar ₺</span></div>
      <div class="kv"><span class="k">Günlük ödenek (bütçe payı %${fmt(panel.pay, 1)})</span><span class="v">+${fmt(panel.gunluk, 2)} milyar ₺</span></div>
      ${panel.politikalar && panel.politikalar.length ? `<div class="kucuk" style="margin-top:10px;font-weight:800;color:var(--txt2)">Politikaların</div>${politikaKartlari(panel.politikalar)}<div class="kucuk" style="margin-top:10px;font-weight:800;color:var(--txt2)">İcraatların</div>` : ""}

        const aktif = ic.aktif_bit && new Date(ic.aktif_bit).getTime() > simdi();
        return `<div class="kart" style="margin:10px 0 0;background:var(--panel2)"><div style="display:flex;justify-content:space-between;gap:8px"><b>${e(ic.ad)}</b>${aktif ? `<span class="rozet yesil">Yürürlükte</span>` : ""}</div>
        <div class="kucuk" style="margin-top:2px">${e(ic.aciklama)}</div>
        <div>${etkiCip(ic.oyuncu)}${ic.ozel ? `<span class="cip">${OZEL_AD[ic.ozel]}</span>` : ""}${ic.sure_gun ? `<span class="cip" style="background:var(--panel3);color:var(--txt2)">${ic.sure_gun} gün${ic.il_gerekli ? " · seçilen ilde" : " · tüm ülkede"}</span>` : ic.il_gerekli ? `<span class="cip" style="background:var(--panel3);color:var(--txt2)">seçilen ilde</span>` : ""}</div>
        <div class="kucuk" style="margin-top:4px">${etkiYaz(ic.etki) ? etkiYaz(ic.etki) + " · " : ""}${fmt(ic.maliyet)} milyar ₺ · ${ic.bekleme_saat / 24} günde bir${aktif ? ` · ${tarihSaat(ic.aktif_bit)} tarihine kadar sürüyor` : ""}</div>
        <button class="btn ${hazir && panel.kasa >= ic.maliyet ? "altin" : "ikinci"}" ${hazir ? "" : "disabled"} onclick="icraatYap('${ic.kod}', ${ic.il_gerekli})">${hazir ? (panel.kasa >= ic.maliyet ? "Uygula" : "Kasada yeterli ödenek yok") : "Tekrar: " + tarihSaat(ic.hazir)}</button></div>`; }).join("")}

}

      <div class="kucuk" style="margin-bottom:8px">İstifa nedeniyle boşaldıysa olağanüstü kurultay açılır; seçim süreci yoksa mevcut yedek kuralı devreye girer. ${liste(b.partiler, 6)}</div>` : ""}

function politikaKartlari(l){
  const B = { tl_ay: "₺/ay", tl_gun: "₺/gün", yuzde: "%" };
  return (l || []).map(p2 => { const hazir = !p2.hazir || new Date(p2.hazir).getTime() <= simdi();
    return `<div class="kart" style="margin:10px 0 0;background:var(--panel2)" data-pol="${p2.kod}">
      <div style="display:flex;justify-content:space-between;gap:8px"><b>${e(p2.ad)}</b><span class="v">${p2.birim === "yuzde" ? "%" + fmt(p2.deger, 1) : fmt(p2.deger) + " " + B[p2.birim]}</span></div>
      <div class="kucuk" style="margin-top:2px">${e(p2.aciklama)}</div>
      <div class="payinput" style="margin-top:6px"><span class="kucuk">Yeni değer (${p2.birim === "yuzde" ? "%" + fmt(p2.alt, 1) + " – %" + fmt(p2.ust, 1) : fmt(p2.alt) + " – " + fmt(p2.ust) + " " + B[p2.birim]})</span>
        <input type="number" min="${p2.alt}" max="${p2.ust}" step="${p2.birim === "yuzde" ? 0.5 : p2.kod === "asgari" ? 500 : 10}" value="${p2.deger}" inputmode="decimal" ${hazir ? "" : "disabled"}></div>
      <div class="kucuk pol-etki" style="min-height:1.2em"></div>
      <button class="btn ${hazir ? "altin" : "ikinci"}" ${hazir ? "" : "disabled"}>${hazir ? "Uygula" : "Sonraki değişiklik: " + tarihSaat(p2.hazir)}</button></div>`; }).join("");
}
function politikaBagla(){
  document.querySelectorAll("[data-pol]").forEach(k2 => {
    const kod = k2.dataset.pol, inp = k2.querySelector("input"), bt = k2.querySelector("button"), et = k2.querySelector(".pol-etki");
    let zam = null;
    inp.oninput = () => { clearTimeout(zam); zam = setTimeout(async () => {
      try { const r = await API.rpc("politika_onizle", { p_kod: kod, p_deger: +inp.value });
        et.innerHTML = `Bütçeye etkisi: <b class="${r.gunluk > 0 ? "kotu" : "iyi"}">${r.gunluk > 0 ? "−" : "+"}${fmt(Math.abs(r.gunluk), 2)} milyar ₺/gün</b>${r.enflasyon ? ` · enflasyon <b class="${r.enflasyon > 0 ? "kotu" : "iyi"}">${r.enflasyon > 0 ? "+" : ""}${fmt(r.enflasyon, 1)} puan</b>` : ""}`;
      } catch (_) {} }, 300); };
    bt.onclick = async () => {
      try { await API.rpc("politika_ayarla", { p_kod: kod, p_deger: +inp.value }); toast("Karar Resmî Gazete'de yayımlandı."); devletEkrani(); }
      catch (err) { toast(hataCevir(err.message), true); }
    };
  });
}
function etkiYaz(e2){
  const ad = { memnuniyet: "memnuniyet", buyume: "büyüme", enflasyon: "enflasyon", issizlik: "işsizlik", hazine: "hazine", gelisim: "il gelişmişliği" };
  return Object.entries(e2 || {}).map(([k, v]) => `${ad[k]} ${v > 0 ? "+" : ""}${fmt(v, Math.abs(v) < 1 ? 1 : (Number.isInteger(v) ? 0 : 1))}`).join(", ");
}
async function icraatYap(kod, ilGerekli){
  const ic = [D._panel, ...(D._vekil || [])].filter(Boolean).flatMap(pn => pn.icraatlar).find(x => x.kod === kod);
  const calistir = async (il) => {
    try { await API.rpc("icraat_yap", { p_kod: kod, p_il: il || null }); modalKapat(); toast(`${ic.ad} başlatıldı.`); devletEkrani(); }
    catch (err) { toast(hataCevir(err.message), true); }
  };
  if (!ilGerekli) { if (await onayla(e(ic.ad), `${e(ic.aciklama)}<br><br>Maliyet: ${fmt(ic.maliyet)} milyar ₺ (bakanlık kasasından)`, "Uygula")) calistir(); return; }
  const iller = [...VERI.iller].sort((a, b) => a.ad.localeCompare(b.ad, "tr"));
  const gel = Object.fromEntries((D._karne ? D._karne.iller : []).map(x => [x.id, x.gelisim]));
  const m = modal(`<h3 style="font-size:19px;font-weight:800">${e(ic.ad)}</h3><p class="alt">${e(ic.aciklama)} Maliyet: ${fmt(ic.maliyet)} milyar ₺.</p>
    <div class="alan"><label>Hangi il?</label><select id="icil">${iller.map(i => `<option value="${i.id}">${e(i.ad)}${gel[i.id] != null ? " · gelişmişlik " + fmt(gel[i.id], 0) : ""}</option>`).join("")}</select></div>
    <button class="btn altin" id="icok">Uygula</button>`);
  $("#icok", m).onclick = () => calistir(+$("#icil", m).value);
}

const KURAL_TUR = { kolaylik: ["Kolaylık", "yesil"], yaptirim: ["Yaptırım", "kirmizi"], gelir: ["Devlete gelir", "altin"] };
function kuralYaz(birim, v){
  return birim === "binde" ? "‰" + fmt(v, 1) : birim === "yuzde" ? "%" + fmt(v, 1) : birim === "saat" ? fmt(v) + " saat"

}
function etkiOzet(r){

  if (r.enflasyon) p.push(`enflasyon <b class="${r.enflasyon > 0 ? "kotu" : "iyi"}">${r.enflasyon > 0 ? "+" : ""}${fmt(r.enflasyon, 2)}</b>`);

  if (r.memnuniyet) p.push(`memnuniyet <b class="${r.memnuniyet < 0 ? "kotu" : "iyi"}">${r.memnuniyet > 0 ? "+" : ""}${fmt(r.memnuniyet, 2)}</b>`);
  if (r.oyuncu_vergi_farki) p.push(`oyuncunun vergi yükü <b class="${r.oyuncu_vergi_farki > 0 ? "kotu" : "iyi"}">${r.oyuncu_vergi_farki > 0 ? "+" : ""}${fmt(r.oyuncu_vergi_farki, 1)} puan</b>`);

}
function refKart(r){

function kuralKart(k, m){

function anayasaDegerYaz(a){

/* =========================================================
   ÇOKLU HESAP ÖNLEMİ: cihaz kimliği ve cihaz izi (sunucuda tuzlanıp özetlenir)
   ========================================================= */
async function ozetle(m){
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(m)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (_) { let h = 0; for (const c of m) h = (h * 31 + c.charCodeAt(0)) | 0; return "h" + h; }
}
async function cihazBilgisi(){
  let cihaz = null;
  try { const Dv = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Device; if (Dv && Dv.getId) { const r = await Dv.getId(); cihaz = r && (r.identifier || r.uuid); } } catch (_) {}
  if (!cihaz) { try { cihaz = localStorage.getItem("ssk_cihaz"); if (!cihaz) { cihaz = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now(); localStorage.setItem("ssk_cihaz", cihaz); } } catch (_) {} }
  let tuval = "";
  try { const c = document.createElement("canvas"); c.width = 220; c.height = 40; const x = c.getContext("2d"); x.textBaseline = "top"; x.font = "16px Arial";
    x.fillStyle = "#f60"; x.fillRect(10, 10, 100, 20); x.fillStyle = "#069"; x.fillText("Seçim Simülasyonu ğüşiöç", 2, 4); tuval = c.toDataURL(); } catch (_) {}
  const iz = await ozetle([navigator.userAgent, navigator.language, (navigator.languages || []).join(","), screen.width + "x" + screen.height, screen.colorDepth,
    window.devicePixelRatio, (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone, navigator.hardwareConcurrency, navigator.maxTouchPoints, navigator.platform, tuval].join("|"));
  return { cihaz: cihaz || iz, iz };
}
let _oturumSoz = null;
function oturumKaydet(){
  if (!_oturumSoz) _oturumSoz = (async () => { try { const c = await cihazBilgisi(); await API.rpc("oturum_kaydet", { p_cihaz: c.cihaz, p_iz: c.iz }); } catch (_) { _oturumSoz = null; } })();

  return (p.g === b.g && p.a === b.a && p.y === b.y) ? `${p.s}:${p.d}` : `${p.g} ${AYLAR[p.a - 1].slice(0, 3)} ${p.s}:${p.d}`;
}

function balonHtml(m, ozel){
  const renk = m.parti ? m.parti.renk : "#98A4C4";
  const balon = `<div class="balon ${m.benim ? "benim" : ""}" data-id="${m.id}" data-kad="${e(m.kad || "")}" data-ozel="${ozel ? 1 : 0}">`
    + (!m.benim && !ozel ? `<div class="kim"><span style="color:${e(renk)}">${e(m.kad)}</span>${m.unvan ? `<span class="unv">${e(m.unvan)}</span>` : m.parti ? `<span class="unv" style="color:var(--faint)">${e(m.parti.kisa)}</span>` : ""}</div>` : "")
    + `<div class="tx">${e(m.metin)}</div><div class="ne">${zamanKisa(m.zaman)}</div></div>`;
  // Kanal sohbetinde başkalarının mesajı portreyle gösterilir
  return !m.benim && !ozel && typeof portre === "function" ? `<div class="balon-satir">${portre(m.kad, renk, 30)}${balon}</div>` : balon;
}
function sohbetCati(baslik, sag){
  canliDurdur(); modalKapat();

    <div class="yazbar" id="yazbar"><textarea id="yaz" rows="1" maxlength="1000" placeholder="Mesaj yaz…"></textarea><button id="gonder" aria-label="Gönder">${IKON.gonder}</button></div></div>`;
  const ta = $("#yaz");
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(120, ta.scrollHeight) + "px"; });

function akisaEkle(akis, liste, ozel, basa){
  if (!liste.length) return;
  const altta = akis.scrollHeight - akis.scrollTop - akis.clientHeight < 80;
  const html = liste.map(m => balonHtml(m, ozel)).join("");
  const bos = akis.querySelector(".bos, .yukleniyor"); if (bos) bos.remove();
  if (basa) { const h = akis.scrollHeight; akis.insertAdjacentHTML("afterbegin", html); akis.scrollTop += akis.scrollHeight - h; }
  else { akis.insertAdjacentHTML("beforeend", html); if (altta || liste.some(m => m.benim)) akis.scrollTop = akis.scrollHeight; }
  if (typeof portreleriTazele === "function") portreleriTazele(akis);
}
async function sohbetEkrani(kanal){

    try { const r = await API.rpc("sohbet_oku", { p_kanal: kanal, p_once: null, p_sonra: sonId }); if (r.mesajlar.length) { sonId = r.mesajlar[r.mesajlar.length - 1].id; akisaEkle(akis, r.mesajlar); } } catch (_) {}
  };

    const r = await API.rpc("sohbet_oku", { p_kanal: kanal, p_once: null, p_sonra: null });
    $("#sbBaslik").textContent = r.baslik;
    akis.innerHTML = r.mesajlar.length ? "" : `<div class="bos">${r.yazabilir ? "Henüz kimse yazmadı. İlk mesajı sen yaz!" : "Henüz kimse söz almadı. Burada konuşulanları izleyebilirsin."}</div>`;
    if (r.mesajlar.length) { sonId = r.mesajlar[r.mesajlar.length - 1].id; ilkId = r.mesajlar[0].id; akisaEkle(akis, r.mesajlar); akis.scrollTop = akis.scrollHeight; }
    if (r.mesajlar.length < 40) bitti = true;

  } catch (err) { akis.innerHTML = `<div class="bos">${e(hataCevir(err.message))}</div>`; $("#yazbar").remove(); return; }
  akis.addEventListener("scroll", async () => {
    if (akis.scrollTop > 40 || yukluyor || bitti || !ilkId) return;
    yukluyor = true;
    try { const r = await API.rpc("sohbet_oku", { p_kanal: kanal, p_once: ilkId, p_sonra: null }); if (r.mesajlar.length) { ilkId = r.mesajlar[0].id; akisaEkle(akis, r.mesajlar, false, true); } if (r.mesajlar.length < 40) bitti = true; } catch (_) {}

  });

  const gonder = async () => {
    const ta = $("#yaz"); if (!ta) return; const m = ta.value.trim(); if (!m) return;
    $("#gonder").disabled = true;
    try { await API.rpc("sohbet_yaz", { p_kanal: kanal, p_metin: m }); ta.value = ""; ta.style.height = "auto"; await yeniGetir(); }
    catch (err) { toast(hataCevir(err.message), true); }
    const b = $("#gonder"); if (b) b.disabled = false;
  };

const METIN = {

    <p>Seçim Simülasyonu Online'da tüm makamlara gerçek oyuncular seçilir. Oyunda bot ya da yapay oyuncu yoktur; her vekil, bakan ve başkan bir insandır. Kimse aynı anda iki görev taşıyamaz: yeni bir göreve seçilen ya da atanan kişinin eski görevi sona erer. İstisnalar: milletvekili aynı zamanda genel başkan yardımcısı olabilir; genel başkan kendini cumhurbaşkanı adayı gösterip kazanırsa hem genel başkan hem cumhurbaşkanı olabilir. Genel başkanı kurultay seçer. Genel başkan yardımcılarını genel başkan, bakanları cumhurbaşkanı atar; başka görevi olan biri bakan ya da yardımcı atanamaz. Her ay aynı takvim işler; tüm saatler Türkiye saatidir.</p>

    <p><b>Ayın 1'i</b> — Genel seçim ve cumhurbaşkanlığı seçimi (08:00–22:00, sonuç 22:30)<br><b>Ayın 2'si</b> — Vekiller göreve başlar. Cumhurbaşkanlığında kimse %50'yi geçemezse ilk iki aday bu gün ikinci tura girer, kazanan 3'ünde göreve başlar.</p>
    <h4>Meclis</h4>
    <p>Meclis'te 600 sandalye vardır; her ilin vekil sayısı YSK'nın güncel dağılımıyla aynıdır. Genel seçimde oyuncular kendi illerinde bir partiye oy verir. Ülke genelinde %7 barajını geçen partiler (ittifak toplamı da sayılır) her ilde D'Hondt usulüyle sandalye alır. Bir partinin listesinde yeterli aday yoksa artan sandalye sıradaki partiye geçer; kimse kalmazsa boş kalır.</p>
    <h4>Makamlar</h4>
    <p><b>Cumhurbaşkanı</b> — genel seçimle tüm oyuncuların oyuyla seçilir; adayı partilerin genel başkanları belirler. 12 bakanı atar.<br>
    <b>Bakanlar</b> — Adalet, Dışişleri, İçişleri, Hazine ve Maliye, Millî Savunma, Millî Eğitim, Sağlık, Sanayi ve Teknoloji, Ticaret, Tarım ve Orman, Ulaştırma ve Altyapı, Çalışma ve Sosyal Güvenlik. Yeni cumhurbaşkanı göreve başlayınca kabine düşer.<br>
    <b>Genel başkan</b> — kurultayda partinin üyeleri seçer; en fazla 6 genel başkan yardımcısı atar.<br>
    <b>Milletvekili</b> ve <b>il belediye başkanı</b> — adayları ildeki parti üyeleri ön seçimle belirler, ildeki oyuncular seçer.</p>
    <h4>Meclis, kanunlar ve kararnameler</h4>
    <p>Milletvekilleri kanun teklifi verir: serbest kanun, kural kanunu (servet vergisi, oy cezası, hoş geldin hibesi gibi oyunculara dokunan kurallar), bütçe kanunu, seçim kanunu (baraj), kararname iptali ve anayasa değişikliği. Teklif 24 saat görüşülür, 24 saat oylanır. Kabul için dolu sandalyelerin üçte biri oylamaya katılmalı, kabul oyu retten fazla ve dolu sandalyelerin dörtte birinden fazla olmalı. Kabul edilen kanunu cumhurbaşkanı 48 saat içinde onaylar ya da veto eder; karar vermezse kanun kendiliğinden yürürlüğe girer. Veto edilen kanun, dolu sandalyelerin salt çoğunluğuyla ısrar edilirse yine yürürlüğe girer. Yeni Meclis göreve başlayınca sonuçlanmamış teklifler kadük olur.</p>
    <h4>TBMM Başkanlık Divanı ve parti grupları</h4>
    <p>Yeni Meclis toplanınca en kıdemli milletvekili Geçici Başkan olur. TBMM Başkanı için adaylar 24 saat içinde bildirilir; seçim gizli oyla yapılır: 1. ve 2. turda dolu sandalyelerin üçte ikisi, 3. turda salt çoğunluk gerekir, 4. turda en çok oy alan iki aday yarışır. Meclis Başkanı Genel Kurul'da oy kullanamaz, kanun teklifi veremez ve partisinin faaliyetlerine katılamaz; Genel Kurul'da düzeni bozan vekile ihtar verebilir. Meclis'te grup kurmak için 600 sandalyede 20 vekil (oyunda dolu sandalyeye oranla) gerekir. En büyük üç grup birer başkanvekili seçer; her grup kendi grup başkanvekillerini seçer. Grup başkanvekilleri kanunlarda grup kararı (kabul, ret, serbest) alır.</p>
    <h4>Vatandaşlık ve bir insan = bir hesap</h4>
    <p>Oy kullanmak, aday olmak ve parti kurmak için seçmen kartın hazır olmalı: hesabın yeterince eski, e-postan doğrulanmış, cihazın doğrulanmış ve birkaç günlük kıdemin olmalı (her gün maaşını toplayınca +1). İl değiştirdiysen yerel ve genel seçimde yeni ilinde belirli bir süredir kayıtlı olman gerekir (seçmen kütüğü); hesabını açtığın ilk ilde bu bekleme yoktur. Aynı cihazda sonradan açılan hesap yönetici incelemesine düşer; bir cihazdan bir sandıkta yalnızca bir oy kullanılabilir. Parti kurmak için kıdemli bir kurucu ve belirli süre içinde yeterli sayıda kurucu üye gerekir; kuruluş tamamlanmadan parti seçime giremez.</p>
    <h4>Meclis'in büyüklüğü</h4>
    <p>Anayasadaki milletvekili sayısı (600) üst sınırdır. Her genel seçimin başvuruları açılırken sandalyeler son iki haftada oyuna giren vatandaş sayısına göre dağıtılır; böylece her sandalye için gerçek bir yarış olur. Her ilin en az bir milletvekili vardır. Oyuncu sayısı arttıkça Meclis büyür.</p>
    <h4>Görev ihmali</h4>
    <p>Makam bir sorumluluktur. 3 gün oyuna girmeyen bakan ve genel başkan yardımcısı, 7 gün girmeyen cumhurbaşkanı, belediye başkanı ve genel başkan önce bildirimle uyarılır, yine girmezse görevden düşer. Seçilmiş makam boşalınca olağanüstü seçim takvimi kendiliğinden açılır.</p>
    <h4>Mitingler</h4>
    <p>Bir seçimde aday olan oyuncu, oylama bitmeden ilinde bir saatlik miting düzenleyebilir (bedeli ilin büyüklüğüne göre). Miting başlayınca ildeki herkese bildirim gider. Miting boyunca aday kürsüden en fazla 20 kez konuşur; katılanlar her söze alkış, tezahürat, ıslık ya da yuhla tepki verir ve slogan atar. Tepkilerden meydanın coşkusu (0-100) hesaplanır. Başka illerden oyuncular mitingi canlı izleyebilir. Katılan oyuncu günde bir kez +1 kıdem kazanır. Miting bitince katılım, coşku ve en çok alkışlanan söz Gündem'e haber olur.</p>
    <p>Genel başkan, 81 ilin herhangi birinde parti adına miting düzenleyebilir. Genel başkan bir yardımcısına "miting yetkisi" verirse o yardımcı da aynı hakka sahip olur; yetki geri alınınca başlamamış mitingleri iptal olur ve bedeli iade edilir. Bedeli parti kasası ya da düzenleyen öder. Her yetkili günde en fazla 1 parti mitingi yapar; aynı partinin aynı ildeki iki mitingi arasında en az 3 gün olmalı; seçim günlerinde oy verme saatlerinde miting yapılmaz. Parti mitingi başlayınca o ildeki herkese ve partinin tüm üyelerine bildirim gider.</p>
    <p>Bağımsız aday, oy verme başlamadan önce bir partiye katılabilir; o anda bağımsız adaylığı düşer ve başvuru harcı geri verilmez. Başvuru süresi açıksa yeni partisinden aday adayı olabilir. Oy verme sürerken pusula kilitlidir; sandık kapandıktan sonra katılabilir. Seçilmiş bağımsız vekil partiye katılırsa vekilliği sürer ve sandalyesi yeni partisine geçer.</p>
    <h4>Para hediyesi</h4>
    <p>Başka bir oyuncuya, onun şirketine ya da gazetesine aktardığın para (hediye ve banka havalesi birlikte) günlük sınıra tabidir. Partine, şehrine ve hazineye bağış sınırsızdır. Böylece satın alınan para başka hesaplara taşınıp oy toplamakta kullanılamaz.</p>
    <h4>Anayasa değişikliği ve halk oylaması</h4>
    <p>Yetki sırası: Anayasa › Kanun › Cumhurbaşkanlığı kararnamesi. Kanunla düzenlenen konuda kararname çıkarılamaz; anayasaya bağlanan kural ancak yeni bir anayasa değişikliğiyle değişir. Anayasa değişikliğini bir milletvekili teklif eder; 24 saatte vekillerin üçte biri imza vermelidir. Meclis gizli oyla oylar: beşte üç kabul çıkarsa değişiklik halk oylamasına gider; üçte iki çıkarsa cumhurbaşkanı yayımlar ya da halkoyuna sunar. Halk oylamasında oylamadan önce kayıtlı bütün oyuncular belirlenen gün 08:00–20:00 arası sandığa gider ve Evet ya da Hayır mührü basar; oy gizlidir, sonuç il il açıklanır. Geçerli oyların yarısından fazlası Evet ise değişiklik yürürlüğe girer.</p>
    <p>Bütçe kanunu gelir vergisinin alt ve üst sınırını (hükümet bu bant içinde ayarlar), belediyelerin vergi payını, partilere hazine yardımını ve bakanlıkların bütçe payını belirler. Asgari ücreti Meclis değil hükümet belirler.</p>
    <p>Cumhurbaşkanı günde en fazla 3 kararname çıkarır (anayasa değişikliğiyle değişebilir): il desteği, bakanlıklara ek ödenek, bayram ikramiyesi (7 günde bir), kural düzenlemesi, tahvil ihracı (60 günde faiziyle geri ödenir), özelleştirme ve serbest karar. Ekonomiyi cumhurbaşkanı ve kabine yönetir: Çalışma Bakanı asgari ücreti (en fazla %30 artış, 7 günde bir), kıdem primini ve yeni oyunculara sosyal desteği; Maliye Bakanı gelir vergisini; Ulaştırma Bakanı taşınma desteğini belirler. Cumhurbaşkanı bunların hepsini değiştirebilir. Bakanlar ayrıca kasalarındaki parayla icraat yapar: maaş desteği, geçim masrafını düşüren tedbirler, vergi iadesi, afet yardımı, il yatırımları.</p>
    <h4>Para nasıl kazanılır (Hayat sekmesi)</h4>
    <p><b>Maaş kumbarası:</b> maaşın saat saat birikir ama en fazla 16 saatlik birikir (Meclis bunu 12–24 saat arasında değiştirebilir); gelip "Topla" demezsen birikme durur. Kumbara dolunca telefonuna bildirim gelir. <b>Seri:</b> her gün gelip toplarsan maaşına +%5 eklenir (en fazla +%30); bir gün atlarsan seri sıfırlanmaz, bir basamak geri gider. <b>Statü:</b> topladığın her gün +1, kullandığın her oy +3 kıdem puanı kazandırır: Yeni Gelen → Vatandaş → Saygın Vatandaş → Kanaat Önderi → Duayen → Yaşayan Efsane. Her basamak maaşına kıdem primi kadar ekler. <b>Reklam izle:</b> günde 5 kez, her biri 2 saatlik maaş. Mağazadan ₺ paketi de alınabilir.</p>
    <p>Maaşın = asgari ücret × statü × ilinin refahı × destekler. Seçilmiş makamlar ayrıca maaş alır (gerçek oranlarla: cumhurbaşkanı, bakan, milletvekili asgari ücretin yaklaşık 11-13 katı; il belediye başkanı ilin büyüklüğüne göre 6-11 katı). Kesintiler: gelir vergisi (asgari ücret muaftır), kent vergisi ve günlük geçim masrafı (enflasyonla artar).</p>
    <p>Paranı aday adaylığı başvuru ücretine (partinin kasasına gider, ücreti genel başkan belirler), başka ile taşınmaya, ek propaganda hakkına ve partine bağışa harcarsın. Oyunda günlük bağış limiti yoktur; oyuncular gerçek cüzdan bakiyeleri kadar başka oyunculara, partilere, kurumlara ve şehirlere bağış yapabilir.</p>
    <h4>Belediyeler</h4>
    <p>Belediye kasası her gün ilin büyüklüğüne, gelişmişliğine, belediye payına ve kent vergisine göre gelir alır. Belediye başkanı kent vergisini (%0-5) ve her hemşehriye günlük desteği belirler; kent lokantası, ücretsiz toplu ulaşım, kira yardımı (geçim masrafını düşürür) ve istihdam ofisi (maaşları artırır) gibi hizmetler açar. Hizmetlerin gideri her gece kasadan düşer; para yetmezse kapanır. Altyapı ve raylı sistem yatırımları ilin gelişmişliğini kalıcı artırır.</p>
    <h4>Vaatler</h4>
    <p>Her vaat oyundaki gerçek bir ayara bağlıdır ve yetkiye uygundur. Partinin genel başkanı genel seçim için seçim beyannamesi yazar (asgari ücret, vergi, kıdem primi, sosyal destek, bayram ikramiyesi…); partinin cumhurbaşkanı kazanırsa hükümet bundan sorumludur. Milletvekili adayı yalnızca Meclis'in yetkisindekini (vergi tavanı, belediye payı, baraj, parti yardımı), belediye başkanı adayı kentin yetkisindekini, genel başkan adayı parti üyelerine yönelik vaatleri verir.</p>
    <p>Her vaadin günlük maliyeti hesaplanır ve ülkenin, ilin ya da partinin mali alanıyla karşılaştırılır. Ekonomi iyiyse daha büyük vaat verilebilir; karşılığı olmayan vaat kaydedilemez. Seçilenlerin vaatleri her gün kontrol edilir ve oyuncu kartında vaat karnesi olarak görünür.</p>
    <h4>İttifaklar</h4>
    <p>Genel başkanlar ittifak kurar ve diğer partileri davet eder. Genel seçimde ittifakın toplam oyu barajı aşmaya yeter. Bir parti cumhurbaşkanlığında kendi adayını çıkarmak yerine ittifak ortağının adayını destekleyebilir. Genel seçim döneminde ittifaklarda değişiklik yapılamaz.</p>
    <h4>Sohbet ve propaganda</h4>
    <p>Türkiye Meydanı (herkes), il kahvesi (ilindekiler), parti sohbeti (üyeler) ve TBMM Genel Kurulu (vekiller, bakanlar ve cumhurbaşkanı konuşur, herkes izler) kanalları vardır. Oyuncular birbirine özel mesaj gönderebilir.</p>
    <p>Görev ve adaylıklar propaganda hakkı verir: cumhurbaşkanı ve bakanlar tüm Türkiye'ye günde 1, genel başkan partisine günde 3, yardımcıları günde 1, vekil ve belediye başkanı iline günde 1, adaylar her seçim için seçmenlerine günde 1 yayın gönderebilir. Yayınlar seçmenlerin bildirim kutusuna düşer.</p>
    <h4>Kurallar</h4>

/* =====================================================================
   12a) PUSH BİLDİRİMLERİ (yalnızca telefonda; Capacitor + @capacitor-firebase/messaging)
   ===================================================================== */
const PUSH = {
  eklenti(){ const C = window.Capacitor; return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.FirebaseMessaging; },
  depo(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) { return null; } },
  async baslat(){
    const FM = this.eklenti(); if (!FM || !D.durum || !D.durum.profil) return;
    try {
      const izin = await FM.requestPermissions(); if (izin.receive !== "granted") return;
      const { token } = await FM.getToken();
      if (token) { await API.rpc("cihaz_kaydet", { p_token: token, p_platform: window.Capacitor.getPlatform() }); this.depo("push_token", token); }
      if (!this._dinle) {
        this._dinle = true;
        FM.addListener("notificationActionPerformed", ev => this.yonlendir(((ev || {}).notification || {}).data || {}));
        FM.addListener("notificationReceived", ev => { const n = (ev || {}).notification || {}; toast((n.title ? n.title + ": " : "") + (n.body || "")); API.rpc("rozetler").then(rozetGuncelle).catch(() => {}); });
        FM.addListener("tokenReceived", ev => { if (ev && ev.token) { this.depo("push_token", ev.token); API.rpc("cihaz_kaydet", { p_token: ev.token, p_platform: window.Capacitor.getPlatform() }).catch(() => {}); } });
      }
      await this.konulariGuncelle();
    } catch (err) { console.warn("push", err); }
  },
  istenenKonular(){
    const p = D.durum.profil, a = p.bildirim_ayar || {}, k = ["duyuru"];
    if (a.secim !== false) { k.push("s_tum", "s_il_" + p.il_id); if (p.parti) k.push("s_parti_" + p.parti.id); }
    if (a.propaganda !== false) { k.push("p_tum", "p_il_" + p.il_id); if (p.parti) k.push("p_parti_" + p.parti.id); }
    return k;
  },
  async konulariGuncelle(){
    const FM = this.eklenti(); if (!FM || !D.durum || !D.durum.profil) return;
    let eski = []; try { eski = JSON.parse(this.depo("push_konular") || "[]"); } catch (_) {}
    const yeni = this.istenenKonular();
    for (const t of eski.filter(x => !yeni.includes(x))) { try { await FM.unsubscribeFromTopic({ topic: t }); } catch (_) {} }
    for (const t of yeni.filter(x => !eski.includes(x))) { try { await FM.subscribeToTopic({ topic: t }); } catch (_) {} }
    this.depo("push_konular", JSON.stringify(yeni));
  },
  async cikis(){
    const FM = this.eklenti(); if (!FM) return;
    try {
      const t = this.depo("push_token"); if (t) await API.rpc("cihaz_sil", { p_token: t });
      for (const k of JSON.parse(this.depo("push_konular") || "[]")) { try { await FM.unsubscribeFromTopic({ topic: k }); } catch (_) {} }
      this.depo("push_konular", null);
    } catch (_) {}
  },
  yonlendir(v){
    if (!D.durum || !D.durum.profil) { D._bekleyenYon = v; return; }
    modalKapat(); D.yigin = [];
    if (v.ekran === "ozel" && v.kad) { D.sekme = "sohbet"; ekranAc(() => ozelEkrani(v.kad)); }
    else if (v.ekran === "secim" && v.id) { D.sekme = "gundem"; ekranAc(() => secimEkrani(+v.id)); }
    else if (v.ekran === "referandum" && v.id) { D.sekme = "gundem"; ekranAc(() => referandumEkrani(+v.id)); }
    else if (v.ekran === "bildirim") { D.sekme = "gundem"; ekranAc(bildirimEkrani); }
    else if (v.ekran === "hayat") sekmeAc("hayat");
    else sekmeAc("gundem");
  }
};

// Ödüllü reklam (@capacitor-community/admob). Ödül yalnızca reklam gerçekten izlenince verilir.
const REKLAM = {
  eklenti(){ const C = window.Capacitor; return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.AdMob; },
  async goster(){
    const A = this.eklenti();
    if (!A) throw new Error("Reklamlar yalnızca telefondaki uygulamada izlenebilir.");
    if (!this._hazir) { await A.initialize({ initializeForTesting: !!AYAR.ADMOB_TEST }); this._hazir = true; }
    const ios = window.Capacitor.getPlatform() === "ios";
    let odul = false;
    const dinle = await A.addListener("onRewardedVideoAdReward", () => { odul = true; });
    try {
      await A.prepareRewardVideoAd({ adId: ios ? AYAR.ADMOB_ODULLU_IOS : AYAR.ADMOB_ODULLU_ANDROID });
      const r = await A.showRewardVideoAd();
      if (r && (r.amount != null || r.type)) odul = true;
    } finally { try { dinle.remove(); } catch (_) {} }
    return odul;
  }
};
// Satın alma (@revenuecat/purchases-capacitor). Para, mağaza ödemeyi onaylayınca sunucuya gelen bildirimle eklenir.
const ODEME = {
  eklenti(){ const C = window.Capacitor; return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Purchases; },
  async hazirla(){
    const P = this.eklenti(); if (!P) return false;
    if (!this._hazir) {
      const ios = window.Capacitor.getPlatform() === "ios";
      await P.configure({ apiKey: ios ? AYAR.REVENUECAT_IOS : AYAR.REVENUECAT_ANDROID, appUserID: D.durum.profil.id });
      this._hazir = true;
    }
    return true;
  },
  async urunler(ids){ const r = await this.eklenti().getProducts({ productIdentifiers: ids, type: "NON_SUBSCRIPTION" }); return r.products || []; },
  async al(urun){ return this.eklenti().purchaseStoreProduct({ product: urun }); }
};
async function magazaModal(){
  const h = D._hayat || await API.rpc("hayat");
  const m = modal(`<h3 style="font-size:19px;font-weight:800">Mağaza</h3><p class="alt">Cüzdanına ₺ ekle: aday adaylığı, kampanya, taşınma ve parti bağışı için. Bağış ve ek yayın hakkının günlük sınırları satın alanlar için de geçerlidir.</p><div id="mgz"><div class="yukleniyor">Yükleniyor…</div></div>`);
  const kutu = $("#mgz", m);
  if (!ODEME.eklenti()) {
    kutu.innerHTML = h.paketler.map(p2 => `<div class="liste-satir"><div class="orta"><b>${e(p2.ad)}</b><div class="kucuk">${tlYaz(p2.miktar)}</div></div><span class="rozet">Telefonda</span></div>`).join("")
      + `<p class="kucuk" style="margin-top:8px">Satın alma yalnızca telefondaki uygulamada yapılabilir.</p>`;
    return;
  }
  let urunler = [];
  try { await ODEME.hazirla(); urunler = await ODEME.urunler(h.paketler.map(p2 => p2.urun_id)); } catch (err) { kutu.innerHTML = `<div class="bos">${e(hataCevir(err.message))}</div>`; return; }
  kutu.innerHTML = h.paketler.map(p2 => { const u = urunler.find(x => x.identifier === p2.urun_id);
    return `<div class="liste-satir"><div class="orta"><b>${e(p2.ad)}</b><div class="kucuk">Cüzdanına ${tlYaz(p2.miktar)}</div></div>
      <button class="rozet altin" style="padding:9px 12px" data-urun="${p2.urun_id}" ${u ? "" : "disabled"}>${u ? e(u.priceString) : "—"}</button></div>`; }).join("");
  kutu.querySelectorAll("[data-urun]").forEach(b => b.onclick = async () => {
    const u = urunler.find(x => x.identifier === b.dataset.urun); b.disabled = true;
    const once = (await API.rpc("hayat")).para;
    try { await ODEME.al(u); } catch (err) { b.disabled = false; if (!/cancel/i.test(String(err && (err.code || err.message)))) toast(hataCevir(err.message), true); return; }
    toast("Ödeme alındı, cüzdanına ekleniyor…");
    for (let i = 0; i < 15; i++) {
      await new Promise(r => setTimeout(r, 2000));
      const r2 = await API.rpc("hayat");
      if (r2.para > once) { modalKapat(); hayatCiz(r2); toast(`Cüzdanına ${tlYaz(r2.para - once)} eklendi. Teşekkürler!`); return; }
    }
    toast("Ödeme alındı; mağaza onayı biraz gecikebilir. Paran birkaç dakika içinde cüzdanında olacak.");
  });
}

let _sirketEkonomi={asgari:NaN,normal:100000,banka:1000000};
let _sirketSonMin=100000;
function sirketOnizleme(sektorDegisti=false){
 const sektor=document.getElementById("sir_sektor"),sermaye=document.getElementById("sir_sermaye");
 const alt=document.getElementById("sir_alt_limit"),onizleme=document.getElementById("sir_kazanc_onizleme");
 const uyari=document.getElementById("sir_sermaye_uyari"),btn=document.getElementById("sir_kur_btn");
 if(!sektor||!sermaye||!alt||!onizleme||!uyari||!btn)return;
 const min=sektor.value==="banka"?_sirketEkonomi.banka:_sirketEkonomi.normal;
 if(sektorDegisti&&Number(sermaye.value)===_sirketSonMin)sermaye.value=String(min);
 _sirketSonMin=min;sermaye.min=String(min);sermaye.max="100000000";sermaye.step="1";
 alt.textContent="Bu sektörde en az "+fmt(min)+" ₺, en fazla 100.000.000 ₺ sermaye gerekir.";
 const tutar=Number(sermaye.value);let hata="";
 if(!sermaye.value.trim()||!Number.isSafeInteger(tutar)||tutar<=0)hata="Geçerli ve pozitif bir tam sayı gir.";
 else if(tutar<min)hata="Bu sektör için en az "+fmt(min)+" ₺ gerekli; girdiğin sermaye "+fmt(tutar)+" ₺.";
 else if(tutar>100000000)hata="En yüksek kuruluş sermayesi 100.000.000 ₺.";
 uyari.textContent=hata;uyari.style.display=hata?"block":"none";btn.disabled=Boolean(hata);
 if(hata){onizleme.textContent="Haftalık kazanç tahmini için geçerli bir sermaye gir.";return;}
 const oran={tarim:.12,sanayi:.15,teknoloji:.20,ticaret:.14,insaat:.18,medya:.16,banka:.08}[sektor.value];
 const asgari=Number(_sirketEkonomi.asgari);
 if(!Number.isFinite(asgari)||asgari<=0||!Number.isFinite(oran)){onizleme.textContent="Canlı ekonomi bilgisi alınamadı, tahmin yapılamıyor.";return;}
 const gelirMin=tutar*oran*.6,gelirMax=tutar*oran*1.4;
 const giderMin=tutar*.025+asgari*.5,giderMax=tutar*.08+asgari*1.5;
 const netMin=gelirMin-giderMax,netMax=gelirMax-giderMin,netOrt=tutar*oran-tutar*.0525-asgari;
 const para=x=>fmt(Math.round(x))+" ₺";
 onizleme.innerHTML='<h3 style="margin-bottom:8px">7 günlük faaliyet tahmini</h3>'
 +'<div class="kv"><span>Olası brüt gelir</span><b>'+para(gelirMin)+' – '+para(gelirMax)+'</b></div>'
 +'<div class="kv"><span>Olası giderler</span><b>'+para(giderMin)+' – '+para(giderMax)+'</b></div>'
 +'<div class="kv"><span>Olası net kâr / zarar</span><b>'+para(netMin)+' – '+para(netMax)+'</b></div>'
 +'<div class="kv"><span>Ortalama senaryo</span><b>'+para(netOrt)+'</b></div>'
 +'<p class="alt" style="margin-top:8px">Bunlar garanti kazanç değildir; mevcut 7 günlük oyun formülüne göre olası sonuçlardır. Kâr ortakların paylarına göre cüzdana geçer, zarar şirket kasasını azaltır. Asgari ücret değişirse tahmin değişir.</p>';
}

  if(!await onayla("Mevduat yatır","Bu bankaya "+fmt(tutar)+" ₺ yatıracaksın. "+

  const UC=[["mv_on","Milletvekili aday adaylığı"],["bel_on","Belediye başkanı aday adaylığı"],["kurultay","Genel başkanlık adaylığı"],["cb_on","Cumhurbaşkanı aday adaylığı"]];

      <div class="alan"><label>Ücret katsayısı (0–3)</label><input type="number" data-u="${tur}" min="0" max="3" step="0.05" inputmode="decimal" value="${Number((t.carpanlar||{})[tur]??1)}"></div>

<script>/* Türkiye Gündem: doğrulanmış kayıtları aktaran ücretsiz, otomatik gazete. */
const TG_KAT={siyaset:"Siyaset",secim:"Seçimler",adaylar:"Adaylar",ittifak:"İttifak",ekonomi:"Ekonomi",meclis:"Meclis",yerel:"Yerel",gundem:"Gündem",bulten:"Bülten"};
const TG_RENK={siyaset:"",secim:"",adaylar:"",ittifak:"",ekonomi:"",meclis:"",yerel:"",gundem:"",bulten:""};
let tgCache={};
function tgTarih(t){return t?new Date(t).toLocaleString("tr-TR",{dateStyle:"long",timeStyle:"short"}):"—"}
async function otomatikGazeteEkrani(kategori=null,offset=0){
 yukleniyor("Türkiye Gündem");
 try{
  const d=await API.rpc("ajans_haberler",{p_limit:30,p_kategori:kategori,p_offset:offset});
  const bas=d.manset||d.haberler[0],items=(d.haberler||[]).filter(x=>!bas||x.id!==bas.id);
  if(offset===0)tgCache={};(d.haberler||[]).forEach(x=>tgCache[x.id]=x);
  if(bas)tgCache[bas.id]=bas;
  const tabs=[[null,"Tümü"],...Object.entries(TG_KAT).map(([k,v])=>[k,v])];
  const tab=`<div class="tg-secimler">${tabs.map(([k,v])=>`<button class="tg-filtre ${k===kategori?"secili":""}" onclick="otomatikGazeteEkrani(${k?`'${k}'`:"null"},0)">${e(v)}</button>`).join("")}</div>`;
  const lead=bas?`<article class="tg-manset" onclick="tgHaberOku(${bas.id})" tabindex="0" role="button" onkeydown="if(event.key==='Enter')tgHaberOku(${bas.id})">
    <span class="tg-ust">Son dakika · Günün manşeti</span>
    <span class="tg-kategori">${TG_RENK[bas.kategori]||""} ${e(TG_KAT[bas.kategori]||bas.kategori)}</span>
    <h2>${e(bas.baslik)}</h2><p>${e(bas.ozet)}</p>
    <div class="tg-meta">${tgTarih(bas.zaman)} · Haberin tamamını oku →</div>
  </article>`:"";

/** Bağışlar alıcının kendi sayfasında gösterilir. */
function aliciBagisModal(tur, id, ad){
  const kabulEdilen=["oyuncu","parti","sirket","gazete","il","devlet"];
  if(!kabulEdilen.includes(tur)||id==null||String(id).trim()===""){
    toast("Bağış yapılacak alıcı bulunamadı.",true);return;
  }
  const hedef=String(id),isim=String(ad||(tur==="oyuncu"?id:
    tur==="devlet"?"Türkiye Cumhuriyeti Hazinesi":
    tur==="parti"?"Siyasi parti":tur==="sirket"?"Şirket":
    tur==="gazete"?"Gazete":"Belediye / il"));
  const turAd={oyuncu:"Oyuncuya para hediye et",parti:"Partiye bağış yap",
    sirket:"Şirkete bağış yap",gazete:"Gazeteye bağış yap",
    il:"Şehre bağış yap",devlet:"Devlet hazinesine bağış yap"};
  const m=modal(`<h3>${e(turAd[tur])}</h3>
    <div class="kart" style="background:var(--panel2);margin:10px 0">
      <span class="kucuk">Bağışın alıcısı</span><h3 style="margin-top:5px">${e(isim)}</h3>
      <p class="alt">Bağış doğrudan ${tur==="oyuncu"?"oyuncunun cüzdanına":"ilgili kurumun kasasına"} aktarılır. ${["oyuncu","sirket","gazete"].includes(tur)?"Oyunculara, şirketlere ve gazetelere aktarılan para (hediye ve havale birlikte) günlük sınıra tabidir.":"Partiye, şehre ve hazineye bağışın sınırı yoktur; bağış günde bir kıdem puanına kadar kazandırır."}</p>
      <div class="kucuk" id="ah_hak"></div>
    </div>
    <div class="alan"><label>Tutar (₺)</label><input id="ah_tutar" type="number" min="1" step="1" value="1000" inputmode="numeric"></div>
    <div class="alan"><label>Not (isteğe bağlı)</label><input id="ah_not" maxlength="150" placeholder="Bağış açıklaması"></div>
    <p class="kucuk">Bağış geri alınamaz; şirket bağışı hisse satın alma anlamına gelmez.</p>
    <button class="btn" id="ah_gonder">${e(isim)} için bağışla</button>
    <button class="btn ikinci" id="ah_vazgec">Vazgeç</button>`);
  $("#ah_vazgec",m).onclick=()=>modalKapat();
  if(["oyuncu","sirket","gazete"].includes(tur)) API.rpc("aktarim_hakki").then(h=>{const el=$("#ah_hak",m);if(el)el.textContent=h.engel?h.engel:"Bugün kalan aktarma hakkın: "+tlYaz(h.kalan)+" / "+tlYaz(h.tavan);}).catch(()=>{});
  $("#ah_gonder",m).onclick=async()=>{
    const miktar=Number($("#ah_tutar",m).value),aciklama=$("#ah_not",m).value.trim();
    if(!Number.isSafeInteger(miktar)||miktar<1){toast("En az 1 ₺ tutarında, tam sayı bağış gir.",true);return;}
    if(aciklama.length>150){toast("Bağış notu en fazla 150 karakter olmalı.",true);return;}
    const evet=await onayla("Bağışı onayla",
      "<b>"+e(isim)+"</b> alıcısına <b>"+tlYaz(miktar)+"</b> göndereceksin. İşlem geri alınamaz.",
      "Evet, bağışla");
    if(!evet)return;
    try{
      const result=await API.rpc("serbest_bagis",{
        p_tur:tur,p_id:hedef,p_tutar:miktar,p_aciklama:aciklama||null});
      D._hayat=null;
      toast(tlYaz(miktar)+" "+result.hedef+" hesabına gönderildi.");
      try {await durumYenile();}catch(_){}
      if(tur==="parti")partiDetay(+hedef);
      else if(tur==="gazete")gazeteEkrani(+hedef);
      else if(tur==="sirket")sirketEkrani();
      else if(tur==="il")ilDetay(+hedef);
      else if(tur==="devlet")devletEkrani();
      else if(tur==="oyuncu")oyuncuKart(hedef);
    }catch(err){toast(hataCevir(err.message),true);}
  };
}

/* Oyuncu kimlikleri (portre, biyografi, son görülme) — kısa ömürlü önbellek */
const KIMLIK = new Map();
async function kimlikYukle(kadlar) {
  const iste = [...new Set((kadlar || []).filter(k => k && !KIMLIK.has(k.toLocaleLowerCase("tr"))))].slice(0, 100);
  if (!iste.length) return;
  try {
    const r = await API.rpc("kimlikler", { p_kadlar: iste });
    iste.forEach(k => KIMLIK.set(k.toLocaleLowerCase("tr"), null));
    Object.entries(r || {}).forEach(([k, v]) => KIMLIK.set(k.toLocaleLowerCase("tr"), v));
  } catch (_) { iste.forEach(k => KIMLIK.set(k.toLocaleLowerCase("tr"), null)); }
}
const kimlik = (kad) => KIMLIK.get(String(kad || "").toLocaleLowerCase("tr")) || null;
function portre(kad, renk, boy) {
  const k = kimlik(kad);
  return portreSvg(k && k.avatar, { ad: kad, renk }).replace('class="portre"', `class="portre" data-portre="${e(kad)}"${boy ? ` style="width:${boy}px;height:${boy}px"` : ""}`);
}
// Portreleri yüklendikten sonra yerinde güncelle (ekranı yeniden çizmeden)
async function portreleriTazele(kok) {
  const els = [...(kok || document).querySelectorAll("[data-portre]")];
  await kimlikYukle(els.map(x => x.dataset.portre));
  els.forEach(el => {
    const k = kimlik(el.dataset.portre); if (!k || !k.avatar) return;
    const yeni = document.createElement("div"); yeni.innerHTML = portreSvg(k.avatar, { ad: el.dataset.portre });
    const s = yeni.firstElementChild; s.setAttribute("data-portre", el.dataset.portre); if (el.getAttribute("style")) s.setAttribute("style", el.getAttribute("style"));
    el.replaceWith(s);
  });
}

function mtBagla(id) {
  const konus = $("#mtKonus");
  if (konus) konus.onclick = async () => {
    const ta = $("#mtMetin"), m = ta.value.trim(); if (!m) return;
    konus.disabled = true;
    try { mtCiz(await API.rpc("miting_konus", { p_id: id, p_metin: m })); ta.value = ""; }
    catch (err) { toast(hataCevir(err.message), true); }
    konus.disabled = false;
  };
  const at = async (metin) => {
    if (!metin) return;
    try { mtCiz(await API.rpc("miting_slogan_at", { p_id: id, p_metin: metin })); const i = $("#mtSlogan"); if (i) i.value = ""; }
    catch (err) { toast(hataCevir(err.message), true); }
  };
  const sk = $("#mtSesKart");
  sk.addEventListener("click", ev => { const c = ev.target.closest("[data-slogan]"); if (c) at(c.dataset.slogan); });
  const sb = $("#mtSloganAt"); if (sb) sb.onclick = () => at($("#mtSlogan").value.trim());
}

/* =====================================================================

function sonucSatirlari(liste, toplam, opt) {
  opt = opt || {};
  return liste.map((x, i) => {
    const y = toplam ? x.oy * 100 / toplam : (x.yuzde || 0);
    return `<div class="sonuc-satir ${i === 0 && opt.kazanan ? "kazanan" : ""}">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">${opt.portre ? portre(x.kad, x.renk, 34) : ""}<div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e(x.ad || x.kad)}</b>
        <span class="kucuk">${x.kisa ? `<span style="color:${e(x.renk)}">${e(x.kisa)}</span> · ` : ""}${fmt(x.oy)} oy${x.sandalye != null ? ` · ${x.sandalye} sandalye` : ""}${x.not ? " · " + x.not : ""}</span></div></div>
      <span class="yuzde">%${y.toFixed(1).replace(".", ",")}</span>
      <span class="cubuk"><i style="width:${y}%;background:${e(x.renk || "#8E97B5")};animation-delay:${(.15 + i * .18).toFixed(2)}s"></i></span></div>`;
  }).join("");
}
function sonucHaritasi(r, pmap) {
  if (!r || !r.iller || !VERI.harita) return "";
  const H = VERI.harita;
  const renk = (id) => {
    const v = r.iller[String(id)]; if (!v || !v.partiler) return "#2A3460";
    const en = Object.entries(v.partiler).sort((a, b) => b[1].oy - a[1].oy)[0];
    return en && en[1].oy ? ((pmap[en[0]] || {}).renk || "#8E97B5") : "#2A3460";
  };
  return `<div class="harita" style="margin-top:12px"><svg viewBox="0 0 ${H.w} ${H.h}" style="width:100%;height:auto;display:block" aria-label="İllerde birinci parti"><g stroke="#0A1026" stroke-width="1.3">${Object.entries(H.il).map(([id, p]) =>
    `<path d="${p.d}" fill="${e(renk(+id))}"></path>`).join("")}</g></svg><div class="kucuk" style="margin-top:4px">Her il, en çok oyu alan partinin renginde.</div></div>`;
}

/* =====================================================================
   PARTİ KİMLİĞİ VE ÜYE OYLAMALARI
   ===================================================================== */
const EKSEN_YAZI = {
  eko: (v) => v <= -3 ? "devletçi" : v < 0 ? "sosyal devletçi" : v === 0 ? "merkez" : v < 3 ? "piyasa yanlısı" : "serbest piyasacı",
  toplum: (v) => v <= -3 ? "özgürlükçü" : v < 0 ? "ılımlı özgürlükçü" : v === 0 ? "merkez" : v < 3 ? "ılımlı muhafazakâr" : "muhafazakâr"
};
function pusulaSvg(partiler, ben) {
  const W = 300, P = 26, olc = (v) => P + (v + 5) / 10 * (W - 2 * P);
  const maxU = Math.max(1, ...partiler.map(p => p.uye || 0));
  return `<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Partilerin siyasi konumu">
    <rect x="${P}" y="${P}" width="${W - 2 * P}" height="${W - 2 * P}" fill="none" stroke="rgba(164,184,255,.16)"/>
    <path d="M${W / 2} ${P}V${W - P}M${P} ${W / 2}H${W - P}" stroke="rgba(164,184,255,.22)"/>
    <text x="${W / 2}" y="16" text-anchor="middle" font-size="11.5" fill="#98A4C4">Muhafazakâr</text>
    <text x="${W / 2}" y="${W - 7}" text-anchor="middle" font-size="11.5" fill="#98A4C4">Özgürlükçü</text>
    <text x="8" y="${W / 2 + 4}" font-size="11.5" fill="#98A4C4" transform="rotate(-90 8 ${W / 2})" text-anchor="middle" dx="0" dy="6">Devletçi</text>
    <text x="${W - 8}" y="${W / 2}" font-size="11.5" fill="#98A4C4" transform="rotate(90 ${W - 8} ${W / 2})" text-anchor="middle" dy="4">Serbest piyasa</text>
    ${partiler.map(p => { const r = 7 + 11 * Math.sqrt((p.uye || 0) / maxU), x = olc(p.eko), y = olc(-p.toplum);
      return `<g><circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${e(p.parti.renk)}" fill-opacity=".88" stroke="#0E1530" stroke-width="2"/><text x="${x}" y="${(y - r - 4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#EEF1F8" font-family="Kurul Display,Arial Narrow,sans-serif">${e(p.parti.kisa)}</text></g>`; }).join("")}
    ${ben ? `<g><circle cx="${olc(ben.eko)}" cy="${olc(-ben.toplum)}" r="9" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="3 2.5"/><text x="${olc(ben.eko)}" y="${olc(-ben.toplum) + 23}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Sen</text></g>` : ""}
  </svg>`;
}

/* =====================================================================
   KARŞILAMA — yarım daire Meclis
   ===================================================================== */
function hemisiklSvg() {
  const renkler = ["#c62828", "#ef8f00", "#1565c0", "#2e7d32", "#6a1b9a", "#00897b"];
  const sira = [[0, 34], [1, 27], [2, 21], [3, 11], [4, 5], [5, 2]];
  const dizi = []; sira.forEach(([r, n]) => { for (let i = 0; i < n; i++) dizi.push(renkler[r]); });
  const toplam = dizi.length, satir = 6, cx = 180, cy = 170, noktalar = [];
  let k = 0;
  for (let s = 0; s < satir; s++) {
    const R = 70 + s * 17, adet = Math.round(toplam * R / (satir * (70 + 17 * (satir - 1) / 2)));
    for (let i = 0; i < adet && k < toplam; i++, k++) {
      const a = Math.PI - (i + .5) / adet * Math.PI;
      noktalar.push([cx + R * Math.cos(a), cy - R * Math.sin(a), a]);
    }
  }
  noktalar.sort((a, b) => b[2] - a[2]);
  return `<svg class="hemisikl" viewBox="0 0 360 180" aria-hidden="true">${noktalar.map(([x, y], i) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.6" fill="${dizi[i] || "#3A4675"}" style="animation-delay:${(i * 0.005).toFixed(3)}s"/>`).join("")}</svg>`;
}

  D._pmiting = b;
