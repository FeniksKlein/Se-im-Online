{"id":12,"ad":"Bingöl","mv":3},{"id":13,"ad":"Bitlis","mv":3},{"id":14,"ad":"Bolu","mv":3},{"id":15,"ad":"Burdur","mv":3},{"id":16,"ad":"Bursa","mv":21},{"id":17,"ad":"Çanakkale","mv":4},{"id":18,"ad":"Çankırı","mv":2},{"id":19,"ad":"Çorum","mv":4},{"id":20,"ad":"Denizli","mv":7},{"id":21,"ad":"Diyarbakır","mv":12},{"id":22,"ad":"Edirne","mv":4},{"id":23,"ad":"Elazığ","mv":5},{"id":24,"ad":"Erzincan","mv":2},{"id":25,"ad":"Erzurum","mv":5},{"id":26,"ad":"Eskişehir","mv":7},{"id":27,"ad":"Gaziantep","mv":14},{"id":28,"ad":"Giresun","mv":4},{"id":29,"ad":"Gümüşhane","mv":2},{"id":30,"ad":"Hakkari","mv":3},{"id":31,"ad":"Hatay","mv":10},{"id":32,"ad":"Isparta","mv":4},{"id":33,"ad":"Mersin","mv":13},{"id":34,"ad":"İstanbul","mv":96},{"id":35,"ad":"İzmir","mv":28},{"id":36,"ad":"Kars","mv":3},{"id":37,"ad":"Kastamonu","mv":3},{"id":38,"ad":"Kayseri","mv":10},{"id":39,"ad":"Kırklareli","mv":3},{"id":40,"ad":"Kırşehir","mv":2},{"id":41,"ad":"Kocaeli","mv":14},{"id":42,"ad":"Konya","mv":15},{"id":43,"ad":"Kütahya","mv":4},{"id":44,"ad":"Malatya","mv":6},{"id":45,"ad":"Manisa","mv":10},{"id":46,"ad":"Kahramanmaraş","mv":8},{"id":47,"ad":"Mardin","mv":6},{"id":48,"ad":"Muğla","mv":8},{"id":49,"ad":"Muş","mv":3},{"id":50,"ad":"Nevşehir","mv":3},{"id":51,"ad":"Niğde","mv":3},{"id":52,"ad":"Ordu","mv":6},{"id":53,"ad":"Rize","mv":3},{"id":54,"ad":"Sakarya","mv":8},{"id":55,"ad":"Samsun","mv":9},{"id":56,"ad":"Siirt","mv":3},{"id":57,"ad":"Sinop","mv":2},{"id":58,"ad":"Sivas","mv":5},{"id":59,"ad":"Tekirdağ","mv":8},{"id":60,"ad":"Tokat","mv":5},{"id":61,"ad":"Trabzon","mv":6},{"id":62,"ad":"Tunceli","mv":2},{"id":63,"ad":"Şanlıurfa","mv":15},{"id":64,"ad":"Uşak","mv":3},{"id":65,"ad":"Van","mv":8},{"id":66,"ad":"Yozgat","mv":3},{"id":67,"ad":"Zonguldak","mv":5},{"id":68,"ad":"Aksaray","mv":4},{"id":69,"ad":"Bayburt","mv":1},{"id":70,"ad":"Karaman","mv":3},{"id":71,"ad":"Kırıkkale","mv":3},{"id":72,"ad":"Batman","mv":5},{"id":73,"ad":"Şırnak","mv":4},{"id":74,"ad":"Bartın","mv": <script>// Basın: tüm erişim, bakiye ve ücret kararları RPC tarafından verilir.
const BASIN_TUR = { haber: 'Haber', kose: 'Köşe yazısı', propaganda: 'PROPAGANDA' };
function basinDugme(metin, fn, sinif = 'ikinci') {
  const b = document.createElement('button'); b.className = 'btn ' + sinif;
  b.textContent = metin; b.onclick = fn; return b;
}
function basinAlan(id, etiket, ozellik = '', deger = '') {
  return `<div class="alan"><label for="${id}">${etiket}</label><input id="${id}" ${ozellik} value="${e(deger)}"></div>`;
}
// Çift tıklamayla ikinci ödeme/yayın oluşmasını engeller; hatada form korunur.
async function basinIslem(buton, fn, sonra) {
  if (buton.disabled) return;
  buton.disabled = true;
  try {
    const r = await API.rpc(fn.ad, fn.args);
    D._hayat = null; D._banka = null;
    modalKapat(); toast('İşlem tamamlandı.');
    await sonra(r);
  } catch (err) { toast(hataCevir(err.message), true); }
  finally { buton.disabled = false; }
}
function basinForm(baslik, alanlar, dugme, ad, args, sonra) {
  const m = modal(`<h3>${e(baslik)}</h3><form id="basinForm">${alanlar}<button class="btn altin" type="submit">${e(dugme)}</button></form><button class="btn ikinci" onclick="modalKapat()">Vazgeç</button>`);
  $('#basinForm', m).onsubmit = ev => {
    ev.preventDefault();
    basinIslem($('button[type="submit"]', m), { ad, args: args(m) }, sonra);
  };
  return m;
}
async function basinEkrani() {
  yukleniyor('Basın / Gazeteler');
  let d;
  try { d = await API.rpc('basin'); }
  catch (err) { iskelet('Basın / Gazeteler', `<div class="kart"><p>${e(hataCevir(err.message))}</p><button class="btn ikinci" onclick="basinEkrani()">Tekrar dene</button></div>`); return; }
  iskelet('Basın / Gazeteler', `<div class="kart basin-manset"><div class="kucuk">Oyuncuların sesi</div><h1>Basın meydanı</h1><p class="alt">Haberler, köşe yazıları ve açıkça etiketlenmiş siyasi yayınlar.</p></div>
    <div class="kart tg-kart-kisa"><h2>Türkiye Gündem · otomatik gazete</h2>
  <p class="alt">Cumhurbaşkanı adayları, parti değişimleri, seçim beyannameleri ve ittifaklar; bütün gerçek gelişmeler tek gazetede. Ücretsiz ve 5 dakikada bir güncellenir.</p>
  <button class="btn altin" onclick="otomatikGazeteEkrani()">Son dakika ve manşetleri oku</button></div>
  <div class="kart" id="basinBenim"><h2>${d.benim ? 'Gazetem' : 'Kendi gazeteni kur'}</h2><p class="alt">${d.benim ? e(d.benim.ad) + ' · Kasa: ' + tlYaz(d.benim.kasa) : 'Kuruluş bedeli: ' + tlYaz(d.kurulus_ucreti) + '. Ücretsiz veya ücretli yayın yapabilirsin.'}</p></div>
    <div id="basinTeklifler"></div><div id="basinYazarlik"></div><h2>Gazete büfesi</h2><div id="basinListe" class="basin-grid"></div>`, { geri: true });
  $('#basinBenim').appendChild(basinDugme(d.benim ? 'Gazetemi yönet' : 'Gazete kur', () => d.benim ? ekranAc(() => gazeteEkrani(d.benim.id)) : gazeteKurModal(d.kurulus_ucreti), 'altin'));
  for (const t of d.teklifler || []) {
    const el = document.createElement('section'); el.className = 'kart';
    el.innerHTML = `<h2>Köşe yazarlığı teklifi</h2><b>${e(t.ad)}</b><p class="alt">${e(t.sahip)} · Yazı başına ${tlYaz(t.ucret)}</p>`;
    for (const kabul of [true, false]) {
      const b = basinDugme(kabul ? 'Teklifi kabul et' : 'Reddet', () => {
        el.querySelectorAll('button').forEach(x => { if (x !== b) x.disabled = true; });
        basinIslem(b, { ad: 'gazete_yazar_yanit', args: { p_gazete: t.gazete_id, p_kabul: kabul } }, basinEkrani).finally(() => el.querySelectorAll('button').forEach(x => x.disabled = false));
      }, kabul ? 'altin' : 'ikinci'); el.appendChild(b);
    }
    $('#basinTeklifler').appendChild(el);
  }
  const yazarlik=(d.gazeteler||[]).filter(g=>g.yaziyim);
  if(yazarlik.length)$('#basinYazarlik').innerHTML='<section class="kart"><h2>Köşe yazarı olduğum gazeteler</h2>'+yazarlik.map(g=>'<div class="kv"><span>'+e(g.ad)+'</span><button class="btn ikinci" onclick="ekranAc(()=>gazeteEkrani('+Number(g.id)+'))">Yazı yaz</button></div>').join('')+'</section>';
  const liste = $('#basinListe');
  for (const g of d.gazeteler || []) {
    const el = document.createElement('article'); el.className = 'kart basin-gazete';
    el.innerHTML = `<span class="rozet ${g.abonelik_ucret > 0 ? 'altin' : 'yesil'}">${g.abonelik_ucret > 0 ? tlYaz(g.abonelik_ucret) + ' / ay' : 'Ücretsiz'}</span><h2>${e(g.ad)}</h2><p class="alt">${e(g.slogan)}</p><p class="kucuk">Sahibi: ${e(g.sahip)} · ${fmt(g.abone, 0)} abone${g.abonem ? ' · Abonesin' : ''}${g.yaziyim ? ' · Yazarsın' : ''}</p>${g.son ? `<div class="basin-son"><span class="rozet ${g.son.tur === 'propaganda' ? 'kirmizi' : ''}">${e(BASIN_TUR[g.son.tur] || g.son.tur)}</span><h3>${e(g.son.baslik)}</h3><div class="kucuk">${e(tarihSaat(g.son.zaman))}</div></div>` : '<p class="kucuk">İlk sayısını bekliyor.</p>'}`;
    el.appendChild(basinDugme('Gazeteyi oku', () => ekranAc(() => gazeteEkrani(g.id)))); liste.appendChild(el);
  }
  if (!liste.children.length) liste.innerHTML = '<div class="bos">Henüz gazete yok. İlk gazeteyi sen kurabilirsin.</div>';
}
function gazeteKurModal(ucret) {
  basinForm('Gazete kur', `<p class="alt">Kuruluş için cüzdanından ${tlYaz(ucret)} ödenir.</p>` +
    basinAlan('gazAd', 'Gazete adı', 'required minlength="4" maxlength="40"') +
    basinAlan('gazSlogan', 'Slogan', 'maxlength="100"') +
    basinAlan('gazAbone', 'Aylık abonelik (₺) — ücretsiz için 0', 'type="number" min="0" step="1" required', 0),
    'Kuruluş bedelini öde ve kur', 'gazete_kur', m => ({ p_ad: $('#gazAd', m).value.trim(), p_slogan: $('#gazSlogan', m).value.trim(), p_abonelik: +$('#gazAbone', m).value }), r => ekranAc(() => gazeteEkrani(r.id)));
}
async function gazeteEkrani(id, veri) {
  let g = veri;
  if (!g) {
    yukleniyor('Gazete');
    try { g = await API.rpc('gazete_detay', { p_gazete: id }); }
    catch (err) { iskelet('Gazete', `<div class="kart">${e(hataCevir(err.message))}<button class="btn ikinci" onclick="yenidenCiz()">Tekrar dene</button></div>`); return; }
  }
  iskelet('Basın / Gazeteler', `<header class="kart basin-manset"><div class="kucuk">Oyuncu gazetesi</div><h1>${e(g.ad)}</h1><p>${e(g.slogan)}</p><p class="kucuk">Sahibi: ${e(g.sahip)} · ${fmt(g.abone, 0)} abone</p><span class="rozet ${g.abonelik_ucret > 0 ? 'altin' : 'yesil'}">${g.abonelik_ucret > 0 ? tlYaz(g.abonelik_ucret) + ' / ay' : 'Ücretsiz gazete'}</span>${g.abonelik_bitis ? `<p class="kucuk">Abonelik bitişi: ${e(tarihSaat(g.abonelik_bitis))}</p>` : ''}<div id="gazEylem"></div></header>
    <div id="gazYonetim"></div><div id="gazYayinlar">${(g.yayinlar || []).map(y => `<article class="kart basin-yazi"><span class="rozet ${y.tur === 'propaganda' ? 'kirmizi' : ''}">${e(BASIN_TUR[y.tur] || y.tur)}</span>${y.tur === 'propaganda' ? `<p class="basin-propaganda">Bu yayın siyasi propagandadır. Hedef parti: ${e(y.hedef_parti && (y.hedef_parti.ad || y.hedef_parti.kisa) || 'Belirtilmemiş')}</p>` : ''}<h2>${e(y.baslik)}</h2><div class="kucuk">${e(y.yazar)} · ${e(tarihSaat(y.zaman))}</div><div class="basin-metin">${e(y.metin)}</div>${y.kilitli ? '<div class="basin-kilit">Önizleme · Tam yazıyı okumak için gazeteye abone ol.</div>' : ''}${y.tur==='kose' && !y.kilitli && g.erisim ? `<div style="margin-top:10px"><button class="btn ikinci" onclick="gazeteKoseYorumGoster(${Number(y.id)},${Number(g.id)})">Yorumları gör / yorum yaz</button><div id="gaz_kose_yorum_${Number(y.id)}"></div></div>` : ''}</article>`).join('') || '<div class="bos">Henüz yazı yayımlanmamış.</div>'}</div>`, { geri: true });
  const eylem = $('#gazEylem');
  if (!g.erisim && g.abonelik_ucret > 0) eylem.appendChild(basinDugme('Abone ol · ' + tlYaz(g.abonelik_ucret), () => {
    basinForm('Gazeteye abone ol', `<p>${e(g.ad)} için cüzdanından ${tlYaz(g.abonelik_ucret)} ödenir. Abonelik bitişi işlemden sonra gösterilir.</p>`, 'Öde ve abone ol', 'gazete_abone_ol', () => ({ p_gazete: g.id }), r => gazeteEkrani(g.id, r));
  }, 'altin'));
  eylem.appendChild(basinDugme('Bu gazeteye bağış yap', () => aliciBagisModal('gazete',g.id,g.ad), 'ikinci'));

    yer.appendChild(basinDugme('Köşe yazarı işe al', () => basinForm('Yazarlık teklifi', basinAlan('gazKad', 'Oyuncunun kullanıcı adı', 'required maxlength="20"') + basinAlan('gazUcret', 'Yazı başına ücret (₺)', 'type="number" min="0" max="10000" step="1" required', 0), 'Teklif gönder', 'gazete_yazar_teklif', m => ({ p_gazete: g.id, p_kad: $('#gazKad', m).value.trim(), p_ucret: +$('#gazUcret', m).value }), r => gazeteEkrani(g.id, r))));
    for (const y of g.yazarlar || []) {

      el.appendChild(basinDugme('Yazarlığı sonlandır', () => basinForm('Yazarlığı sonlandır', `<p>${e(y.kad)} artık bu gazetede yazı yayımlayamayacak.</p>`, 'Sonlandır', 'gazete_yazar_cikar', () => ({ p_gazete: g.id, p_kad: y.kad }), r => gazeteEkrani(g.id, r))));
      $('#gazYazarlar').appendChild(el);

<script>/* Ortak piyasa ve Kazı Kazan ekranları. Ödül/fiyat/ödeme yalnızca Supabase RPC'de belirlenir. */
async function kazikazanEkrani(){
  yukleniyor("Kazı Kazan");
  try{kazikazanCiz(await API.rpc("kazikazan_durum"));}
  catch(err){iskelet("Kazı Kazan",'<div class="bos">'+e(hataCevir(err.message))+'</div>',{geri:true});}
}
function kazikazanCiz(d,son){
  var html='<div class="kart" style="border:2px solid var(--gold)"><h2>Kazı Kazan · 100 ₺</h2>';
  if(son){html+='<div style="background:var(--panel2);text-align:center;padding:22px 12px;border-radius:16px;margin:12px 0"><p class="kucuk">Kartının ödülü</p><div class="para '+(son.odul>100?'iyi':son.odul===0?'kotu':'')+'" style="font-size:40px">'+tlYaz(son.odul)+'</div><b>'+(son.odul===0?'Bu kart boş çıktı.':son.odul===100?'Bilet paranı geri aldın.':'Ödül cüzdanına yatırıldı!')+'</b></div>';}
  html+='<div class="kv"><span>Cüzdanım</span><b>'+tlYaz(son?son.cuzdan:d.cuzdan)+'</b></div>';
  html+='<button class="btn altin" onclick="kazikazanOyna()">100 ₺’ye yeni kart aç</button><p class="kucuk">Sanal oyun parası. Kartın sonucu sunucuda belirlenir, kazanma garantisi yoktur.</p></div>';
  html+='<div class="kart"><h2>Olasılık ve ödüller</h2>';
  [[0,"72%"],[100,"18%"],[200,"7%"],[1000,"2,5%"],[5000,"0,45%"],[10000,"0,05%"]].forEach(function(x){html+='<div class="kv"><span>'+tlYaz(x[0])+'</span><b>'+x[1]+'</b></div>';});
  html+='<p class="kucuk">Ortalama beklenen ödül 84,50 ₺/kart; uzun vadede devletin beklenen net payı 15,50 ₺/kart. Tek bir oyun sonucu değişebilir.</p></div>';
  html+='<div class="kart"><h2>Geçmiş kartlarım</h2><p class="alt">'+fmt(d.toplam_bilet)+' kart · Kazanılan '+tlYaz(d.toplam_odul)+'</p>';
  (d.son||[]).forEach(function(x){html+='<div class="kv"><span>#'+Number(x.id)+' · '+tarihSaat(x.zaman)+'</span><b class="'+(x.odul>100?'iyi':x.odul===0?'kotu':'')+'">'+tlYaz(x.odul)+'</b></div>';});
  html+='</div>';iskelet("Kazı Kazan",html,{geri:true});
}
async function kazikazanOyna(){
  if(!await onayla("Kazı Kazan","100 ₺ tutarında sanal kart açılacak. Boş çıkabilir. Onaylıyor musun?","Kartı aç"))return;
  try{var sonuc=await API.rpc("kazikazan_oyna");kazikazanCiz(await API.rpc("kazikazan_durum"),sonuc);}
  catch(err){bildir(hataCevir(err.message),true);}
}
function piyasaMiniGrafik(arr){
  if(!Array.isArray(arr)||arr.length<2)return '<p class="kucuk">Grafik için fiyat geçmişi oluşuyor.</p>';
  var v=arr.map(Number),min=Math.min.apply(null,v),max=Math.max.apply(null,v),f=Math.max(max-min,0.000001);
  var pts=v.map(function(p,i){return (i*300/(v.length-1)).toFixed(1)+','+(47-(p-min)*42/f).toFixed(1);}).join(' ');
  return '<svg role="img" aria-label="Son 24 saatin fiyat grafiği" viewBox="0 0 300 52" width="100%" height="52" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="'+(v[v.length-1]>=v[0]?'var(--good)':'var(--acc)')+'" stroke-width="2.4" stroke-linecap="round"/></svg>';
}
async function piyasaEkrani(){
  yukleniyor("Yatırım Borsası");
  try{piyasaCiz(await API.rpc("piyasa_durum"));}
  catch(err){iskelet("Yatırım Borsası",'<div class="bos">'+e(hataCevir(err.message))+'</div>',{geri:true});}
}
function piyasaCiz(d){
  D._piyasa=d;
  var liste=d.varliklar||[],makro=d.makro||{},portfoy=liste.reduce(function(s,x){return s+Number(x.deger||0);},0);
  var html='<div class="kart" style="border:2px solid var(--gold)"><h2>Tüm oyuncular için ortak piyasa</h2>';
  html+='<div class="kv"><span>Cüzdan</span><b>'+tlYaz(d.cuzdan)+'</b></div><div class="kv"><span>Portföy değeri</span><b>'+tlYaz(portfoy)+'</b></div>';
  html+='<p class="kucuk">Fiyat saati: '+tarihSaat(d.saat)+' · Her saat tek sunucu fiyatı. Herkes aynı fiyatı görür. Fiyatlar yükselebilir veya düşebilir. Bu fiyatlar gerçek borsa verileri değil, oyun ekonomisinin simülasyonudur.</p>';
  html+='<button class="btn ikinci" onclick="piyasaEkrani()">↻ Fiyatları yenile</button></div>';
  html+='<div class="kart"><h2>İktidarın ekonomi karnesi · Piyasa etkisi</h2>';
  [["Enflasyon","enflasyon"],["Büyüme","buyume"],["İşsizlik","issizlik"]].forEach(function(x){html+='<div class="kv"><span>'+x[0]+'</span><b>%'+fmt(makro[x[1]],1)+'</b></div>';});
  html+='<div class="kv"><span>Devlet hazinesi (oyun birimi)</span><b>'+fmt(makro.hazine,2)+'</b></div><div class="kv"><span>Devlet borcu (oyun birimi)</span><b>'+fmt(makro.borc,2)+'</b></div>';
  html+='<p class="kucuk">Enflasyon, borç, hazinenin durumu, büyüme ve işsizlik ortak kurları etkiler. Rastlantısal piyasa dalgalanmaları nedeniyle kazanç garanti değildir.</p></div>';
  liste.forEach(function(x){
    var deg=Number(x.degisim||0),deger=Number(x.deger||0),maliyet=Number(x.maliyet||0),kar=deger-maliyet;
    html+='<div class="kart"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>'+e(x.ad)+'</b><div class="kucuk">'+e(x.kod)+' · '+(x.sinif==='doviz'?'Döviz':x.sinif==='altin'?'Altın':'Sanal hisse grubu')+'</div></div>';
    html+='<div style="text-align:right"><b style="font-size:19px">'+tlYaz(x.fiyat)+'</b><div class="'+(deg>=0?'iyi':'kotu')+'">'+(deg>=0?'+':'')+'%'+fmt(deg,2)+' / saat</div></div></div>';
    html+='<div style="margin-top:8px">'+piyasaMiniGrafik(x.gecmis)+'</div>';
    html+='<div class="kv"><span>Miktarım</span><b>'+fmt(x.miktar,6)+'</b></div><div class="kv"><span>Portföy değeri</span><b>'+tlYaz(deger)+'</b></div>';
    html+='<div class="kv"><span>Kâr / zarar (gerçekleşmemiş)</span><b class="'+(kar>=0?'iyi':'kotu')+'">'+(kar>=0?'+':'')+tlYaz(kar)+'</b></div>';
    html+='<div class="satir"><button class="btn yarim altin" data-piyasa-kod="'+e(x.kod)+'" data-piyasa-yon="al">Al</button><button class="btn yarim ikinci" data-piyasa-kod="'+e(x.kod)+'" data-piyasa-yon="sat" '+(Number(x.miktar)<=0?'disabled':'')+'>Sat</button></div></div>';
  });
  html+='<div class="kart"><h2>Son işlemlerim</h2>';
  (d.islemler||[]).forEach(function(x){html+='<div class="kv"><span>'+ (x.yon==='al'?'▲ Alış':'▼ Satış')+' · '+e(x.kod)+'<div class="kucuk">'+tarihSaat(x.zaman)+' · '+fmt(x.miktar,6)+' adet · komisyon '+tlYaz(x.komisyon)+'</div></span><b>'+tlYaz(x.brut)+'</b></div>';});
  html+='<p class="kucuk">Alış ve satışta %0,3 komisyon (en az 1 ₺) hazineye gider. Açığa satış ve kaldıraç yoktur.</p></div>';
  iskelet("Yatırım Borsası",html,{geri:true});
  document.querySelectorAll('[data-piyasa-kod]').forEach(function(b){b.onclick=function(){piyasaEmir(b.dataset.piyasaKod,b.dataset.piyasaYon);};});
}
function piyasaEmir(kod,yon){
  var d=D._piyasa,v=(d.varliklar||[]).find(function(x){return x.kod===kod;});if(!v)return;
  var max=yon==='al'?Math.max(0,Math.floor(Number(d.cuzdan)/1.003)):Math.floor(Number(v.deger));
  var m=modal('<h3 style="font-size:19px;font-weight:800">'+e(v.ad)+' · '+(yon==='al'?'Alış':'Satış')+'</h3>'+
     '<p class="alt">Görünen fiyat: '+tlYaz(v.fiyat)+' · %0,3 komisyon, en az 1 ₺. Emir güncel sunucu fiyatından işlenir.</p>'+
     '<div class="alan"><label>Tutar (₺, en az 100)</label><input type="number" id="pTutar" min="100" step="100" value="'+Math.min(max,1000)+'" inputmode="numeric"></div>'+
     '<p class="kucuk">Yaklaşık azami işlem: '+tlYaz(max)+'</p><button class="btn altin" id="pOk">İşlemi onayla</button><button class="btn ikinci" onclick="modalKapat()">Vazgeç</button>');
  $("#pOk",m).onclick=async function(){
    var tutar=Math.round(Number($("#pTutar",m).value)),b=$("#pOk",m);
    if(!Number.isFinite(tutar)||tutar<100||tutar>max){bildir("Tutar 100 ₺ ile kullanılabilir bakiye arasında olmalı.",true);return;}
    b.disabled=true;
    try{var r=await API.rpc("piyasa_emir",{p_kod:kod,p_yon:yon,p_tutar:tutar});modalKapat();bildir((yon==='al'?'Alış':'Satış')+' gerçekleşti. Komisyon: '+tlYaz(r.komisyon));piyasaEkrani();}
    catch(err){b.disabled=false;bildir(hataCevir(err.message),true);}
  };
}
</script>

function emlakPazarCiz(d){
  const ilanlar=d.ilanlar||[];
  let h='<div class="kart"><h2>Oyuncular arası gayrimenkul pazarı</h2><p class="alt">Daire, dükkân ve villalarını satışa çıkarabilir veya başka bir oyuncudan satın alabilirsin. Haftalık kira getirisi başlangıç mülk değerinin %2,5’i temel alınarak hesaplanır; satış ilanındaki fiyat kirayı otomatik artırmaz. Satış bedelinin %2’si işlem vergisi olarak hazineye gider.</p><button class="btn ikinci" onclick="ekranAc(mulkEkrani)">Kendi mülklerim</button></div>';
  if(!ilanlar.length)h+='<div class="kart"><p class="alt">Henüz satılık mülk yok. İlk ilanı sen verebilirsin.</p></div>';
  ilanlar.forEach(function(x){
    h+='<div class="kart"><div class="kv"><b>'+e({daire:'Daire',dukkan:'Dükkân',villa:'Villa'}[x.tip]||x.tip)+' #'+x.mulk_id+' · '+e(x.il)+'</b><span class="rozet altin">'+(x.benim?'Senin ilanın':'Satılık')+'</span></div>';

function mulkIlanModal(id,alis){

  $("#mulkOK",m).onclick=async function(){
    let b=$("#mulkOK",m),f=Math.round(Number($("#mulkFiyat",m).value));

  };
}
async function emlakIlanAl(id,fiyat){

  try{emlakPazarCiz(await API.rpc("mulk_ilan_satin_al",{p_ilan:id}));toast("Mülk artık senin!");}
  catch(err){toast(hataCevir(err.message),true);}
}
async function emlakIlanIptal(id){
  if(!await onayla("İlanı kaldır","Mülkün sende kalacak. Satış ilanını kaldırmak istiyor musun?","İlanı kaldır"))return;
  try{emlakPazarCiz(await API.rpc("mulk_ilan_iptal",{p_ilan:id}));toast("İlan kaldırıldı.");}
  catch(err){toast(hataCevir(err.message),true);}
}
async function maasEkrani(){
  yukleniyor("Meclis Maaş Düzenlemeleri");
  try{maasCiz(await API.rpc("maas_durum"));}
  catch(err){iskelet("Meclis Maaş Düzenlemeleri",'<div class="bos">'+e(hataCevir(err.message))+'</div>',{geri:true});}
}
function maasCiz(d){
  const o=d.oranlar||{};
  let h='<div class="kart"><h2>Meclis maaş düzenlemeleri</h2><p class="alt">Cumhurbaşkanı kendi maaşını, milletvekilleri vekil maaşını değiştirmeyi önerebilir. Teklif 24 saat milletvekili oyuna açık kalır. Kabul edilirse tüm ilgili makamlara aynı oran uygulanır.</p>';
  h+='<div class="kv"><span>Cumhurbaşkanı maaş katsayısı</span><b>×'+fmt(o.cb||1,2)+'</b></div><div class="kv"><span>Milletvekili maaş katsayısı</span><b>×'+fmt(o.mv||1,2)+'</b></div>';
  if(d.cb_miyim)h+='<button class="btn altin" onclick="maasTeklifModal(\'cb\','+Number(o.cb||1)+')">Cumhurbaşkanı maaşı teklif et</button>';
  if(d.vekil_miyim)h+='<button class="btn altin" onclick="maasTeklifModal(\'mv\','+Number(o.mv||1)+')">Milletvekili maaşı teklif et</button>';
  h+='</div>';
  (d.teklifler||[]).forEach(function(t){
    h+='<div class="kart"><div class="baslik"><b>'+(t.tur==='cb'?'Cumhurbaşkanı':'Milletvekili')+' maaşı</b><span class="rozet '+(t.durum==='kabul'?'yesil':t.durum==='ret'?'kirmizi':'altin')+'">'+e({oylamada:'Oylamada',kabul:'Kabul',ret:'Reddedildi'}[t.durum]||t.durum)+'</span></div>';
    h+='<div class="kv"><span>Eski → Önerilen</span><b>×'+fmt(t.eski,2)+' → ×'+fmt(t.yeni,2)+'</b></div><div class="kv"><span>Oylar</span><b>'+fmt(t.evet)+' evet / '+fmt(t.hayir)+' hayır</b></div><p class="kucuk">Bitiş: '+tarihSaat(t.bit)+'</p>';
    if(t.durum==='oylamada'&&d.vekil_miyim)h+='<div class="satir"><button class="btn yarim '+(t.oyum==='evet'?'altin':'ikinci')+'" onclick="maasOyVer('+t.id+',\'evet\')">Evet</button><button class="btn yarim '+(t.oyum==='hayir'?'altin':'ikinci')+'" onclick="maasOyVer('+t.id+',\'hayir\')">Hayır</button></div>';
    h+='</div>';
  });
  if(!(d.teklifler||[]).length)h+='<div class="kart"><p class="alt">Henüz maaş teklifi yok.</p></div>';
  iskelet("Maaş Düzenlemeleri",h,{geri:true});
}
function maasTeklifModal(tur,mevcut){
  const m=modal('<h3 style="font-size:19px;font-weight:800">Maaş değişikliği teklif et</h3><p class="alt">Mevcut katsayı ×'+fmt(mevcut,2)+'. Yeni katsayı 0,5 ile 3 arasında olmalı. Yürürlüğe girmesi için Meclis oylamasında kabul edilmesi gerekir.</p><div class="alan"><label>Yeni maaş katsayısı (ör. 1.10 = %10 zam)</label><input id="maasKatsayi" type="number" min="0.5" max="3" step="0.05" value="'+(mevcut+0.1).toFixed(2)+'"></div><button class="btn altin" id="maasOK">Meclise sun</button><button class="btn ikinci" onclick="modalKapat()">Vazgeç</button>');
  $("#maasOK",m).onclick=async()=>{const b=$("#maasOK",m);b.disabled=true;try{await API.rpc("maas_teklif_ver",{p_tur:tur,p_carpan:Number($("#maasKatsayi",m).value)});modalKapat();toast("Meclis oylaması başladı.");maasEkrani();}catch(err){b.disabled=false;toast(hataCevir(err.message),true);}};
}
async function maasOyVer(id,oy){

  catch(err){toast(hataCevir(err.message),true);}
}
async function bakanSoruEkrani(){
  yukleniyor("Bakanlara Yazılı Sorular");

function bakanSoruCiz(d){
  D._bakanSoru=d;
  let h='<div class="kart"><h2>Yazılı soru önergeleri</h2><p class="alt">Milletvekilleri bakanlara günde üç soru sorabilir. Bakan cevapları Meclis arşivinde tüm oyunculara açık tutulur.</p>';
  if(d.vekilim)h+='<button class="btn altin" onclick="bakanSoruModal()">Bakanlığa yazılı soru ver</button>';
  h+='</div>';
  (d.sorular||[]).forEach(function(s){
    h+='<div class="kart"><h3>'+e(s.konu)+'</h3><p class="kucuk">'+e(s.bakanlik)+' · '+e(s.soran)+' · '+tarihSaat(s.zaman)+'</p><p style="margin:10px 0;white-space:pre-wrap">'+e(s.soru)+'</p>';
    h+=s.yanit?'<div class="olay"><b>Bakanın yanıtı</b><p style="white-space:pre-wrap;margin-top:6px">'+e(s.yanit)+'</p><div class="kucuk">'+e(s.yanitlayan)+' · '+tarihSaat(s.yanit_at)+'</div></div>':'<span class="rozet altin">Yanıt bekliyor</span>';
    if(s.cevaplayabilirim)h+='<button class="btn altin" onclick="bakanYanitModal('+s.id+')">Bakan olarak yanıtla</button>';

function bakanSoruModal(){

}
function bakanYanitModal(id){
  const m=modal('<h3>Yazılı soruya yanıt</h3><div class="alan"><label>Bakanlık yanıtı</label><textarea class="alanmetin" maxlength="3000" id="bakanYanit"></textarea></div><button class="btn altin" id="bakanOK">Yanıtı yayımla</button>');
  $("#bakanOK",m).onclick=async()=>{let b=$("#bakanOK",m);b.disabled=true;try{await API.rpc("bakan_soru_yanit",{p_id:id,p_yanit:$("#bakanYanit",m).value});modalKapat();toast("Bakanlık yanıtı yayımlandı.");bakanSoruEkrani();}catch(err){b.disabled=false;toast(hataCevir(err.message),true);}};

async function anketEkrani(){
  yukleniyor("Haftalık Siyasi Anket");
  try{anketCiz(await API.rpc("anket_durum"));}
  catch(err){iskelet("Haftalık Siyasi Anket",'<div class="bos">'+e(hataCevir(err.message))+'</div>',{geri:true});}
}
function anketCiz(d){
  let h='<div class="kart"><h2>Haftalık parti anketi</h2><p class="alt">Sadece oyuna kayıtlı oyuncuların katıldığı oyun içi ankettir; gerçek Türkiye kamuoyunu temsil etmez. Oy her hafta yenilenir.</p><div class="kv"><span>Hafta</span><b>'+e(d.hafta)+'</b></div><div class="kv"><span>Katılım</span><b>'+fmt(d.toplam)+' oyuncu</b></div></div>';
  (d.partiler||[]).sort((a,b)=>b.oy-a.oy).forEach(function(x){
    const oran=d.toplam?100*x.oy/d.toplam:0;
    h+='<div class="kart"><div class="kv"><span><b>'+e(x.ad)+'</b></span><b>%'+fmt(oran,1)+' · '+fmt(x.oy)+' oy</b></div><div class="bar"><i style="width:'+oran+'%;background:'+e(x.renk)+'"></i></div>';
    if(!d.oyum)h+='<button class="btn ikinci" onclick="anketOyVer('+x.id+')">Bu partiye oy ver</button>';
    else if(Number(d.oyum)===Number(x.id))h+='<span class="rozet yesil">Bu haftaki tercihin</span>';
    h+='</div>';
  });
  iskelet("Haftalık Parti Anketi",h,{geri:true});
}
async function anketOyVer(id){
  if(!await onayla("Siyasi anket","Bu haftaki oyunu bu partiye vermek istiyor musun? Oyunu değiştiremezsin.","Oy ver"))return;
  try{anketCiz(await API.rpc("anket_oyla",{p_parti:id}));toast("Anket oyun kaydedildi.");}
  catch(err){toast(hataCevir(err.message),true);}
}
</script>
<script>/* Partilerin haftalık iletişimi ve demokratik disiplin oylamaları. */
async function grupToplantiEkrani(pid){
  yukleniyor("Parti Grup Toplantıları");

}
function partiDisiplinCiz(pid,d){
  let h='<div class="kart"><h2>Parti disiplin kurulu</h2><p class="alt">Genel başkan üyeyi disiplin oylamasına sevk edebilir. İhraç için 24 saatlik oylamada hedef üye hariç seçmenlerin çoğunluğu gerekir. Genel başkan bu yolla ihraç edilemez.</p>';

    let bitti=k.durum!=='oylamada';
    h+='<div class="kart"><div style="display:flex;justify-content:space-between;gap:10px"><b>'+e(k.hedef)+'</b><span class="rozet '+(k.durum==='ihrac'?'kirmizi':k.durum==='ret'?'yesil':'altin')+'">'+e({oylamada:'Oylama sürüyor',ihrac:'İhraç edildi',ret:'Öneri reddedildi'}[k.durum]||k.durum)+'</span></div><p class="alt" style="margin-top:8px">'+e(k.gerekce)+'</p><div class="kv"><span>Oylama</span><b>'+fmt(k.evet)+' evet / '+fmt(k.hayir)+' hayır</b></div><p class="kucuk">Oylama bitişi: '+tarihSaat(k.bit)+'</p>';

    else if(k.oyum)h+='<div class="kucuk">Kullandığın oy: '+(k.oyum==='evet'?'İhraç edilsin':'İhraç edilmesin')+'</div>';
    h+='</div>';
  });
  if(!(d.kayitlar||[]).length)h+='<div class="kart"><p class="alt">Henüz disiplin oylaması yok.</p></div>';
  iskelet("Parti Disiplin Kurulu",h,{geri:true});
}
function partiDisiplinModal(pid){
  const m=modal('<h3>Üyeyi disipline sevk et</h3><p class="alt">Partinin üyeleri 24 saat oy kullanacak. İhraç için üye çoğunluğu gerekir.</p><div class="alan"><label>Üyenin kullanıcı adı</label><input id="disKad" maxlength="40"></div><div class="alan"><label>Gerekçe</label><textarea class="alanmetin" id="disGerekce" maxlength="500"></textarea></div><button class="btn tehlike" id="disOK">Oylamayı başlat</button>');

async function partiDisiplinOy(pid,id,oy){

}

  --bg:#0E1530; --bg2:#0A1026; --panel:#151E3D; --panel2:#1D2850; --panel3:#283563;
  --line:rgba(164,184,255,.10); --line2:rgba(164,184,255,.19);
  --txt:#EEF1F8; --txt2:#C9D1E6; --mut:#98A4C4; --faint:#6E7A9C;
  --ink:#7B61FF; --ink2:#A895FF; --inkbg:rgba(123,97,255,.16);
  --al:#F0454B; --al2:#FF7479; --albg:rgba(240,69,75,.15);
  --good:#34C98A; --warn:#F2B33D;
  --paper:#F4F6FB; --paperInk:#1B2140; --paperLine:#D5DAE8;
  /* eski adlar (satır içi stillerde geçenler) yeni kimliğe bağlanır */
  --acc:var(--ink); --acc2:var(--al2); --gold:var(--ink2); --gold2:var(--ink2);
  --disp:"Kurul Display","Arial Narrow","Roboto Condensed",sans-serif;
  --r:14px; --rBtn:11px;
  --safeT:env(safe-area-inset-top,0px); --safeB:max(env(safe-area-inset-bottom,0px),12px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overscroll-behavior:none}
body{color:var(--txt);font-family:-apple-system,"SF Pro Text",Roboto,"Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overflow:hidden}
input,select,textarea{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ink2);outline-offset:2px;border-radius:6px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* ---- Üst çubuk ve alt sekmeler ---- */
.ust{padding:calc(var(--safeT) + 10px) 14px 10px 16px;display:flex;align-items:center;gap:8px;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.ust h1{font-family:var(--disp);font-size:25px;font-weight:700;letter-spacing:.1px;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ust .geri{width:36px;height:36px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:22px;line-height:1;flex:none}
.ust .ikon{position:relative;width:36px;height:36px;border-radius:10px;background:var(--panel);display:grid;place-items:center;flex:none}
.ust .ikon svg{width:20px;height:20px}
.ust .ikon.portre-ikon{background:none;padding:0;overflow:visible}
.ust .ikon.portre-ikon .portre{width:36px;height:36px}
.ust .para-cip{width:auto;padding:0 10px;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--txt);white-space:nowrap;letter-spacing:.2px}
.icerik{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--safeB) + 84px)}
.icerik.tam{padding-bottom:calc(var(--safeB) + 24px)}
.sekmeler{position:absolute;left:0;right:0;bottom:0;display:flex;padding:0 4px var(--safeB);background:var(--bg2);border-top:1px solid var(--line);z-index:6;touch-action:pan-y}
.sekmeler button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 5px;font-size:11px;font-weight:600;color:var(--faint)}
.sekmeler button svg{width:22px;height:22px}
.sekmeler button.aktif{color:var(--txt)}
.sekmeler button.aktif::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.sekmeler button.aktif svg{color:var(--ink2)}
.sayi{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--al);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.sekmeler .sayi{top:3px;right:calc(50% - 22px);border-color:var(--bg2)}
.sekmeler .nokta{position:absolute;top:7px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--al);border:2px solid var(--bg2)}

/* ---- Bölümler (kart) ---- */
.kart{background:var(--panel);border-radius:var(--r);padding:15px 15px 14px;margin-bottom:12px}
.kart h2{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.15;color:var(--txt);margin-bottom:8px;letter-spacing:.1px;text-transform:none}
.kart h3{font-family:var(--disp);font-size:22px;font-weight:700;line-height:1.15;margin-bottom:4px}
.kart.duz{background:none;padding:4px 0 0}
.kart.cizgili{border-left:4px solid var(--parti,var(--ink));border-radius:4px var(--r) var(--r) 4px}
.alt{color:var(--mut);font-size:13.5px}
.kucuk{font-size:12.5px;color:var(--faint)}
.bolum-bas{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 2px 8px}
.bolum-bas h2{font-family:var(--disp);font-size:22px;font-weight:700}
.bolum-bas a,.bolum-bas button{font-size:13px;font-weight:700;color:var(--ink2)}

/* ---- Düğmeler ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:var(--rBtn);font-weight:700;font-size:15px;background:var(--ink);color:#fff;margin-top:10px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.ikinci{background:var(--panel2);color:var(--txt)}
.btn.altin{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1.5px rgba(168,149,255,.55)}
.btn.altin:active{background:var(--inkbg)}
.btn.tehlike{background:transparent;color:var(--al2);box-shadow:inset 0 0 0 1.5px rgba(240,69,75,.45)}
.btn.canli{background:var(--al)}
.btn:disabled{opacity:.42;pointer-events:none}
.btn.yarim{width:auto;flex:1}
.btn svg{width:19px;height:19px;flex:none}
#hReklam,#hMagaza{flex-direction:column;gap:2px;line-height:1.25}
.satir{display:flex;gap:8px}
.alan{margin-top:10px}
.alan label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px;font-weight:600}
.alan input,.alan select{width:100%;padding:13px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);outline:none;font-size:16px}
.alan input:focus,.alan select:focus,textarea:focus{border-color:var(--ink2)}

/* ---- Satırlar, etiketler ---- */
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--mut)}.kv .v{font-weight:600;text-align:right}
.rozet{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--txt2);white-space:nowrap}
.rozet.kirmizi{background:var(--albg);color:var(--al2)}
.rozet.kirmizi::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--al);animation:nabiz 1.6s ease-in-out infinite}
.rozet.yesil{background:rgba(52,201,138,.14);color:var(--good)}
.rozet.altin{background:var(--inkbg);color:var(--ink2)}
.rozet.sari{background:rgba(242,179,61,.14);color:var(--warn)}
@keyframes nabiz{50%{opacity:.25}}
.parti{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.parti .nok{width:10px;height:10px;border-radius:2px;flex:none}
.liste-satir{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.liste-satir:last-child{border-bottom:0}
.liste-satir .orta{flex:1;min-width:0}
.liste-satir .orta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amb{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;flex:none}
.amb svg{width:22px;height:22px}

/* ---- Seçim olay kartları ---- */
.olay{border-radius:var(--r);padding:15px;margin-bottom:12px;background:var(--panel);border-left:4px solid var(--panel3)}
.olay.oy{border-left-color:var(--al);background:linear-gradient(90deg,rgba(240,69,75,.10),var(--panel) 55%)}
.olay.basvuru{border-left-color:var(--ink)}
.olay .baslik{display:flex;align-items:center;justify-content:space-between;gap:8px}
.olay .baslik b{font-family:var(--disp);font-size:20px;font-weight:700;line-height:1.15}
.sayac{font-family:var(--disp);font-variant-numeric:tabular-nums;font-weight:700;font-size:34px;letter-spacing:.3px;margin-top:4px;line-height:1.05}
.takvim-satir{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.takvim-satir:last-child{border-bottom:0}
.takvim-satir .gun{width:46px;text-align:center;flex:none;border-radius:8px;padding:4px 0;background:var(--bg)}
.takvim-satir .gun b{display:block;font-family:var(--disp);font-size:22px;line-height:1.05}
.takvim-satir .gun span{font-size:11px;color:var(--mut)}
.bar{height:8px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}

/* ---- Oy pusulası (kâğıt) ve tercih mührü ---- */
.pusula-kagit{background:var(--paper);color:var(--paperInk);border-radius:6px;padding:6px 14px 4px;margin-top:10px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.pusula-kagit .pusula-bas{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 10px;border-bottom:2px solid var(--paperInk)}
.pusula-kagit .pusula-bas b{font-family:var(--disp);font-size:19px}
.pusula-kagit .pusula-bas span{font-size:12px;color:#5b6486}
.pusula-secenek{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--paperLine);cursor:pointer;position:relative}
.pusula-secenek:last-child{border-bottom:0}
.pusula-kagit .pusula-secenek b{color:var(--paperInk)}
.pusula-kagit .kucuk,.pusula-kagit .vaat{color:#5b6486}
.pusula-kagit .amb{background:#fff!important;box-shadow:inset 0 0 0 1.5px var(--paperLine)}
.pusula-kagit .daire{display:none}
.pusula-secenek .daire,.pusula-secenek .muhur-yeri{width:52px;height:52px;border-radius:50%;border:1.5px dashed #b8bfd4;flex:none;display:grid;place-items:center;margin-left:auto}
.pusula-secenek.secili .daire,.pusula-secenek.secili .muhur-yeri{border-color:transparent}
.pusula-secenek.secili .muhur-yeri::after,.pusula-secenek.secili .daire::after{content:"TERCİH";width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.5px;color:var(--ink);border:3px double var(--ink);transform:rotate(-16deg);animation:mhr .32s cubic-bezier(.2,1.5,.4,1);background:rgba(123,97,255,.06)}
@keyframes mhr{from{transform:rotate(-16deg) scale(1.9);opacity:0}to{transform:rotate(-16deg) scale(1);opacity:1}}
.mühür{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,16,38,.72);animation:sol .15s}
.mühür div{width:168px;height:168px;border-radius:50%;border:6px double var(--ink2);color:var(--ink2);display:grid;place-items:center;text-align:center;font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.05;transform:rotate(-14deg);animation:bas .45s cubic-bezier(.2,1.6,.4,1);background:rgba(123,97,255,.12)}
.mühür small{font-size:13px;letter-spacing:.4px;display:block;margin-top:4px}
@keyframes bas{from{transform:rotate(-14deg) scale(2.4);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.ref-pusula{display:flex;gap:16px;justify-content:center;margin:14px 0;padding:18px 10px;background:var(--paper);border-radius:6px}
.ref-daire{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:24px;border:3px solid #c3c9da;transition:transform .12s,box-shadow .12s}
.ref-daire.evet{background:#fff;color:var(--paperInk)}.ref-daire.hayir{background:#5d3a25;color:#fff;border-color:#4a2c1a}
.ref-daire.secili{box-shadow:0 0 0 4px var(--ink);transform:scale(1.04)}
.ref-sonuc{height:14px;border-radius:4px;background:var(--al);overflow:hidden;margin-top:6px}.ref-sonuc i{display:block;height:100%;background:var(--good)}.ref-sonuc.ince{height:6px}
.d-halkoylamasinda{background:var(--albg);color:var(--al2)}

/* ---- Seçim gecesi: sonuç gösterisi ---- */
.sonuc-sahne{background:var(--bg2);border-radius:var(--r);padding:16px 15px;margin-bottom:12px}
.sonuc-sahne .baslik-satir{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sonuc-sahne h2{font-family:var(--disp);font-size:24px;font-weight:700}
.dagilim{display:flex;height:16px;border-radius:3px;overflow:hidden;margin:12px 0 6px;background:var(--panel3)}
.dagilim i{display:block;height:100%;animation:dol .9s cubic-bezier(.3,.7,.2,1) both}
.sonuc-satir{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.sonuc-satir:last-child{border-bottom:0}
.sonuc-satir .yuzde{font-family:var(--disp);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sonuc-satir .cubuk{grid-column:1/-1;height:6px;border-radius:2px;background:var(--panel3);overflow:hidden}
.sonuc-satir .cubuk i{display:block;height:100%;animation:dol 1.1s cubic-bezier(.3,.7,.2,1) both}
.sonuc-satir.kazanan .yuzde{color:#fff}
.kazanan-bant{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--panel2);margin-bottom:10px;animation:sol .5s .9s both}
@keyframes dol{from{width:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

/* ---- Harita, segment, modal, bildirim ---- */
.harita svg path{transition:fill-opacity .2s}
.harita svg path:active{fill-opacity:.6}
.lejant{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12.5px}
.segment{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.segment button{flex:1;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mut)}
.segment button.aktif{background:var(--panel2);color:var(--txt)}
.modal-arka{position:fixed;inset:0;background:rgba(6,10,26,.66);z-index:20;display:flex;align-items:flex-end;animation:sol .2s}
.modal{width:100%;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:8px 16px calc(var(--safeB) + 16px);animation:yuk .25s cubic-bezier(.2,.9,.3,1)}
.modal h3{font-family:var(--disp);font-size:23px!important;font-weight:700!important;line-height:1.15}
.modal .tutamak{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 12px}
@keyframes yuk{from{transform:translateY(100%)}to{transform:none}}
@keyframes sol{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--safeB) + 90px);background:var(--panel3);padding:12px 14px;border-radius:10px;z-index:40;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:sol .2s;border-left:4px solid var(--good)}
.toast.hata{border-left-color:var(--al);background:#3a1d2a}

/* ---- Karşılama ---- */
.karsila{flex:1;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safeT) + 24px) 22px calc(var(--safeB) + 24px);overflow-y:auto}
.karsila h1{font-family:var(--disp);font-size:44px;font-weight:700;line-height:.98;letter-spacing:-.2px}
.karsila p.giris{color:var(--mut);margin:12px 0 22px;font-size:15.5px;max-width:34ch}
.logo{width:64px;height:64px;border-radius:50%;border:4px double var(--ink2);color:var(--ink2);display:grid;place-items:center;margin-bottom:18px;transform:rotate(-12deg)}
.logo svg{width:30px;height:30px}
.hemisikl{width:100%;max-width:360px;margin:0 auto 16px;display:block}
.hemisikl circle{animation:koltuk .4s both;transform-box:fill-box;transform-origin:center}
@keyframes koltuk{from{opacity:0;transform:scale(.3)}}
.hata-metin{color:var(--al2);font-size:13.5px;margin-top:10px;min-height:1px}
.onay{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--txt2)}
.onay input{width:20px;height:20px;accent-color:var(--ink);flex:none;margin-top:1px}
a.bag{color:var(--ink2);text-decoration:none;font-weight:600}

/* ---- Seçiciler ---- */
.renkler{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.renkler button{aspect-ratio:1;border-radius:8px;border:3px solid transparent}
.renkler button.secili{border-color:#fff}
.amblemler{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.amblemler button{aspect-ratio:1;border-radius:8px;background:var(--bg);display:grid;place-items:center;border:2px solid transparent}
.amblemler button svg{width:22px;height:22px}
.amblemler button.secili{border-color:var(--ink2)}
.bos{color:var(--mut);text-align:center;padding:18px 8px;font-size:14px}
.ara{position:sticky;top:-14px;background:var(--bg);padding:4px 0 8px;z-index:2}
.metin p{margin-bottom:10px;color:var(--txt2);font-size:14.5px;line-height:1.55;user-select:text}
.metin h4{margin:16px 0 6px;font-family:var(--disp);font-size:19px}
.yukleniyor{display:grid;place-items:center;padding:40px;color:var(--mut)}
.yukleniyor::before{content:"";width:28px;height:28px;border-radius:50%;border:3px solid var(--panel3);border-top-color:var(--ink2);animation:don .8s linear infinite;margin-bottom:10px}
@keyframes don{to{transform:rotate(360deg)}}
.cb-kart{display:flex;align-items:center;gap:12px}
.cb-kart .amb{width:48px;height:48px;border-radius:10px}
.tablo{width:100%;border-collapse:collapse;font-size:13.5px}
.tablo td,.tablo th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.tablo th{color:var(--mut);font-weight:600;font-size:12.5px}
.tablo td.s,.tablo th.s{text-align:right;font-variant-numeric:tabular-nums}

/* ---- Sohbet ---- */
.sohbet{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.akis{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px}
.balon-satir{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.balon-satir.benim{align-self:flex-end;flex-direction:row-reverse}
.balon-satir .portre{width:30px;height:30px;flex:none}
.balon{max-width:84%;align-self:flex-start;background:var(--panel2);border-radius:14px 14px 14px 4px;padding:7px 11px 6px;font-size:15px;line-height:1.38;word-wrap:break-word;user-select:text;-webkit-user-select:text}
.balon-satir .balon{max-width:100%}
.balon .tx{white-space:pre-wrap}
.balon.benim{align-self:flex-end;background:#3B2F86;border-radius:14px 14px 4px 14px}
.balon .kim{font-size:12.5px;font-weight:800;margin-bottom:1px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.balon .kim .unv{font-weight:600;color:var(--ink2);font-size:11.5px}
.balon .ne{font-size:10.5px;color:var(--faint);text-align:right;margin-top:2px}
.balon.benim .ne{color:#B7AEEA}
.yazbar{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(var(--safeB) + 2px);border-top:1px solid var(--line);background:var(--bg2)}
.yazbar textarea{flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);outline:none;font:inherit;font-size:16px;color:var(--txt)}
.yazbar button{width:42px;height:42px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.yazbar button:disabled{opacity:.4}
details.vekil-bakanlik{border-top:1px solid var(--line);padding:8px 0}
details.vekil-bakanlik summary{cursor:pointer;list-style:none}
details.vekil-bakanlik summary::-webkit-details-marker{display:none}
.kanal{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.kanal:last-child{border-bottom:0}
.kanal .kik{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:21px;flex:none}
.yayin{border-left:4px solid var(--ink);padding:12px 12px 10px;background:var(--panel);border-radius:4px 12px 12px 4px;margin-bottom:10px}
.yayin.yeni{background:linear-gradient(90deg,var(--inkbg),var(--panel) 60%)}
.yayin .ust2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.yayin .unv{font-size:12.5px;color:var(--ink2);font-weight:700}
.yayin p{margin-top:6px;font-size:15px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.kisisel{display:flex;gap:10px;padding:11px 12px;background:var(--panel);border-radius:10px;margin-bottom:8px;font-size:14px}
.kisisel.yeni{box-shadow:inset 3px 0 0 var(--al)}
textarea.alanmetin{width:100%;min-height:120px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);outline:none;font:inherit;font-size:16px;color:var(--txt);resize:vertical}
.secenek{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--panel2);margin-top:8px;border:2px solid transparent;cursor:pointer}
.secenek.secili{border-color:var(--ink2)}
.secenek.pasif{opacity:.45;pointer-events:none}

/* ---- Devlet göstergeleri, kanunlar ---- */
.gosterge{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.gosterge>div{background:var(--panel);padding:10px 10px 9px;display:flex;flex-direction:column}
.gosterge .ad{min-height:2.5em;line-height:1.25;font-size:12px;color:var(--mut);font-weight:600}
.gosterge .deger{font-family:var(--disp);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.05}
.gosterge .fark{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.iyi{color:var(--good)}.kotu{color:var(--al2)}
.durum{display:inline-flex;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:800;white-space:nowrap}
.d-gorusmede{background:rgba(90,160,255,.15);color:#8CC2FF}.d-oylamada{background:var(--albg);color:var(--al2)}
.d-cb_onayinda,.d-israr{background:var(--inkbg);color:var(--ink2)}.d-yururlukte{background:rgba(52,201,138,.14);color:var(--good)}
.d-ret,.d-dustu,.d-kaduk,.d-geri_cekildi{background:var(--panel2);color:var(--mut)}
.oybtn{display:flex;gap:8px;margin-top:10px}.oybtn button{flex:1;padding:12px 6px;border-radius:10px;font-weight:800;background:var(--panel2);border:2px solid transparent}
.oybtn button.sec-kabul{border-color:var(--good);color:var(--good)}.oybtn button.sec-ret{border-color:var(--al);color:var(--al2)}.oybtn button.sec-cekimser{border-color:var(--mut)}
.zaman-cizgi{display:flex;gap:4px;margin-top:10px}.zaman-cizgi div{flex:1;height:5px;border-radius:2px;background:var(--panel3)}.zaman-cizgi div.ok{background:var(--good)}.zaman-cizgi div.simdi{background:var(--ink2)}
.gazete-bas{text-align:center;font-family:Georgia,'Times New Roman',serif;border-bottom:3px double var(--line2);padding-bottom:10px;margin-bottom:12px}
.gazete-bas h2{font-size:27px;font-weight:700;letter-spacing:.3px;color:var(--txt);text-transform:none;margin:0;font-family:Georgia,'Times New Roman',serif}
.gazete-kayit{padding:12px 0;border-bottom:1px solid var(--line)}
.gazete-kayit .gb{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:700;margin-top:4px}
.gazete-kayit p{font-size:14px;color:var(--txt2);margin-top:4px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.payinput{display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:center;padding:4px 0}
.payinput input{padding:9px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);font-size:16px;text-align:right;width:100%}
.vaat{font-size:13px;color:var(--txt2);font-style:italic;margin-top:3px;white-space:normal}
.rozetler{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.anahtar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.anahtar:last-child{border-bottom:0}
.anahtar input{width:46px;height:28px;appearance:none;-webkit-appearance:none;background:var(--panel3);border-radius:14px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.anahtar input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.anahtar input:checked{background:var(--ink)}.anahtar input:checked::after{left:21px}
.para{font-family:var(--disp);font-size:40px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums;line-height:1}
.eylemler{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.eylem{background:var(--panel);border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .08s}
.eylem:active{transform:scale(.96)}
.eylem b{font-size:14.5px}
.eylem .kucuk{line-height:1.3}
.eylem:disabled{opacity:.4}
.cip{display:inline-flex;padding:3px 7px;border-radius:5px;font-size:12px;font-weight:700;background:rgba(52,201,138,.13);color:var(--good);margin:3px 4px 0 0;white-space:nowrap}
.cip.notr{background:var(--panel3);color:var(--txt2)}
details.acilir summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--txt2);margin-top:10px}
details.acilir ul{margin:6px 0 0 18px;font-size:13px;color:var(--mut)}
.taahhut{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:12px;font-weight:700;background:var(--inkbg);color:var(--ink2);margin:3px 4px 0 0}
.taahhut.ok{background:rgba(52,201,138,.14);color:var(--good)}.taahhut.yok{background:var(--panel2);color:var(--mut)}
.hareket{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hareket:last-child{border-bottom:0}.hareket .t{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- Gündem: kayan haber şeridi, takvim şeridi, bugün listesi ---- */
.serit{display:flex;align-items:center;gap:10px;margin:-14px -16px 14px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
.serit .etiket{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--al2)}
.serit .etiket::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--al);animation:nabiz 1.6s ease-in-out infinite}
.serit .kaydir{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 92%,transparent)}
.serit .kaydir span{display:inline-block;padding-left:100%;animation:kay var(--sure,60s) linear infinite;font-size:13px;color:var(--txt2)}
.serit .kaydir span i{font-style:normal;color:var(--faint);margin:0 14px}
@keyframes kay{to{transform:translateX(-100%)}}
.sahne{padding:2px 2px 4px;margin-bottom:6px}
.sahne .ne{font-size:13.5px;color:var(--mut)}
.sahne .olay-adi{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1.02;margin-top:2px}
.sahne .geri-sayim{font-family:var(--disp);font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-top:6px;letter-spacing:.5px}
.ay-serit{position:relative;margin:16px 0 4px}
.ay-serit .gunler{display:grid;grid-template-columns:repeat(var(--gun,30),1fr);gap:2px;height:22px}
.ay-serit .gunler i{border-radius:2px;background:var(--panel)}
.ay-serit .gunler i.bel{background:#2E7D64}.ay-serit .gunler i.kur{background:#8A6A1F}.ay-serit .gunler i.gen{background:#5D47D6}
.ay-serit .gunler i.sec{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.ay-serit .gunler i.gecti{opacity:.35}
.ay-serit .imlec{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;border-radius:1px}
.ay-serit .imlec::after{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:#fff}
.ay-lejant{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.ay-lejant span{display:inline-flex;align-items:center;gap:5px}.ay-lejant i{width:10px;height:10px;border-radius:2px;display:inline-block}
.meclis-serit{display:flex;height:10px;border-radius:2px;overflow:hidden;margin:12px 0 4px;gap:1px}
.meclis-serit i{display:block;height:100%}
.yapilacak{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.yapilacak:last-child{border-bottom:0}
.yapilacak .yik{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--panel2);color:var(--txt2)}
.yapilacak .yik svg{width:20px;height:20px}
.yapilacak.acil .yik{background:var(--al);color:#fff}
.yapilacak.eylem-mor .yik{background:var(--ink);color:#fff}
.yapilacak .orta{flex:1;min-width:0}
.yapilacak .orta b{display:block;font-size:15.5px}
.yapilacak .ok{color:var(--faint);font-size:20px}
.adimlar{display:flex;gap:4px;margin:10px 0 4px}
.adimlar i{flex:1;height:5px;border-radius:2px;background:var(--panel3)}
.adimlar i.tamam{background:var(--good)}
.adim{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14.5px}
.adim .kutu{width:22px;height:22px;border-radius:6px;border:2px solid var(--panel3);flex:none;display:grid;place-items:center}
.adim.tamam{color:var(--mut)}.adim.tamam .kutu{background:var(--good);border-color:var(--good)}
.adim.tamam .kutu::after{content:"";width:10px;height:5px;border:2.5px solid #0E1530;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.adim.tamam span{text-decoration:line-through;text-decoration-color:var(--faint)}
.adim button{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink2)}
.miting{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.miting:last-child{border-bottom:0}
.miting .zaman{width:54px;flex:none;text-align:center}
.miting .zaman b{display:block;font-family:var(--disp);font-size:21px;line-height:1}
.miting .zaman span{font-size:11.5px;color:var(--mut)}
.miting.canli .zaman b{color:var(--al2)}
.mt-kucuk{width:auto;margin:0;padding:9px 14px;font-size:14px}
.mt-sahne{position:relative;overflow:hidden;border-top:4px solid var(--parti)}
.mt-sahne::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% -10%,color-mix(in srgb,var(--parti) 22%,transparent),transparent 70%);pointer-events:none}
.mt-sahne>*{position:relative}
.mt-ust{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mt-baslik{font-family:var(--disp);font-size:27px;line-height:1.08;margin:10px 0 12px}
.mt-hatip{display:flex;align-items:center;gap:11px}
.mt-hatip b{font-size:16px}
.mt-olcu{display:flex;align-items:flex-end;gap:14px;margin-top:14px}
.mt-olcu b{font-family:var(--disp);font-size:26px;line-height:1;display:block}
.mt-bar{height:9px;border-radius:9px;background:var(--panel3);overflow:hidden;margin-top:6px}
.mt-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--al),var(--warn) 55%,var(--good));transition:width .8s ease}
.mt-cosku.degisti{animation:mtPop .6s ease}
@keyframes mtPop{40%{transform:scale(1.35);color:var(--warn)}}
.mt-kalabalik{display:flex;align-items:center;gap:0;margin-top:12px;flex-wrap:wrap}
.mt-kalabalik .portre{margin-right:-6px;border:2px solid var(--panel);border-radius:50%}
.mt-kalabalik .kucuk{margin-left:12px}
.mt-soz p{font-size:16.5px;line-height:1.45;margin:4px 0 10px;color:var(--txt);border-left:3px solid var(--ink);padding-left:10px;user-select:text;-webkit-user-select:text}
.mt-tepkiler{display:flex;flex-wrap:wrap;gap:6px}
.mt-tepki{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;background:var(--panel2);font-size:13px;font-weight:700;color:var(--txt2)}
.mt-tepki b{font-family:var(--disp);font-size:15px}
button.mt-tepki{min-height:40px;padding:8px 13px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button.mt-tepki:active{transform:scale(.94)}
.mt-tepki.secili.alkis,.mt-tepki.secili.tezahurat{background:rgba(52,201,138,.18);color:var(--good)}
.mt-tepki.secili.islik,.mt-tepki.secili.yuh{background:var(--albg);color:var(--al2)}
.mt-yaz textarea{width:100%;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);outline:none;font-size:16px;resize:vertical}
.mt-cip{display:inline-block;padding:7px 11px;border-radius:999px;background:var(--inkbg);color:var(--ink2);font-size:13px;font-weight:700;margin:8px 6px 0 0}
.mt-cipler{display:flex;flex-wrap:wrap;margin:6px 0 4px}
.mt-satir{display:flex;gap:8px;margin-top:8px}
.mt-satir input{flex:1;min-width:0;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);outline:none;font-size:16px}
.mt-sesler{max-height:260px;overflow:auto}
.mt-ses{padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.mt-ses:last-child{border-bottom:0}
.mt-ses b{color:var(--ink2);margin-right:4px}
.giris-satir{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.giris-satir:last-child{border-bottom:0}
.giris-satir .yik{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--ink2)}
.giris-satir .yik svg{width:19px;height:19px}
.giris-satir .orta{flex:1;min-width:0}.giris-satir .orta b{display:block}
.giris-satir .ok{color:var(--faint);font-size:20px}

/* Parti kurucu ideolojileri */
.ideoloji-izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.ideoloji-kutu{background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:43px;padding:10px 6px;color:var(--txt);font-size:13px;font-weight:700;cursor:pointer}
.ideoloji-kutu.secili{border-color:var(--ink2);background:rgba(126,106,242,.16);color:var(--ink2)}
/* Ekonomi vitrinleri */
.vit-ana-izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0 0 14px}
.vit-ana-kart{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 12px;color:var(--txt);min-width:0;min-height:132px}
.vit-ana-kart:first-child{grid-column:span 2;border-color:var(--ink2)}.vit-ana-kart b{font-size:18px}.vit-ana-kart span:last-child{font-size:12px;color:var(--mut);line-height:1.4}.vit-ikon{font-size:29px}
.vit-banka{display:block;width:100%;text-align:left;color:var(--txt);margin:10px 0;border:1px solid var(--line);cursor:pointer}
.vit-bas{display:flex;align-items:center;gap:12px}.vit-logo{display:grid;place-items:center;width:52px;height:52px;flex:none;background:var(--bg);border-radius:13px;font-size:28px}.vit-bas .orta{flex:1;min-width:0}.vit-bas .orta b{display:block;font-size:18px}.vit-bas .orta .kucuk{display:block;margin-top:3px}
.vit-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:14px}.vit-stats span{background:var(--bg);padding:10px 6px;border-radius:9px;min-width:0}.vit-stats small{font-size:10px;color:var(--mut);display:block}.vit-stats b{font-size:13px;display:block;overflow-wrap:anywhere;margin-top:5px}
.vit-ozet{display:flex;gap:8px;margin:10px 0}.vit-ozet span{flex:1;padding:13px;background:var(--panel);border-radius:12px;color:var(--mut);font-size:12px}.vit-ozet b{display:block;font-size:24px;color:var(--txt)}
.vit-dugme{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.vit-dugme .btn{margin:0;padding:11px 6px;font-size:14px}
.vit-manset{border:1px solid var(--line2)}.vit-emlak-fiyat{font-size:28px;font-weight:800;color:var(--txt);margin:14px 0}
.vit-kayit{padding:12px 0;border-bottom:1px solid var(--line)}.vit-filtre{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.vit-gazete{margin-top:12px}.vit-gb{border:1px solid var(--ink2)}
@media(max-width:365px){.vit-stats b{font-size:11px}.vit-dugme .btn{font-size:12px}}
/* ---- Portre ---- */
.portre{display:block;border-radius:50%;overflow:hidden;flex:none}
.portre-buyuk{width:84px;height:84px}
.portre-secici{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.portre-secici button{aspect-ratio:1;border-radius:8px;background:var(--bg);border:2px solid transparent;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut)}
.portre-secici button.secili{border-color:var(--ink2);color:var(--txt)}
.portre-secici button span{width:70%;height:70%;border-radius:50%;display:block}

/* ---- Parti pusulası ---- */
.pusula-alan{position:relative;aspect-ratio:1;max-width:340px;margin:6px auto 0;background:var(--bg);border-radius:10px;overflow:hidden}
.pusula-alan svg{display:block;width:100%;height:100%}
.test-soru{padding:12px 0;border-bottom:1px solid var(--line)}
.test-soru p{font-size:15px;margin-bottom:8px}
.test-olcek{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.test-olcek button{padding:9px 0;border-radius:8px;background:var(--bg);font-size:12px;font-weight:700;color:var(--mut)}
.test-olcek button.secili{background:var(--ink);color:#fff}

/* ---- Basın ve otomatik gazete ---- */
.basin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.basin-grid .kart{margin:0}.basin-manset{text-align:center;border-top:3px solid var(--txt);border-bottom:3px double var(--line2)}
.kart.basin-manset h1,.kart.basin-gazete h2,.kart.basin-yazi h2{font-family:Georgia,'Times New Roman',serif;overflow-wrap:anywhere;line-height:1.2;text-transform:none;letter-spacing:normal;color:var(--txt)}
.kart.basin-manset h1{font-size:clamp(28px,7vw,42px);margin:12px 0}.kart.basin-yazi h2{font-size:27px;margin:12px 0}.kart.basin-gazete h2{font-size:25px;margin:14px 0}
.basin-metin{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;margin:18px 0;font-size:16px;color:var(--txt);opacity:1;-webkit-text-fill-color:var(--txt)}
.kart.basin-yazi{background:var(--panel);color:var(--txt);opacity:1}
#gazYayinlar .basin-metin{background:var(--bg);padding:14px;border-radius:8px;user-select:text;-webkit-user-select:text}
#basinForm #gazMetin{display:block;box-sizing:border-box;width:100%;min-height:260px;padding:14px;font-family:inherit;font-size:16px;line-height:1.6;color:var(--txt)!important;-webkit-text-fill-color:var(--txt);
  caret-color:#fff;background:var(--bg)!important;border:1px solid var(--line2);border-radius:10px;outline:none;opacity:1;resize:vertical;user-select:text;-webkit-user-select:text}
#basinForm #gazMetin:focus{border-color:var(--ink2);box-shadow:0 0 0 2px var(--inkbg)}
#gazSayac{font-variant-numeric:tabular-nums;font-weight:700;color:var(--txt2);display:block;margin-top:6px;text-align:right}
.basin-son,.basin-yazar{border-top:1px solid var(--line2);margin-top:14px;padding-top:14px;overflow-wrap:anywhere}
.basin-propaganda,.basin-kilit{padding:12px;background:var(--bg);border-left:3px solid var(--ink2);margin:12px 0;line-height:1.6;border-radius:0 8px 8px 0}
#basinListe,#gazYonetim,#gazYayinlar{overflow-wrap:anywhere}#basinForm textarea{width:100%;resize:vertical}#gazHedefAlan[hidden]{display:none}
.tg-kapak{background:var(--paper);color:var(--paperInk);padding:22px 18px 18px;border-radius:6px;text-align:center;margin-bottom:12px}
.tg-kapak h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(34px,9.5vw,50px);letter-spacing:-.5px;line-height:1.02;font-weight:700;margin:8px 0;color:var(--paperInk);word-break:normal;border-top:3px solid var(--paperInk);border-bottom:3px double var(--paperInk);padding:10px 0}
.tg-kapak h1 span{color:var(--al)}.tg-saat{font-size:12px;font-weight:700;color:#5b6486}
.tg-slogan{font-size:14px;color:#5b6486;font-family:Georgia,serif;font-style:italic}
.tg-baslik-alt{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;border-top:1px solid var(--paperLine);margin-top:12px;padding-top:8px;font-size:12px;color:#5b6486}

.tg-dipnot{font-size:12px;line-height:1.6;color:var(--mut);margin-top:22px;padding-top:14px;border-top:1px solid var(--line2)}

.tg-kart-kisa h2{color:var(--txt)}
</style>
