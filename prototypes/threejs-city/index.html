<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seçim Online | İzometrik Şehir</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1625;color:#f4f7fb;font:15px system-ui,sans-serif;overflow:hidden}
header{position:absolute;z-index:2;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:linear-gradient(#0b1728eb,#0b172800);pointer-events:none}
h1{margin:0;font-size:19px}header p{margin:5px 0;color:#cbd5e1;font-size:12px}
#scene{width:100vw;height:100dvh;touch-action:none}
#panel{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:460px;margin:auto;background:#17283deF;border:1px solid #5c7593;border-radius:18px;padding:17px;box-shadow:0 14px 36px #0008}
#panel[hidden]{display:none}#panel h2{margin:0 0 6px;font-size:20px}#panel p{margin:0 0 14px;color:#d0dbea;line-height:1.45}
button{border:0;border-radius:10px;padding:10px 15px;background:#e5b65c;color:#142238;font-weight:700;cursor:pointer}
#close{float:right;background:#34465d;color:white}
#status{position:absolute;top:calc(86px + env(safe-area-inset-top));left:12px;right:12px;text-align:center;font-size:13px;color:#d4deeb;pointer-events:none}
</style>
</head>
<body>
<header><h1>Seçim Online · Şehir Yönetimi</h1><p>Bağımsız pilot • Canlı oyun ve Supabase bağlantısı yok</p></header>
<div id="scene" aria-label="Etkileşimli üç boyutlu şehir"></div>
<div id="status">Şehri sürükle • İki parmakla yakınlaştır • Binalara dokun</div>
<section id="panel" hidden role="dialog" aria-label="Kurum bilgisi"><button id="close" aria-label="Kapat">✕</button><h2 id="name"></h2><p id="description"></p><button id="action">Kurum ekranı (demo)</button></section>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const host=document.getElementById('scene'),panel=document.getElementById('panel');
const scene=new THREE.Scene();scene.background=new THREE.Color('#a9c9e5');
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);camera.position.set(19,27,29);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x667b83,2.4));
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(8,18,10);scene.add(sun);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enableRotate=false;controls.enablePan=true;controls.screenSpacePanning=true;controls.mouseButtons.LEFT=THREE.MOUSE.PAN;controls.touches.ONE=THREE.TOUCH.PAN;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;controls.maxPolarAngle=Math.PI/2.15;controls.minDistance=9;controls.maxDistance=40;controls.target.set(0,0,0);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
const grass=mat('#78a878'),road=mat('#596675'),line=mat('#f1e3b7');
function cube(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
cube(28,.25,28,grass,0,-.19,0);
cube(28,.035,3,road,0,-.025,0);cube(3,.035,28,road,0,-.02,0);
for(let i=-12;i<=12;i+=4){cube(1.5,.04,.1,line,i,.02,0);cube(.1,.04,1.5,line,0,.03,i)}
const institutions=[
{id:'belediye',name:'Belediye',desc:'Belediye bütçesi, hizmetler, ihaleler ve ruhsat işlemleri.',x:-7,z:-7,color:'#d3b38b',height:3.2},
{id:'banka',name:'Banka',desc:'Hesaplar, krediler, POS, çekler ve mevduat işlemleri.',x:7,z:-7,color:'#7daac8',height:4},
{id:'parti',name:'Parti Merkezi',desc:'Üyelik, parti kasası, kurultay ve seçim yönetimi.',x:-7,z:7,color:'#b18cc5',height:3.5},
{id:'tbmm',name:'TBMM',desc:'Milletvekilleri, kanun teklifleri ve Genel Kurul oylamaları.',x:7,z:7,color:'#d4c5a4',height:3.1}
];
const clickable=[];const labels=[];const labelLayer=document.createElement('div');labelLayer.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:hidden';host.append(labelLayer);
for(const b of institutions){
const main=cube(4,b.height,3.5,mat(b.color),b.x,b.height/2,b.z);main.userData.id=b.id;clickable.push(main);
const roof=cube(4.5,.28,4,mat('#34465b'),b.x,b.height+.14,b.z);roof.userData.id=b.id;clickable.push(roof);
const door=cube(.9,1.5,.06,mat('#32465b'),b.x,.75,b.z+1.79);door.userData.id=b.id;clickable.push(door);
for(let y=1.8;y<b.height-.25;y+=1.05)for(const dx of [-1.25,0,1.25]){const win=cube(.55,.55,.065,mat('#d8f2ff'),b.x+dx,y,b.z+1.8);win.userData.id=b.id;clickable.push(win)}
const base=cube(4.8,.15,4.5,mat('#c5cbd0'),b.x,.02,b.z);base.userData.id=b.id;clickable.push(base);const sign=document.createElement('button');sign.textContent=b.name;sign.style.cssText='position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:#15263de8;color:#fff;border:1px solid #ffffff88;border-radius:8px;padding:7px 11px;font-weight:750;font-size:12px;white-space:nowrap;box-shadow:0 3px 9px #0005';sign.onclick=()=>openBuilding(b);labelLayer.append(sign);labels.push({sign,b});
}
const treeTrunk=mat('#74533a'),leaf=mat('#4b8457');
for(const [x,z] of [[-12,-5],[-12,5],[12,-5],[12,5],[-5,-12],[5,-12],[-5,12],[5,12]]){
cube(.3,1.1,.3,treeTrunk,x,.55,z);const crown=new THREE.Mesh(new THREE.ConeGeometry(1,2.2,7),leaf);crown.position.set(x,2,z);scene.add(crown);
}
function openBuilding(item){document.getElementById('name').textContent=item.name;document.getElementById('description').textContent=item.desc;document.getElementById('action').onclick=()=>alert(item.name+' ekranı canlı oyuna entegrasyon aşamasında bağlanacak.');panel.hidden=false}const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let start=null;
renderer.domElement.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{
if(!start||Math.hypot(e.clientX-start.x,e.clientY-start.y)>9)return;
const rect=renderer.domElement.getBoundingClientRect();pointer.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1);
ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(clickable)[0];if(!hit)return;
const item=institutions.find(b=>b.id===hit.object.userData.id);if(!item)return;
openBuilding(item);
});
document.getElementById('close').onclick=()=>panel.hidden=true;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const projection=new THREE.Vector3();renderer.setAnimationLoop(()=>{controls.update();for(const {sign,b} of labels){projection.set(b.x,b.height+1.4,b.z).project(camera);sign.style.left=((projection.x+1)*innerWidth/2)+'px';sign.style.top=((1-projection.y)*innerHeight/2)+'px';sign.style.display=projection.z>0&&projection.z<1?'block':'none'}renderer.render(scene,camera)});
</script>
</body></html>
