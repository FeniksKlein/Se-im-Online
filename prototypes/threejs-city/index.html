<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Seçim Online | Ankara</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #123; }
  body {
    font: 15px/1.4 "Liberation Sans", "DejaVu Sans", system-ui, sans-serif;
    color: #142033;
    touch-action: none;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag {
    position: absolute;
    transform: translate(-50%, -120%);
    background: rgba(16, 32, 48, 0.88);
    color: #fff;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
    box-shadow: 0 6px 16px rgba(0,0,0,.28);
    white-space: nowrap;
  }
  .tag.on { background: #8a5a12; border-color: #ffe1a3; }
  header {
    position: fixed; z-index: 2; top: 0; left: 0; right: 138px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 18px;
    background: linear-gradient(#0d1b2ce8, #0d1b2c00);
    color: #f7f4ee;
    pointer-events: none;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 750; }
  header p { margin: 2px 0 0; color: #d5deea; font-size: 12px; }
  #reset, #hint, #status {
    position: fixed; z-index: 3;
  }
  #reset {
    top: calc(12px + env(safe-area-inset-top));
    right: 12px;
    border: 0; border-radius: 999px;
    padding: 10px 12px;
    background: rgba(20, 36, 54, .88);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  #hint, #status {
    left: 12px; right: 12px; text-align: center;
    color: #163044;
    font-size: 13px; font-weight: 650;
    pointer-events: none;
  }
  #hint {
    bottom: calc(18px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.9);
    border-radius: 999px;
    padding: 8px 12px;
    margin: 0 auto;
    max-width: 520px;
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
  }
  #hint.gone { opacity: 0; transition: opacity .4s ease; }
  #status {
    top: 46%;
    background: rgba(255,255,255,.92);
    border-radius: 12px;
    padding: 12px;
  }
  #panel { position: fixed; z-index: 4; inset: auto 0 0 0; }
  #panel[hidden] { display: none; }
  .sheet {
    margin: 0 auto;
    max-width: 560px;
    background: #f7f3ea;
    color: #1b2430;
    border-radius: 22px 22px 0 0;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 -12px 40px rgba(0,0,0,.28);
  }
  .grab { width: 42px; height: 4px; border-radius: 99px; background: #c9c0b0; margin: 2px auto 8px; }
  .kicker { margin: 0; color: #8a5a12; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .sheet h2 { margin: 2px 64px 8px 0; font-size: 22px; }
  #desc { margin: 0 0 12px; color: #3d4a5c; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stats div { background: #fff; border-radius: 12px; padding: 8px; text-align: center; box-shadow: inset 0 0 0 1px #eadfcd; }
  .stats strong { display: block; font-size: 16px; }
  .stats span { color: #66758a; font-size: 11px; }
  .note, #action-note { margin: 0 0 10px; color: #6a5640; font-size: 12px; }
  #action-note { color: #8a3b2b; font-weight: 700; }
  button.primary, #close {
    border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 800; cursor: pointer;
  }
  button.primary { width: 100%; background: #1f4d3a; color: #f4efe4; }
  #close {
    position: absolute; top: 18px; right: max(16px, calc((100% - 560px) / 2 + 16px));
    background: #e7e0d2; color: #1b2430;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<header>
  <h1>Seçim Online · Ankara</h1>
  <p>Çankaya kurum mahallesi · canlı oyuna bağlı değil</p>
</header>
<button id="reset" type="button">Genel görünüm</button>
<div id="scene" aria-label="İzometrik şehir"></div>
<div id="labels"></div>
<p id="hint">Bir parmakla kaydır · iki parmakla yakınlaştır · kuruma dokun</p>
<p id="status" hidden></p>
<section id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="name">
  <div class="sheet">
    <div class="grab"></div>
    <button id="close" type="button">Kapat</button>
    <p class="kicker" id="kicker"></p>
    <h2 id="name"></h2>
    <p id="desc"></p>
    <div class="stats" id="stats"></div>
    <p class="note">Örnek sayılar. Bu demo Supabase’e ve canlı oyuna yazmaz.</p>
    <button id="action" class="primary" type="button">Kurum masasını aç</button>
    <p id="action-note" hidden>Canlı kurum ekranı bu demoda kapalı. Bağlantı ayrıca tasarlanacak.</p>
  </div>
</section>
<script type="module" src="./js/main.js"></script>
</body>
</html>
